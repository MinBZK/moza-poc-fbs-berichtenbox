# Externe images volledig gekwalificeerd (`docker.io/…`, `ghcr.io/…`): Docker vult die prefix
# impliciet aan, podman alleen met ingestelde `unqualified-search-registries` en faalt anders
# non-interactief. De zelfgebouwde `fbs-demo/…`-images blijven kaal; compose.podman.yaml zet daar
# `localhost/` voor.
#
# `DEMO_BIND` bepaalt op welk hostadres de stack publiceert; default `127.0.0.1`, en verder wordt
# alleen `0.0.0.0` ondersteund — `demo/podman-up.sh` controleert elke service over 127.0.0.1 en een
# specifiek adres laat die controles aflopen. Zonder die binding staat de hele demo op élke
# interface van de machine: Redis zonder wachtwoord, vier PostgreSQL-instanties met
# demo-credentials en de WireMock-admin-API's. Op een ontwikkelmachine
# aan een kantoor- of thuisnetwerk is dat het hele subnet.
#
# Wil je de demo aan iemand anders tonen, zet 'm dan bewust open met `DEMO_BIND=0.0.0.0`, in plaats
# van dat het de default is. `demo-console` doet hier NIET aan mee en
# blijft altijd op loopback; zie de toelichting daar.
services:
  redis:
    image: docker.io/redis/redis-stack-server:7.4.0-v3
    ports:
      - "${DEMO_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Deze twee stubs bedienen geen dev- of demo-pad: die gebruiken de echte magazijnen op
  # 8090/8091. Het poortenpaar 8081/8082 komt wel voor als registeradres in testprofielen,
  # onder meer in de uitvraag en de sessiecache-library. Opruimen is dus niet enkel deze
  # services schrappen: het aanmeld-pad resolvet de afzender-OIN via het register, dus zo'n
  # inschrijving draagt iets, ook al wordt de URL nooit gebeld.
  magazijn-a:
    image: docker.io/wiremock/wiremock:3.13.2
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8081:8080"
    volumes:
      - ./wiremock/magazijn-a/mappings:/home/wiremock/mappings
      - ./wiremock/magazijn-a/__files:/home/wiremock/__files
    command: ["--verbose", "--global-response-templating"]

  magazijn-b:
    image: docker.io/wiremock/wiremock:3.13.2
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8082:8080"
    volumes:
      - ./wiremock/magazijn-b/mappings:/home/wiremock/mappings
      - ./wiremock/magazijn-b/__files:/home/wiremock/__files
    command: ["--verbose", "--global-response-templating"]

  # MOZA Profiel Service stub voor berichtenmagazijn — simuleert het ophalen van
  # een partij (BSN/KVK/RSIN) inclusief OntvangViaBerichtenbox-voorkeur en scope
  # naar een afzender-OIN. Default mapping geeft een actieve voorkeur voor het
  # test-OIN 00000000000000100000 (magazijn A); voor 403-rookproef is er een mapping op BSN
  # 111222333 die een partij zonder voorkeuren teruggeeft.
  profiel-service:
    image: docker.io/wiremock/wiremock:3.13.2
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8089:8080"
    volumes:
      # Gedeelde mappings met de ZAD externe-stubs-image (profiel + notificatie). WireMock
      # laadt álle mappings in deze map, dus ook notificatie-events.json (POST /events); lokaal
      # roept de profielclient die alleen niet aan (de notificatie-stub draait apart op 8084).
      - ./wiremock/externe-stubs/mappings:/home/wiremock/mappings
      # Demo-only persona-voorkeuren, als subdir (WireMock laadt recursief). Apart gehouden
      # zodat de elfproef-geldige persona-BSN's níet in het publieke externe-stubs-image komen.
      - ./wiremock/demo-profiel/mappings:/home/wiremock/mappings/demo-profiel
      # Gegenereerde Grootbedrijf-persona-stub (fase 6). WireMock laadt recursief.
      - ./demo/generated/profiel:/home/wiremock/mappings/demo-profiel-generated
    command: ["--verbose"]

  # Aanmeld- en Notificatie-stubs voor de Publicatie Stream. Ontvangen CloudEvents
  # `nl.rijksoverheid.fbs.bericht.gepubliceerd` op POST /events. Draaien standaard
  # mee: de outbox-poller heeft deze downstreams nodig om claims af te leveren, dus
  # `docker compose up -d` test lokaal de volledige keten. Zonder deze stubs blijft
  # de poller claims herproberen en stapelen de WARN/ERROR-logs zich op.
  # Tests gebruiken een embedded JDK HttpServer en hebben deze containers niet nodig.
  aanmeld-stub:
    image: docker.io/wiremock/wiremock:3.13.2
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8083:8080"
    volumes:
      - ./wiremock/aanmeld-stub/mappings:/home/wiremock/mappings
    command: ["--verbose", "--global-response-templating"]

  notificatie-stub:
    image: docker.io/wiremock/wiremock:3.13.2
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8084:8080"
    volumes:
      - ./wiremock/notificatie-stub/mappings:/home/wiremock/mappings
    command: ["--verbose", "--global-response-templating"]

  # LDV-logboek van de uitvraag. Elke organisatie voert een eigen verwerkingenlogboek;
  # de magazijnen schrijven daarom in hun eigen postgres-a/-b, de uitvraag hier.
  postgres-uitvraag:
    image: docker.io/library/postgres:18
    ports:
      - "${DEMO_BIND:-127.0.0.1}:5434:5432"
    environment:
      POSTGRES_USER: ldv
      POSTGRES_PASSWORD: ldv
      POSTGRES_DB: ldv_logging
    volumes:
      - postgres-data-uitvraag:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldv -d ldv_logging"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-a:
    image: docker.io/library/postgres:18
    ports:
      - "${DEMO_BIND:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: berichtenmagazijn
      POSTGRES_PASSWORD: berichtenmagazijn
      POSTGRES_DB: berichtenmagazijn
    # Postgres 18+ verwacht een mount op /var/lib/postgresql (zonder /data); de
    # data komt in een major-version-subdirectory (`/var/lib/postgresql/18/docker`).
    # Zo blijft `pg_upgrade --link` mogelijk bij toekomstige major upgrades.
    # Zie https://github.com/docker-library/postgres/pull/1259.
    volumes:
      - postgres-data-a:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berichtenmagazijn -d berichtenmagazijn"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-b:
    image: docker.io/library/postgres:18
    ports:
      - "${DEMO_BIND:-127.0.0.1}:5433:5432"
    environment:
      POSTGRES_USER: berichtenmagazijn
      POSTGRES_PASSWORD: berichtenmagazijn
      POSTGRES_DB: berichtenmagazijn
    volumes:
      - postgres-data-b:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berichtenmagazijn -d berichtenmagazijn"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Demo-stack: alleen actief met `--profile demo`. Zonder profiel start compose de infra
  # en draai je de services met `quarkus:dev` (hot reload behouden; in een container kost
  # elke codewijziging een image-build). QUARKUS_PROFILE=dev is bewust: OutboundTlsValidator
  # staat plaintext http alleen toe in dev en test, en de stubs spreken geen https.
  #
  # Images bouwen met jib (geen Dockerfile):
  #   ./mvnw clean package -DskipTests \
  #     -pl services/berichtenmagazijn,services/berichtenuitvraag,demo/demo-console,demo/magazijn-simulator -am \
  #     -Dquarkus.container-image.build=true \
  #     -Dquarkus.container-image.group=fbs-demo -Dquarkus.container-image.tag=demo
  #
  # QUARKUS_HTTP_HOST staat expliciet op 0.0.0.0: in NORMAL launch mode is dat al de
  # default, maar Quarkus bindt in dev *mode* op localhost. Bij de combinatie "profiel
  # dev, launch mode normal" sluit dit die twijfel uit — bindt de service op localhost,
  # dan is de gepubliceerde poort dood.
  berichtenmagazijn-a:
    image: fbs-demo/fbs-berichtenmagazijn:demo
    profiles: [demo]
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8090:8090"
    depends_on:
      postgres-a:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_HTTP_HOST: 0.0.0.0
      DB_JDBC_URL: jdbc:postgresql://postgres-a:5432/berichtenmagazijn
      MAGAZIJN_OIN: "00000000000000100000"
      # Downstreams (aanmeld=echte uitvraag-webhook, notificatie) lopen via Toxiproxy zodat fase 5
      # ze per knop kan uitschakelen. Transparant bij normaal bedrijf. De aanmeld-levering laat een
      # nieuw bericht live in de sessiecache belanden (mits actieve sessie), zodat 'Vernieuw' werkt.
      AANMELD_URL: http://toxiproxy:18086/api/v1/aanmeldingen
      NOTIFICATIE_URL: http://toxiproxy:18084/events
      PROFIEL_SERVICE_URL: http://profiel-service:8080
      # Geen LDV-env: onder %dev volgt het logboek DB_JDBC_URL hierboven. LDV_POSTGRES_* hier
      # alsnog zetten werkt niet — de %dev-regel van het magazijn leest de datasource, niet die
      # env-var. Bij de uitvraag verderop kán het wél; die %dev-regel leest LDV_POSTGRES_URL zelf.
      # Outbox sneller laten pollen zodat storing→herstel binnen seconden zichtbaar is (default 60s),
      # en meer pogingen zodat een uitgeschakelde downstream niet terminal MISLUKT tijdens de uitleg.
      MAGAZIJN_PUBLICATIE_POLLING_INTERVAL: 5s
      MAGAZIJN_PUBLICATIE_DOWNSTREAMS_AANMELD_MAX_POGINGEN: "50"
      MAGAZIJN_PUBLICATIE_DOWNSTREAMS_NOTIFICATIE_MAX_POGINGEN: "50"

  # Beide magazijn-containers luisteren intern op 8090; alleen de gepubliceerde poort verschilt.
  # Adressering naar b loopt daarom ook op 8090 — via de Toxiproxy-proxy (18091) voor de uitvraag,
  # rechtstreeks op berichtenmagazijn-b:8090 voor de demo-console.
  berichtenmagazijn-b:
    image: fbs-demo/fbs-berichtenmagazijn:demo
    profiles: [demo]
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8091:8090"
    depends_on:
      postgres-b:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_HTTP_HOST: 0.0.0.0
      DB_JDBC_URL: jdbc:postgresql://postgres-b:5432/berichtenmagazijn
      MAGAZIJN_OIN: "00000001823288444000"
      # Downstreams via Toxiproxy (zie magazijn-a). Beide magazijnen delen de proxies aanmeld/notificatie.
      AANMELD_URL: http://toxiproxy:18086/api/v1/aanmeldingen
      NOTIFICATIE_URL: http://toxiproxy:18084/events
      PROFIEL_SERVICE_URL: http://profiel-service:8080
      # Geen LDV-env: het logboek volgt DB_JDBC_URL hierboven, net als bij magazijn A.
      MAGAZIJN_PUBLICATIE_POLLING_INTERVAL: 5s
      MAGAZIJN_PUBLICATIE_DOWNSTREAMS_AANMELD_MAX_POGINGEN: "50"
      MAGAZIJN_PUBLICATIE_DOWNSTREAMS_NOTIFICATIE_MAX_POGINGEN: "50"

  # Netwerk-storingssimulator tussen de uitvraag en zijn afhankelijkheden. Proxies vast uit
  # /proxies.json; de demo-console voegt runtime toxics toe via de admin-API (:8474).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [demo]
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8474:8474"
    volumes:
      - ./toxiproxy/proxies.json:/proxies.json:ro
    command: ["-host=0.0.0.0", "-config=/proxies.json"]

  # De gesimuleerde magazijnen: één service die er tientallen bedient, elk op pad-prefix
  # /magazijn/<OIN>. Welke dat zijn komt uit demo/generated/ — draai eerst
  # demo/genereer-magazijnen.py; hetzelfde artefact vult het register van de uitvraag.
  #
  # Dit verving de WireMock-antwoordmachines van fase 6. Die konden geen toestand dragen: een PATCH
  # verdween in het niets en de volgende GET toonde weer de oude waarde, dus mappen en leesstatus —
  # precies wat we over veel magazijnen willen tonen — waren alleen op de twee echte magazijnen te
  # demonstreren. De simulator slaat wél op, en genereert uit dezelfde OpenAPI-spec als het echte
  # magazijn.
  postgres-simulator:
    image: docker.io/library/postgres:18
    profiles: [demo]
    ports:
      - "${DEMO_BIND:-127.0.0.1}:5435:5432"
    environment:
      POSTGRES_USER: magazijnsimulator
      POSTGRES_PASSWORD: magazijnsimulator
      POSTGRES_DB: magazijnsimulator
    # Meer verbindingen dan de standaard honderd: dit is de database van één service die er honderd
    # voorstelt, en die houdt bij een volle fan-out honderdtwintig connecties aan (DB_POOL_MAX).
    # Honderd is daarvoor te krap, en die grens raken levert dezelfde storing op als een te kleine
    # pool — de Berichtenbox ziet magazijnen die er niet zijn.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres-data-simulator:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magazijnsimulator -d magazijnsimulator"]
      interval: 5s
      timeout: 3s
      retries: 5

  magazijn-simulator:
    image: fbs-demo/fbs-magazijn-simulator:demo
    profiles: [demo]
    ports:
      # Uitsluitend op loopback, net als de demo-console en om dezelfde reden: onder %dev draait het
      # beheerpad zonder token, en `POST /beheer/legen` wist alle berichten van alle gesimuleerde
      # magazijnen. Met DEMO_BIND=0.0.0.0 zou dat vanaf het hele subnet bereikbaar zijn. De uitvraag
      # benadert de simulator container-intern en heeft de gepubliceerde poort niet nodig.
      - "127.0.0.1:8092:8092"  # NIET via DEMO_BIND
    depends_on:
      postgres-simulator:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_HTTP_HOST: 0.0.0.0
      DB_JDBC_URL: jdbc:postgresql://postgres-simulator:5432/magazijnsimulator
      # De set die deze instantie voorstelt, uit hetzelfde artefact dat het register van de uitvraag
      # vult. SmallRye leest dit absolute pad als extra config-bron.
      SMALLRYE_CONFIG_LOCATIONS: /demo-config/magazijn-simulator.properties
      # Lokaal geen token: het beheerpad zit op loopback en de simulator eist er alleen buiten dev en
      # test een. Op een gedeelde omgeving hoort BEHEER_TOKEN wél gezet te zijn.
    volumes:
      - ./demo/generated/magazijn-simulator.properties:/demo-config/magazijn-simulator.properties:ro

  berichtenuitvraag:
    image: fbs-demo/fbs-berichtenuitvraag:demo
    profiles: [demo]
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8086:8086"
    depends_on:
      redis:
        condition: service_healthy
      berichtenmagazijn-a:
        condition: service_started
      berichtenmagazijn-b:
        condition: service_started
      toxiproxy:
        condition: service_started
      postgres-uitvraag:
        condition: service_healthy
      magazijn-simulator:
        condition: service_started
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_HTTP_HOST: 0.0.0.0
      # Alle uitvraag-afhankelijkheden lopen via Toxiproxy (transparant bij normaal bedrijf). De
      # gesimuleerde magazijnen niet: die hebben hun storingsgedrag in zichzelf, en per magazijn
      # verschillend — een proxy kan een verbinding alleen helemaal open of dicht zetten.
      REDIS_HOSTS: redis://toxiproxy:16379
      MAGAZIJN_A_URL: http://toxiproxy:18090
      MAGAZIJN_B_URL: http://toxiproxy:18091
      PROFIEL_SERVICE_URL: http://toxiproxy:18089
      # Het logboek moet expliciet: de %dev-default is een localhost-adres (bedoeld voor
      # draaien op de host), en localhost is binnen een container de container zelf.
      # Gebruiker, wachtwoord en databasenaam moeten gelijk blijven aan wat
      # postgres-uitvraag hierboven zet; niets in compose bewaakt dat.
      LDV_POSTGRES_URL: jdbc:postgresql://postgres-uitvraag:5432/ldv_logging
      LDV_POSTGRES_USERNAME: ldv
      LDV_POSTGRES_PASSWORD: ldv
      # CORS voor de Berichtenbox-UI (:8095). Runtime-property, dus geen rebuild nodig, en
      # alleen in het demo-profiel. Methods en headers blijven ongezet; die spiegelt Quarkus
      # uit het preflight-verzoek.
      QUARKUS_HTTP_CORS_ENABLED: "true"
      # De allowlist hoort er expliciet bij: enabled zónder origins laat Quarkus alleen
      # same-origin door, en de UI op :8095 roept deze API op :8086 aan — dat is cross-origin
      # en zou 403 geven. De UI leidt de API-host bovendien af uit de browser-locatie, dus elk
      # adres waarop de demo geopend wordt moet hier staan. Zet DEMO_HOST op het VM- of
      # container-adres; de default localhost dekt de gewone lokale demo.
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:8095,http://127.0.0.1:8095,http://${DEMO_HOST:-localhost}:8095"
      # Korte cache-TTL voor de demo (sliding verval na ~2 min inactiviteit). Alleen demo;
      # prod houdt PT12H. De property heeft geen min-validatie.
      BERICHTENSESSIECACHE_TTL: PT2M
      # Extra register-entries voor de gesimuleerde magazijnen, gegenereerd in demo/generated/.
      # SmallRye leest dit absolute pad als additionele config-bron en merge't het bij de baked A/B.
      SMALLRYE_CONFIG_LOCATIONS: /demo-config/magazijnen-register.properties
      # Bulkhead ruim boven het aantal magazijnen van de grootste ondernemer (100), zodat er bij veel
      # magazijnen niet een deel als OVERBELAST wordt geweigerd. Alleen demo; prod houdt de default
      # (20). Wat er gebeurt als de bulkhead wél de bottleneck wordt, is een eigen scenario — dat
      # meet stap 6 van het simulator-ontwerp.
      BERICHTENSESSIECACHE_MAGAZIJN_BULKHEAD_MAX_CONCURRENT: "120"
    volumes:
      - ./demo/generated/magazijnen-register.properties:/demo-config/magazijnen-register.properties:ro

  # Wegwerp-bediening (legen/vullen/random). Aanleveren gaat via de magazijn-HTTP-API;
  # legen gaat via directe JDBC op de magazijn-databases (vandaar de DB-URL's).
  demo-console:
    image: fbs-demo/fbs-demo-console:demo
    profiles: [demo]
    ports:
      # Uitsluitend op loopback publiceren. Deze console heeft geen authenticatie en
      # POST /api/demo/legen doet een TRUNCATE op beide magazijn-databases; op 0.0.0.0 is dat
      # vanaf het hele netwerk bereikbaar. De Berichtenbox-UI praat sowieso alleen vanaf
      # localhost (vaste API-basis localhost:8086 plus de CORS-allowlist van de uitvraag).
      - "127.0.0.1:8095:8095"  # NIET via DEMO_BIND: zie de toelichting hierboven
    depends_on:
      berichtenmagazijn-a:
        condition: service_started
      berichtenmagazijn-b:
        condition: service_started
      magazijn-simulator:
        condition: service_started
      toxiproxy:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_HTTP_HOST: 0.0.0.0
      TOXIPROXY_ADMIN_URL: http://toxiproxy:8474
      # Direct op Redis (niet via Toxiproxy) voor de cache-verval-knop.
      REDIS_HOSTS: redis://redis:6379
      # Uitvraag-aanmeld-webhook voor de ontdubbeling-knop (fase 5).
      UITVRAAG_URL: http://berichtenuitvraag:8086
      MAGAZIJN_A_URL: http://berichtenmagazijn-a:8090
      MAGAZIJN_B_URL: http://berichtenmagazijn-b:8090
      MAGAZIJN_A_DB_URL: jdbc:postgresql://postgres-a:5432/berichtenmagazijn
      MAGAZIJN_B_DB_URL: jdbc:postgresql://postgres-b:5432/berichtenmagazijn
      # De console vraagt het aantal magazijnen aan de simulator zelf; er is hier bewust geen tweede
      # getal dat daarmee uit de pas kan lopen.
      MAGAZIJN_SIMULATOR_URL: http://magazijn-simulator:8092

volumes:
  postgres-data-a:
  postgres-data-simulator:
  postgres-data-b:
  postgres-data-uitvraag:
