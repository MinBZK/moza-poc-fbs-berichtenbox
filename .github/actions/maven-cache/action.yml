name: Maven-cache
description: >-
  Zet de CI-settings met de Central-spiegel neer en herstelt de lokale Maven-repository. Alleen
  main bewaart de cache; PR's en de merge queue herstellen hem alleen. Plaats deze stap ná
  actions/setup-java: die schrijft zijn eigen ~/.m2/settings.xml, en die moet hier overschreven
  worden.

# Waarom niet `cache: maven` van setup-java:
# - Eén sleutel voor alle jobs. De job die het eerst klaar is (detekt: alleen plugins) bewaart een
#   halve repository onder die sleutel; elke andere job krijgt daarna een "hit" zonder zijn eigen
#   dependencies en haalt ze bij elke run opnieuw op, zonder dat iemand de cache ooit aanvult.
# - Geen terugval. Elke pom-wijziging, ook elke Dependabot-bump, geeft alle jobs tegelijk een
#   lege repository, en die piek vanaf de gedeelde runner-adressen beantwoordt Central met 429.
# - Elke PR en elke merge-queue-entry bewaart een eigen kopie. Samen kwam dat boven de 10 GB per
#   repository, en dan gooit GitHub caches weg die nog gebruikt worden.
#
# Main bewaart zonder `restore-keys`, dus elke sleutel begint leeg en bevat alleen wat die
# pom-stand nodig heeft. Met een terugval zou de cache bij elke versiebump de oude versie
# meenemen en ongemerkt blijven groeien. De koude start op main gaat via de spiegel.

inputs:
  scope:
    description: >-
      Welk deel van de reactor deze job bouwt, bv. `detekt` of `test-berichtenmagazijn`. Jobs met
      verschillende dependencies krijgen elk een eigen cache, zodat de ene de andere niet half
      vult.
    required: true

runs:
  using: composite
  steps:
    - name: CI-settings met de Central-spiegel
      shell: bash
      env:
        SETTINGS: ${{ github.action_path }}/settings.xml
      run: install -D -m 0644 "$SETTINGS" "$HOME/.m2/settings.xml"

    - name: Maven-cache herstellen en bewaren
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: maven-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}

    # Een PR mag de cache van main lezen maar niet zelf bewaren: dat laatste vulde de 10 GB. Na
    # een pom-wijziging komt de laatste cache van dezelfde scope terug, en anders die van een
    # andere scope; Maven haalt dan alleen het verschil op.
    - name: Maven-cache herstellen
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: maven-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: |
          maven-${{ runner.os }}-${{ inputs.scope }}-
          maven-${{ runner.os }}-
