name: ClusterFuzzLite PR fuzzing
on:
  # Uitsluitend als aangeroepen workflow: deze fuzzing draaide al alleen voor PR's naar main, en
  # dat is precies wanneer deploy.yml draait. Door hem daar aan te roepen kan de deploy er met
  # `needs:` aan hangen in plaats van op de check-run te pollen — een pollende job houdt een
  # runner bezet zonder werk te doen. Een gestapelde PR fuzzt dus nog steeds niet; die dekking
  # komt bij de PR naar main.
  workflow_call:
    inputs:
      fuzz-relevant:
        description: >-
          Uitkomst van de gedeelde wijzigingsdetectie in deploy.yml. Leeg (de default) betekent
          "niet meegegeven", en dan bepaalt deze workflow het zelf — zo blijft hij zelfstandig
          bruikbaar op een gestapelde PR.
        type: string
        required: false
        default: ""

permissions: read-all

jobs:
  # Bepaalt of er fuzz-relevante bronnen zijn gewijzigd. De fuzz-job is hieraan gegate i.p.v. via
  # een workflow-niveau paths-filter: `PR` is een required status check, en een paths-filter zou de
  # check bij niet-relevante PR's (docs, bruno, workflows) nooit rapporteren en de merge eeuwig
  # blokkeren. Een via `if` overgeslagen job telt daarentegen als 'skipped' = succes voor branch
  # protection. Om diezelfde reden gate't deploy.yml niet de aanroep van deze workflow maar geeft
  # het de uitkomst als input door: een niet-aangeroepen workflow rapporteert helemaal niets.
  # Draait alleen wanneer de caller de uitkomst niet meegaf; zie de toelichting in test.yml.
  changes:
    if: inputs.fuzz-relevant == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.fuzz }}
    steps:
      # Een gestruikelde checkout laat het script ontbreken of staat het er juist compleet — dat
      # laatste kan ook, want checkout kan ná het uitpakken nog falen. Beide gevallen zijn afgedekt:
      # de stap hieronder valt bij elke onvolledige uitkomst terug op alles draaien.
      # `continue-on-error` houdt deze job daarbij groen, want een rode `changes` maakt de conclusie
      # van deze workflow — en daarmee de required check die eraan hangt — rood, terwijl het vangnet
      # de keten al veilig heeft gezet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Dezelfde detectie als de overige workflows, inclusief het fail-safe-gedrag rond `gh api`:
      # zonder dat vangnet levert een API-hik of een grep-fout `run=false`, en slaat de required
      # check `PR` stil over.
      - name: Detecteer fuzz-relevante wijzigingen
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail

          # Bufferen, op de vier sleutels filteren en pas dan publiceren: zie de toelichting bij
          # dezelfde stap in deploy.yml.
          .github/scripts/publiceer-uitkomsten.sh

  PR:
    needs: changes
    # Sla alleen over bij een expliciete 'false'; zie de toelichting in test.yml.
    if: "!cancelled() && needs.changes.outputs.run != 'false' && inputs.fuzz-relevant != 'false'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Bewust ZONDER `persist-credentials: false`, in tegenstelling tot de overige checkouts in
      # deze repository: ClusterFuzzLite bepaalt bij `mode: code-change` de geraakte fuzz-doelen uit
      # een diff en doet daarvoor zijn eigen git-verkeer in deze werkboom. Zou dat verkeer een
      # credential nodig blijken te hebben, dan is de uitkomst niet een rode check maar "nul
      # geraakte doelen" — de required check `PR` rapporteert dan groen zonder te fuzzen. Die
      # aanname is hier niet beproefd, dus wordt hij niet blind gewijzigd.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          keep-unaffected-fuzz-targets: true
          # De bad-build-check start elk fuzz-doel apart op (~161s, inclusief het kopiëren van
          # de meegebundelde JDK). Een doel dat niet compileert komt hier sowieso niet doorheen:
          # dan faalt de build zelf. Wat deze check extra ving is een doel dat wél compileert maar
          # bij het starten omvalt; dat blijft hier onopgemerkt tot de wekelijkse cron, waar de
          # check bewust wél aan staat. Die vertraging is de 161s per wijziging waard.
          bad-build-check: false
      - name: Run Fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 60
          mode: code-change
