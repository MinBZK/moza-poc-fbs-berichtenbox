name: detekt

on:
  # deploy.yml roept deze workflow aan voor PR's naar main en voor pushes naar main. Daar hangt
  # de deploy er met `needs:` aan, in plaats van in een eigen job op de check-run te pollen —
  # een pollende job houdt een runner bezet zonder werk te doen.
  workflow_call:
    inputs:
      wijzigingen-relevant:
        description: >-
          Uitkomst van de gedeelde wijzigingsdetectie in deploy.yml. Leeg (de default) betekent
          "niet meegegeven", en dan bepaalt deze workflow het zelf — zo blijft hij zelfstandig
          bruikbaar op een gestapelde PR.
        type: string
        required: false
        default: ""
  # Het complement van deploy.yml's `branches: [main]`, dat op de DOELbranch filtert. Een
  # gestapelde PR (base = een feature-branch) draait deploy.yml niet en heeft deze workflow dus
  # zelfstandig nodig: zonder analyse komen bevindingen pas aan het licht op de PR naar main,
  # vermengd met de rest van de stapel. Voor een PR naar main roept deploy.yml deze workflow aan;
  # zonder dit filter zou detekt dan twee keer draaien. De asymmetrie — wel toetsen, niet
  # deployen — is opzet.
  pull_request:
    branches-ignore: [main]
  workflow_dispatch:

# Geen `read-all`: als aangeroepen workflow mag dit nooit meer zijn dan de caller-job toekent, en
# die kent alleen toe wat hier daadwerkelijk nodig is. De `changes`-job leest de bestandenlijst van
# de PR; de `detekt`-job verhoogt zelf naar security-events: write voor de SARIF-upload.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: detekt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bepaalt of er iets buiten documentatie en repo-meta is gewijzigd. De detekt-gate is hieraan
  # gegate, maar de workflow zelf draait wél door — zo wordt de required status check ook bij een
  # docs-only PR gerapporteerd: een via `if` overgeslagen job telt als 'skipped' = succes voor
  # branch protection.
  # Draait alleen wanneer de caller de uitkomst niet meegaf; zie de toelichting in test.yml.
  changes:
    if: inputs.wijzigingen-relevant == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    # Alleen lezen, en expliciet in plaats van de workflow-brede rechten: deze job checkt de PR uit
    # en voert er een script uit. Zo erft hij niet stilzwijgend mee wanneer de workflow er ooit een
    # schrijfrecht bij krijgt.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Een gestruikelde checkout laat het script ontbreken of staat het er juist compleet — dat
      # laatste kan ook, want checkout kan ná het uitpakken nog falen. Beide gevallen zijn afgedekt:
      # de stap hieronder valt bij elke onvolledige uitkomst terug op alles draaien.
      # `continue-on-error` houdt deze job daarbij groen, want een rode `changes` maakt de conclusie
      # van deze workflow — en daarmee de required check die eraan hangt — rood, terwijl het vangnet
      # de keten al veilig heeft gezet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # De ongebruikte sleutels landen wel in $GITHUB_OUTPUT, maar zijn hier geen job-output.
      - name: Detecteer wijzigingen die de code raken
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail

          # Bufferen, op de vier sleutels filteren en pas dan publiceren: zie de toelichting bij
          # dezelfde stap in deploy.yml.
          uitkomsten=$(.github/scripts/wijzigingsfilter.sh) || uitkomsten=""
          uitkomsten=$(grep -E '^(run|deploy|demo-only|fuzz)=(true|false)$' <<<"$uitkomsten" | sort -u) || true

          sleutels=$(cut -d= -f1 <<<"$uitkomsten" | sort -u | grep -c .) || true

          if [ "$(grep -c . <<<"$uitkomsten")" != 4 ] || [ "$sleutels" != 4 ]; then
            echo "::error::Wijzigingsdetectie leverde geen vier geldige uitkomsten — alles draait fail-safe."
            uitkomsten=$'run=true\ndeploy=true\ndemo-only=false\nfuzz=true'
          fi

          printf '%s\n' "$uitkomsten" >> "$GITHUB_OUTPUT"

  detekt:
    needs: changes
    # Sla alleen over bij een expliciete 'false'; zie de toelichting in test.yml.
    if: "!cancelled() && inputs.wijzigingen-relevant != 'false' && needs.changes.outputs.run != 'false'"

    # Naam onderscheidt deze build-gate van de gelijknamige code-scanning-check die
    # GitHub Advanced Security post (SARIF tool.name "detekt"). Required status check.
    name: detekt-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # detekt analyseert bronnen (geen compile/tests nodig); de complexity-gate
      # (detekt.yml maxIssues) laat de stap falen bij nieuwe complexiteit boven budget.
      - name: Run detekt
        run: ./mvnw -B detekt:check
      # SARIF ook uploaden als detekt faalt (bv. budget-overschrijding), zodat bevindingen
      # zichtbaar blijven in het code-scanning-dashboard. Per module een aparte upload met
      # eigen `category`: code scanning weigert sinds 2025 meerdere SARIF-runs onder dezelfde
      # category. De hashFiles-guard slaat upload over als een module geen rapport opleverde.
      - name: Upload SARIF — fbs-common
        if: ${{ always() && hashFiles('libraries/fbs-common/target/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: libraries/fbs-common/target/detekt.sarif
          category: detekt-fbs-common
      - name: Upload SARIF — fbs-berichtensessiecache
        if: ${{ always() && hashFiles('libraries/fbs-berichtensessiecache/target/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: libraries/fbs-berichtensessiecache/target/detekt.sarif
          category: detekt-fbs-berichtensessiecache
      - name: Upload SARIF — berichtenmagazijn
        if: ${{ always() && hashFiles('services/berichtenmagazijn/target/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: services/berichtenmagazijn/target/detekt.sarif
          category: detekt-berichtenmagazijn
      - name: Upload SARIF — berichtenuitvraag
        if: ${{ always() && hashFiles('services/berichtenuitvraag/target/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: services/berichtenuitvraag/target/detekt.sarif
          category: detekt-berichtenuitvraag
