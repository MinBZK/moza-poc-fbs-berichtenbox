# De scripts onder .github/scripts/ beslissen wát de rest van de CI doet: wijzigingsfilter.sh
# bepaalt welke jobs draaien, uitrol-poort.sh bepaalt of een run een merge mag dragen,
# merge-guard.sh bewaakt de compose-overlays en demo-grens.sh bewaakt dat het stelsel niet van
# demonstratiecode afhangt, en jdk-handtekening.py bewaakt dat elke setup-java-stap de JDK op
# handtekening controleert. De suites onder demo/lib/ toetsen de modus-keuze waarmee elke lokale
# opstelling start, demo/test-meet-fanout.sh toetst dat de fan-out-meting een niet-geleegde
# cache weigert, en charts/controleer.sh toetst de Helm-chart, die geen andere check in de keten
# raakt; die horen bij een required check, en draaien daarom hier. Een fout daarin is
# stil — een overgeslagen job rapporteert 'skipped' en dat telt als succes voor branch protection.
# Vandaar een eigen, lichte workflow: shellcheck, actionlint en de bash-unittests, zonder de docker
# build van de FSC-harness.
name: CI-scripts

# Op een PR bewust ZONDER pad-filter. Twee redenen. Ten eerste kruiscontroleren de unittests de
# workflow-namen in wijzigingsfilter.sh tegen .github/workflows/ op schijf; met een pad-filter
# vuurde die controle op de verkeerde PR — niet op de PR die een workflow toevoegt, maar op de
# volgende die toevallig een script aanraakt. Ten tweede hoort deze check een required context te
# zijn, en een required check achter een workflow-niveau `paths`-filter wordt bij een
# niet-matchende PR nooit gerapporteerd: die blijft eeuwig 'expected' en blokkeert de merge
# voorgoed. De job kost enkele seconden (linting plus bash-unittests, geen build).
#
# Op een push naar main gelden beide redenen niet: required contexts worden alleen op PR's
# beoordeeld, en de kruiscontrole heeft daar al gevuurd. De push-run blijft als vangnet voor een
# commit die buiten de PR-flow om op main landt; het pad-filter beperkt hem tot de bestanden waar
# dat vangnet over gaat — inclusief de paden die de kruiscontroles van schijf lezen.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Required check, dus ook in de merge queue; zonder pad-filter om dezelfde reden als hierboven.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.claude/hooks/**', '.github/workflows/**', 'docs/architecture/**', '**/pom.xml', '.clusterfuzzlite/base/Dockerfile', 'demo/*.sh', 'demo/*.py', 'demo/environment/**', 'demo/lib/**', 'compose.yaml', 'compose.podman*.yaml', 'compose.proeftuin-*.yaml', 'charts/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    # Expliciete naam, want deze wordt de status-check-context zodra de check als required wordt
    # gezet — en de kale job-id `scripts` is daarvoor te generiek. Een standalone workflow krijgt
    # geen `<aanroeper-job> / <job>`-voorvoegsel dat hem onderscheidt.
    name: ci-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          # Vaste versie plus checksum in plaats van een action van derden: dezelfde
          # pin-discipline als de SHA-gepinde actions elders, met één partij minder in de keten.
          ACTIONLINT_VERSIE: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail

          curl -fsSL --max-time 60 --retry 3 --retry-connrefused -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSIE}/actionlint_${ACTIONLINT_VERSIE}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

          # actionlint draait shellcheck over elk `run:`-blok, maar schakelt die regel stil uit
          # wanneer shellcheck ontbreekt: alleen een `verbose:`-regel, exitcode 0. Een
          # runner-image zonder shellcheck zou de stap dus halveren zonder signaal.
          command -v shellcheck >/dev/null \
            || { echo "::error::shellcheck ontbreekt op de runner — actionlint zou zijn run-blok-analyse stil uitschakelen."; exit 1; }

          # Vangt onder meer een `needs.<job>.result` die verwijst naar een job die niet in
          # `needs:` staat, en een `cancelled()` op een plek waar die niet mag staan.
          /tmp/actionlint
      - name: Elke setup-java verifieert de handtekening van de JDK
        # De suite hierboven toetst de guard tegen fixtures; deze stap laat hem los op de
        # werkelijke workflows. Los, zodat een falende guard als eigen regel in de log staat en
        # niet als één van de twintig meldingen van de unittest-stap.
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/jdk-handtekening.py .github/workflows

      - name: De COPY-lijst van het fuzz-basis-image volgt de reactor
        # De suite hieronder toetst deze guard tegen fixtures; deze stap laat hem los op de
        # werkelijke root-pom en het werkelijke Dockerfile. Los, zodat een achterlopende COPY-lijst
        # als eigen regel in de log staat en niet als één van de twintig meldingen van de
        # unittest-stap. Het Dockerfile draagt dezelfde controle, maar die gaat pas af tijdens de
        # bouw van het image — en die draait alleen op een push naar main, dus ná de merge.
        if: ${{ !cancelled() }}
        run: .github/scripts/fuzz-basis-modules.sh

      - name: Helm-chart zonder cluster
        # Hier en niet in een eigen workflow: een chart-fout komt anders pas in het cluster boven,
        # en deze job is de required check die elke PR draait. Kost enkele seconden.
        if: ${{ !cancelled() }}
        # Een eigen grens: een stap die vastloopt op het ophalen van schema's faalt dan als stap, en
        # de bash-unittests hierna draaien nog. De job-timeout zou de hele job annuleren.
        timeout-minutes: 3
        env:
          HELM_VERSIE: 4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          CONFTEST_VERSIE: 0.71.1
          CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
          KUBECONFORM_VERSIE: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail

          bin=$(mktemp -d)
          haal() {
            curl -fsSL --max-time 60 --retry 3 --retry-connrefused -o "$bin/$1.tar.gz" "$2"
            echo "$3  $bin/$1.tar.gz" | sha256sum -c -
          }

          haal helm "https://get.helm.sh/helm-v${HELM_VERSIE}-linux-amd64.tar.gz" "$HELM_SHA256"
          tar -xzf "$bin/helm.tar.gz" -C "$bin" --strip-components=1 linux-amd64/helm
          haal conftest "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSIE}/conftest_${CONFTEST_VERSIE}_Linux_x86_64.tar.gz" "$CONFTEST_SHA256"
          tar -xzf "$bin/conftest.tar.gz" -C "$bin" conftest
          haal kubeconform "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSIE}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA256"
          tar -xzf "$bin/kubeconform.tar.gz" -C "$bin" kubeconform

          # Voorop in het PATH: de runner heeft een eigen helm van een andere versie.
          PATH="$bin:$PATH" charts/controleer.sh

      - name: shellcheck + bash-unittests
        # Ook draaien als actionlint viel: twee losse signalen zijn in één run meer waard dan één.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          fail=0

          echo "== shellcheck =="
          # `find` in plaats van een glob: een script in een toekomstige submap zou anders
          # stilzwijgend ongecontroleerd blijven. -x volgt `source`-directives, zodat een test
          # zijn script meegecontroleerd krijgt.
          #
          # .claude/hooks/ hoort erbij: die scripts draaien op elke machine van het team, en een
          # fout erin blokkeert of verstomt een guard zonder dat iemand het merkt. demo/lib/ hoort
          # erbij omdat zijn suites hier draaien: de bibliotheek die ze toetsen, haalt dezelfde gate.
          scripts=$(find .github/scripts .claude/hooks demo/lib charts -name '*.sh' | wc -l)

          # `xargs -r` draait shellcheck niet bij een lege lijst; zonder deze guard zou die stilte
          # dan als geslaagd tellen in plaats van als "niets gemeten".
          if [ "$scripts" -eq 0 ]; then
            echo "FOUT: geen enkel script onder .github/scripts/, .claude/hooks/, demo/lib/ of charts/ — deze stap meet niets."
            fail=1
          elif ! find .github/scripts .claude/hooks demo/lib charts -name '*.sh' -print0 | xargs -0 -r shellcheck -x -S warning; then
            fail=1
          fi

          # Om dezelfde reden als demo/lib/: de suite draait hier. Bij naam, want de suite roept het
          # script aan in plaats van het te sourcen, dus -x neemt het niet mee. Een volgende
          # demo/test-*.sh draait hieronder vanzelf mee maar wordt hier niet gelint: zet hem en zijn
          # script dan in deze regel.
          if ! shellcheck -x -S warning demo/meet-fanout.sh demo/test-meet-fanout.sh; then
            fail=1
          fi

          echo "== bash-unittests =="
          gedraaid=0

          # Per suite het aantal asserties dat er minimaal uit moet komen. De suite rapporteert dat
          # zelf als afsluitende ASSERTIES=-regel; een kale `echo "OK: ..."` telt daardoor niet mee,
          # en het verlagen van een verwachting is een zichtbare diff in plaats van stille erosie.
          declare -A VERWACHTE_ASSERTIES=(
            [.github/scripts/test-wijzigingsfilter.sh]=117
            [.github/scripts/test-uitrol-poort.sh]=100
            [.github/scripts/test-opruim-oordeel.sh]=62
            [.github/scripts/test-demo-grens.sh]=62
            [.github/scripts/test-cross-domain-preview.sh]=67
            [.github/scripts/test-preview-klaarzetten.sh]=97
            [.github/scripts/test-zad-taak-lib.sh]=45
            [.github/scripts/test-zad-deployment-bestaat.sh]=29
            [.github/scripts/test-ghcr-package-bestaat.sh]=29
            [.github/scripts/test-images-gepubliceerd.sh]=35
            [.github/scripts/test-preview-comment.sh]=130
            [.github/scripts/test-jdk-handtekening.sh]=22
            [.github/scripts/test-fuzz-basis-modules.sh]=16
            [.github/scripts/test-fuzz-basis-pin.sh]=74
            [.github/scripts/test-proeftuin-image.sh]=20
            [.github/scripts/test-proeftuin-pin-pr.sh]=129
            [.github/scripts/test-pin-pr-teststubs.sh]=40
            [.github/scripts/test-proeftuin-pin.sh]=139
            [.github/scripts/test-preview-resten.sh]=255
            [.github/scripts/test-selinux-label-guard.sh]=22
            [demo/lib/test-podman-modus.sh]=138
            [demo/lib/test-opstellingen.sh]=39
            [demo/test-meet-fanout.sh]=223
            [charts/fundament-testcluster/test-lib.sh]=124
          )
          declare -A GEDRAAID=()

          while IFS= read -r t; do
            gedraaid=$((gedraaid + 1))
            GEDRAAID[$t]=1
            echo "-- $t"

            if ! uitvoer=$(bash "$t" 2>&1); then
              printf '%s\n' "$uitvoer"
              fail=1
              continue
            fi

            printf '%s\n' "$uitvoer"

            gemeten=$(sed -n 's/^ASSERTIES=//p' <<<"$uitvoer" | tail -1)
            verwacht=${VERWACHTE_ASSERTIES[$t]:-}

            if [ -z "$verwacht" ]; then
              echo "FOUT: $t staat niet in VERWACHTE_ASSERTIES — voeg het verwachte aantal toe."
              fail=1
            elif [ -z "$gemeten" ]; then
              echo "FOUT: $t rapporteert geen ASSERTIES=-regel; het aantal is niet te bewaken."
              fail=1
            elif ! [[ "$gemeten" =~ ^[0-9]+$ ]]; then
              # Zonder deze tak valt de vergelijking hieronder met 'integer expression expected'
              # om, grijpt `set -e` niet in op een elif-conditie, en wordt de stap groen.
              echo "FOUT: $t rapporteert ASSERTIES=$gemeten; dat is geen aantal."
              fail=1
            elif [ "$gemeten" -lt "$verwacht" ]; then
              echo "FOUT: $t leverde $gemeten asserties, verwacht minstens $verwacht."
              fail=1
            else
              # Het aantal is zelf-gerapporteerd, dus een uitgeholde suite die alleen nog de
              # ASSERTIES-regel print zou de drempel halen zonder iets te toetsen. Tel daarom de
              # geslaagde asserties in de uitvoer mee: die moeten er minstens evenveel zijn.
              geteld=$(grep -c '^OK: ' <<<"$uitvoer" || true)

              if [ "$geteld" -lt "$gemeten" ]; then
                echo "FOUT: $t meldt ASSERTIES=$gemeten maar print $geteld geslaagde asserties; de suite toetst minder dan hij rapporteert."
                fail=1
              fi
            fi
          done < <({ find .github/scripts demo/lib charts -name 'test-*.sh'; find demo -maxdepth 1 -name 'test-*.sh'; } | sort)

          # De andere richting: een suite die verdwijnt, buiten het `test-*.sh`-patroon wordt
          # hernoemd of buiten de `find` raakt, laat alleen een verweesde sleutel achter — de
          # `gedraaid`-guard hieronder telt de overige suites en de stap wordt groen. Daarom: draaide
          # hij, niet: bestaat hij; een bestand buiten de `find` bestaat nog wel. Voor demo-grens.sh
          # is dat extra duur: die controle heeft geen andere aanroep in de keten, dus één
          # hernoeming haalt de architectuurgrens er geruisloos uit.
          for t in "${!VERWACHTE_ASSERTIES[@]}"; do
            if [ -z "${GEDRAAID[$t]:-}" ]; then
              echo "FOUT: $t staat in VERWACHTE_ASSERTIES maar draaide niet."
              fail=1
            fi
          done

          # Vangnet voor een `find` die niets meer oplevert terwijl VERWACHTE_ASSERTIES tegelijk
          # geleegd is: dan heeft de controle hierboven geen sleutels om te missen.
          if [ "$gedraaid" -eq 0 ]; then
            echo "FOUT: geen enkele test-*.sh gevonden — deze stap meet niets."
            fail=1
          fi

          # En een benoemde set, geen aantal: een suite die mét zijn VERWACHTE_ASSERTIES-sleutel
          # verdwijnt of buiten de `find` raakt laat de guards hierboven tevreden — het bestand
          # kan dan nog bestaan, dus ook hier: draaide hij. Een vervangende stub die één `OK:`
          # print haalt elke telling. Deze dragen elk een controle die nergens anders in de keten
          # wordt aangeroepen — demo-grens.sh is de architectuurgrens zelf, de twee onder demo/lib/
          # zijn de enige toets van de modus-keuze, en test-meet-fanout.sh de enige bewaking dat de
          # fan-out-meting een niet-geleegde cache weigert.
          for verplicht in .github/scripts/test-wijzigingsfilter.sh \
                           .github/scripts/test-uitrol-poort.sh \
                           .github/scripts/test-demo-grens.sh \
                           .github/scripts/test-jdk-handtekening.sh \
                           demo/lib/test-podman-modus.sh \
                           demo/lib/test-opstellingen.sh \
                           demo/test-meet-fanout.sh; do
            if [ -z "${GEDRAAID[$verplicht]:-}" ]; then
              echo "FOUT: $verplicht draaide niet; die controle draait nergens meer in de keten."
              fail=1
            fi
          done


          if [ "$fail" -ne 0 ]; then
            echo "::error::shellcheck of een bash-unittest faalde. Zie de log hierboven."
          fi

          exit "$fail"
