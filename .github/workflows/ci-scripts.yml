# De scripts onder .github/scripts/ beslissen wát de rest van de CI doet: wijzigingsfilter.sh
# bepaalt welke jobs draaien, merge-guard.sh bewaakt de compose-overlays. Een fout daarin is stil
# — een overgeslagen job rapporteert 'skipped' en dat telt als succes voor branch protection.
# Vandaar een eigen, lichte workflow: shellcheck plus de bash-unittests, zonder de docker build
# van de FSC-harness.
name: CI-scripts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # De aanroepende workflows staan in het filter omdat zij het contract met het script vormen
    # (de outputs die ze lezen, de `run:`-vangnetregel). Wijzigt dat contract, dan moeten de
    # tests draaien, ook al bleef het script zelf ongemoeid.
    paths: ['.github/scripts/**', '.github/workflows/ci-scripts.yml', '.github/workflows/deploy.yml', '.github/workflows/test.yml', '.github/workflows/detekt.yml', '.github/workflows/cflite_pr.yml']
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/ci-scripts.yml', '.github/workflows/deploy.yml', '.github/workflows/test.yml', '.github/workflows/detekt.yml', '.github/workflows/cflite_pr.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck + bash-unittests
        run: |
          set -euo pipefail

          fail=0

          echo "== shellcheck =="
          # -x volgt `source`-directives, zodat een test zijn script meegecontroleerd krijgt.
          if ! shellcheck -x -S warning .github/scripts/*.sh; then
            fail=1
          fi

          echo "== bash-unittests =="
          gedraaid=0

          for t in .github/scripts/test-*.sh; do
            [ -f "$t" ] || continue
            gedraaid=$((gedraaid + 1))
            echo "-- $t"
            bash "$t" || fail=1
          done

          # Zonder deze guard meldt de stap groen zodra een test hernoemd of verplaatst wordt:
          # de glob levert dan niets op en er wordt niets gemeten.
          if [ "$gedraaid" -eq 0 ]; then
            echo "FOUT: geen enkele test-*.sh gevonden — deze stap meet niets."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::shellcheck of een bash-unittest faalde. Zie de log hierboven."
          fi

          exit "$fail"
