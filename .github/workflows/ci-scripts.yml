# De scripts onder .github/scripts/ beslissen wát de rest van de CI doet: wijzigingsfilter.sh
# bepaalt welke jobs draaien, merge-guard.sh bewaakt de compose-overlays. Een fout daarin is stil
# — een overgeslagen job rapporteert 'skipped' en dat telt als succes voor branch protection.
# Vandaar een eigen, lichte workflow: shellcheck plus de bash-unittests, zonder de docker build
# van de FSC-harness.
name: CI-scripts

# Bewust ZONDER pad-filter. Twee redenen. Ten eerste kruiscontroleren de unittests de
# workflow-namen in wijzigingsfilter.sh tegen .github/workflows/ op schijf; met een pad-filter
# vuurde die controle op de verkeerde PR — niet op de PR die een workflow toevoegt, maar op de
# volgende die toevallig een script aanraakt. Ten tweede hoort deze check een required context te
# zijn, en een required check achter een workflow-niveau `paths`-filter wordt bij een
# niet-matchende PR nooit gerapporteerd: die blijft eeuwig 'expected' en blokkeert de merge
# voorgoed. De job kost enkele seconden (shellcheck plus bash-unittests, geen build).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck + bash-unittests
        run: |
          set -euo pipefail

          fail=0

          echo "== shellcheck =="
          # `find` in plaats van een glob: een script in een toekomstige submap zou anders
          # stilzwijgend ongecontroleerd blijven. -x volgt `source`-directives, zodat een test
          # zijn script meegecontroleerd krijgt.
          if ! find .github/scripts -name '*.sh' -print0 | xargs -0 shellcheck -x -S warning; then
            fail=1
          fi

          echo "== bash-unittests =="
          gedraaid=0
          geslaagd=0

          for t in $(find .github/scripts -name 'test-*.sh' | sort); do
            gedraaid=$((gedraaid + 1))
            echo "-- $t"

            if uitvoer=$(bash "$t"); then
              printf '%s\n' "$uitvoer"
              geslaagd=$((geslaagd + $(grep -c '^OK: ' <<<"$uitvoer" || true)))
            else
              printf '%s\n' "$uitvoer"
              fail=1
            fi
          done

          # Zonder deze guard meldt de stap groen zodra een test hernoemd of verplaatst wordt:
          # de glob levert dan niets op en er wordt niets gemeten.
          if [ "$gedraaid" -eq 0 ]; then
            echo "FOUT: geen enkele test-*.sh gevonden — deze stap meet niets."
            fail=1
          fi

          # En een tweede vloer op het aantal asserties: een suite waaruit de asserties wegvallen
          # eindigt namelijk óók groen. De vloer ligt bewust ruim onder het huidige aantal, zodat
          # hij alleen aanslaat bij een instorting en niet bij normaal onderhoud.
          if [ "$geslaagd" -lt 40 ]; then
            echo "FOUT: slechts $geslaagd geslaagde asserties — de suite meet vrijwel niets meer."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::shellcheck of een bash-unittest faalde. Zie de log hierboven."
          fi

          exit "$fail"
