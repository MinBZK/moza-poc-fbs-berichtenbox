# De scripts onder .github/scripts/ beslissen wát de rest van de CI doet: wijzigingsfilter.sh
# bepaalt welke jobs draaien, uitrol-poort.sh bepaalt of een run een merge mag dragen,
# merge-guard.sh bewaakt de compose-overlays. Een fout daarin is stil — een overgeslagen job
# rapporteert 'skipped' en dat telt als succes voor branch protection. Vandaar een eigen, lichte
# workflow: shellcheck, actionlint en de bash-unittests, zonder de docker build van de
# FSC-harness.
name: CI-scripts

# Op een PR bewust ZONDER pad-filter. Twee redenen. Ten eerste kruiscontroleren de unittests de
# workflow-namen in wijzigingsfilter.sh tegen .github/workflows/ op schijf; met een pad-filter
# vuurde die controle op de verkeerde PR — niet op de PR die een workflow toevoegt, maar op de
# volgende die toevallig een script aanraakt. Ten tweede hoort deze check een required context te
# zijn, en een required check achter een workflow-niveau `paths`-filter wordt bij een
# niet-matchende PR nooit gerapporteerd: die blijft eeuwig 'expected' en blokkeert de merge
# voorgoed. De job kost enkele seconden (linting plus bash-unittests, geen build).
#
# Op een push naar main gelden beide redenen niet: required contexts worden alleen op PR's
# beoordeeld, en de kruiscontrole heeft daar al op de PR gevuurd. Met `strict: true` op main
# draaide de PR bovendien op dezelfde inhoud, dus een filterloze run herhaalt gedaan werk. Daar
# blijft het pad-filter dus staan.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    # Expliciete naam, want dit is de status-check-context in branch protection. Alleen
    # aangeroepen workflows krijgen een `<caller-job> / <job>`-prefix; een standalone workflow
    # levert de kale job-id als context op, en `scripts` is daarvoor te generiek.
    name: ci-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          # Vaste versie plus checksum in plaats van een action van derden: dezelfde
          # pin-discipline als de SHA-gepinde actions elders, met één partij minder in de keten.
          ACTIONLINT_VERSIE: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail

          curl -fsSL --max-time 60 --retry 3 --retry-connrefused -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSIE}/actionlint_${ACTIONLINT_VERSIE}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

          # Vangt onder meer een `needs.<job>.result` die verwijst naar een job die niet in
          # `needs:` staat: die levert stilzwijgend een lege string op in plaats van een fout.
          /tmp/actionlint
      - name: shellcheck + bash-unittests
        # Ook draaien als actionlint viel: twee losse signalen zijn in één run meer waard dan één.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          fail=0

          echo "== shellcheck =="
          # `find` in plaats van een glob: een script in een toekomstige submap zou anders
          # stilzwijgend ongecontroleerd blijven. -x volgt `source`-directives, zodat een test
          # zijn script meegecontroleerd krijgt.
          if ! find .github/scripts -name '*.sh' -print0 | xargs -0 shellcheck -x -S warning; then
            fail=1
          fi

          echo "== bash-unittests =="
          gedraaid=0
          geslaagd=0

          for t in $(find .github/scripts -name 'test-*.sh' | sort); do
            gedraaid=$((gedraaid + 1))
            echo "-- $t"

            if uitvoer=$(bash "$t"); then
              printf '%s\n' "$uitvoer"
              geslaagd=$((geslaagd + $(grep -c '^OK: ' <<<"$uitvoer" || true)))
            else
              printf '%s\n' "$uitvoer"
              fail=1
            fi
          done

          # Zonder deze guard meldt de stap groen zodra een test hernoemd of verplaatst wordt:
          # de glob levert dan niets op en er wordt niets gemeten.
          if [ "$gedraaid" -eq 0 ]; then
            echo "FOUT: geen enkele test-*.sh gevonden — deze stap meet niets."
            fail=1
          fi

          # En een tweede vloer op het aantal asserties: een suite waaruit de asserties wegvallen
          # eindigt namelijk óók groen. De vloer ligt bewust ruim onder het huidige aantal, zodat
          # hij alleen aanslaat bij een instorting en niet bij normaal onderhoud.
          if [ "$geslaagd" -lt 40 ]; then
            echo "FOUT: slechts $geslaagd geslaagde asserties — de suite meet vrijwel niets meer."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::shellcheck of een bash-unittest faalde. Zie de log hierboven."
          fi

          exit "$fail"
