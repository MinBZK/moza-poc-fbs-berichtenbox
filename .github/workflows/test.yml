name: Test

on:
  # deploy.yml roept deze workflow aan voor PR's naar main en voor pushes naar main. Daar hangt
  # de deploy er met `needs:` aan, in plaats van in een eigen job op de check-run te pollen —
  # een pollende job houdt een runner bezet zonder werk te doen.
  workflow_call:
    inputs:
      wijzigingen-relevant:
        description: >-
          Uitkomst van de gedeelde wijzigingsdetectie in deploy.yml: 'false' wanneer de PR
          alleen documentatie raakt. Leeg (de default) betekent "niet meegegeven", en dan
          bepaalt deze workflow het zelf. Het overslaan gebeurt hier, in de job — niet bij de
          caller: die overslaan zou deze workflow helemaal niet draaien, waardoor de required
          check-run nooit verschijnt en de merge voorgoed blokkeert.
        type: string
        required: false
        default: ""
      demo-only:
        description: >-
          Uitkomst van de gedeelde wijzigingsdetectie in deploy.yml: 'true' wanneer de PR
          uitsluitend demo-console raakt. Leeg (de default) betekent "niet meegegeven", en dan
          bepaalt deze workflow het zelf — zo blijft hij zelfstandig bruikbaar op een
          gestapelde PR.
        type: string
        required: false
        default: ""
  # Het complement van deploy.yml's `branches: [main]`, dat op de DOELbranch filtert. Een
  # gestapelde PR (base = een feature-branch) draait deploy.yml niet en heeft deze workflow dus
  # zelfstandig nodig: zo'n PR wordt op eigen merites gereviewd en gemerged, en zonder tests komt
  # breuk pas aan het licht op de PR naar main, vermengd met de rest van de stapel. Voor een PR
  # naar main roept deploy.yml deze workflow aan; zonder dit filter zouden de tests dan twee keer
  # draaien. De asymmetrie — wel toetsen, niet deployen — is opzet.
  pull_request:
    branches-ignore: [main]
  workflow_dispatch:

# Geen `read-all`: als aangeroepen workflow mag dit nooit meer zijn dan de caller-job toekent, en
# die kent alleen toe wat hier daadwerkelijk nodig is. De `changes`-job leest de bestandenlijst van
# de PR; de `test`-job verhoogt zelf naar pull-requests: write voor de coverage-comment.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bepaalt of er iets buiten documentatie (docs/, *.md) is gewijzigd. De zware test-job is
  # hieraan gegate, maar de workflow zelf draait wél door — zo wordt de required status check ook
  # bij een docs-only PR gerapporteerd: een via `if` overgeslagen job telt als 'skipped' = succes
  # voor branch protection. Een workflow-niveau paths-filter zou de check juist nooit rapporteren
  # en de PR eeuwig blokkeren.
  # Draait alleen wanneer de caller de uitkomst niet meegaf; anders is dit dezelfde vraag
  # voor de tweede keer, en dat kostte per PR een runner-allocatie voor een bekend antwoord.
  # LET OP: het patroon hieronder staat óók in de `changes`-job van deploy.yml en moet daarmee
  # gelijk blijven. Op een PR naar main draait alleen die van deploy.yml, dus een eenzijdige
  # wijziging hier heeft daar geen effect en valt niet op.
  changes:
    if: inputs.wijzigingen-relevant == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
      demo-only: ${{ steps.filter.outputs.demo-only }}
    steps:
      - name: Detecteer niet-documentatie wijzigingen
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Defaults = de veiligste uitkomst: alles draaien. Elke tak hieronder kan ze
          # versmallen, geen enkele kan een run stil overslaan bij een onverwachte situatie.
          run=true
          demo_only=false

          if [ "$EVENT" = "pull_request" ]; then
            # Fail-safe: kan de bestandenlijst niet opgehaald worden (API-hik, rate-limit), draai
            # de code-checks dan TÓCH i.p.v. ze stil over te slaan. Een overslaan-op-fout zou als
            # 'skipped' (= succes) doortellen in de deploy-gate en ongeteste code laten deployen.
            if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename'); then
              echo "::warning::Kon gewijzigde bestanden niet ophalen — code-checks draaien fail-safe."
            else
              echo "Gewijzigde bestanden:"
              printf '%s\n' "$files"

              # Herestring in plaats van een pipe: `grep -q` sluit de pipe bij de eerste match,
              # en met `pipefail` promoveert die SIGPIPE tot een mislukte pipeline — waarna dit
              # filter stilzwijgend zou besluiten dat er niets te testen valt.
              if ! grep -qvE '(^docs/|\.md$)' <<<"$files"; then
                echo "Alleen documentatie gewijzigd — code-checks overgeslagen."
                run=false
              fi

              # demo-console heeft bewust geen afhankelijkheid op fbs-common of een andere
              # reactor-module (zie services/demo-console/pom.xml) — het enige blad in de
              # module-graaf zonder koppeling. Raakt de PR verder niets buiten
              # services/demo-console/ en demo/ (de Python-generator + smoke.sh, die alleen de
              # demo-stack aansturen), dan hoeven berichtenmagazijn/berichtenuitvraag/libraries
              # niet mee gebouwd en getest te worden. Fail-safe zoals hierboven: elk onbekend of
              # breder pad → false (volledige build), nooit omgekeerd stil onder-testen.
              if ! grep -qvE '(^docs/|\.md$|^services/demo-console/|^demo/)' <<<"$files"; then
                echo "Uitsluitend demo-console geraakt — tests scoped naar die module."
                demo_only=true
              fi
            fi
          fi

          {
            echo "run=$run"
            echo "demo-only=$demo_only"
          } >> "$GITHUB_OUTPUT"

  # De modules draaiden achter elkaar in één reactor: 8 minuten, waarvan berichtenmagazijn
  # alleen al 4,5. Dat maakte deze controle de traagste van de keten en daarmee de wachttijd
  # per wijziging. Over twee machines verdeeld bepaalt die ene module nog wel de vloer, maar
  # loopt de rest ernaast in plaats van erna. De dekking blijft gelijk: elke module wordt
  # precies zo getest als eerst, alleen niet meer op dezelfde machine.
  shard:
    needs: changes
    # Sla alleen over bij een expliciete 'false', uit welke van de twee bronnen dan ook; een
    # lege of ontbrekende uitkomst (detectie faalde) betekent draaien. `!cancelled()` zodat een
    # overgeslagen `changes` deze job niet meesleept — een overgeslagen job ín deze workflow
    # telt wél als succes voor branch protection.
    if: "!cancelled() && inputs.wijzigingen-relevant != 'false' && needs.changes.outputs.run != 'false'"
    name: test-${{ matrix.shard.id }}
    strategy:
      # Een gevallen shard mag de andere niet afkappen: anders is na een fout maar de helft
      # van de tests gedraaid en volgt de rest pas na een tweede push.
      fail-fast: false
      matrix:
        # De shard-verdeling: berichtenmagazijn alleen, de rest ernaast. Die ene module kost
        # ~4,5 van de ~8 minuten reactor-tijd en vormt dus de vloer; alles bij elkaar past
        # binnen die tijd op een tweede machine.
        #
        # De tweede shard is het COMPLEMENT (`!services/berichtenmagazijn`), geen opsomming:
        # zo valt een nieuwe reactor-module er per constructie in. Met een handmatige lijst
        # zou een module die nergens genoemd wordt én nergens upstream van is, stil ongetest
        # blijven terwijl beide shards groen rapporteren.
        #
        # `-am` bouwt en test in beide shards ook de gedeelde bibliotheken (~35s dubbel);
        # dat is goedkoper dan per shard uitzoeken welke upstream-modules erbij horen.
        #
        # Hier afgeleid en niet in de `changes`-job, omdat die overgeslagen wordt zodra de
        # caller de uitkomst meegeeft — dan is er geen job-output om de matrix uit te vullen.
        # De meegegeven input wint; alleen als die leeg is telt wat `changes` zelf bepaalde.
        shard: >-
          ${{ fromJSON(
            (inputs.demo-only || needs.changes.outputs.demo-only) == 'true'
            && '[{"id":"demo-console","modules":"services/demo-console"}]'
            || '[{"id":"berichtenmagazijn","modules":"services/berichtenmagazijn"},{"id":"overig","modules":"!services/berichtenmagazijn"}]'
          ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Quarkus Dev Services (Testcontainers) start Redis Stack + WireMock voor integratietests.
    # Geen `services:` block nodig — alle tests draaien in de `test` Maven-phase
    # (JaCoCo coverage-check incluis), dus `mvnw test` volstaat.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test
        env:
          MODULES: ${{ matrix.shard.modules }}
        run: ./mvnw -B test -pl "$MODULES" -am
      # De rapporten gaan naar de `test`-job, die er één coverage-comment van maakt; los per
      # shard zou elke shard zijn eigen halve comment plaatsen. Retentie kort: ze zijn na die
      # ene comment nergens meer voor nodig.
      - name: Coverage-rapporten bewaren
        if: github.event_name == 'pull_request' && inputs.demo-only != 'true' && needs.changes.outputs.demo-only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-${{ matrix.shard.id }}
          path: |
            services/*/target/site/jacoco/jacoco.xml
            libraries/*/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 1

  # Eén check-run voor alle shards samen. De naam `test` blijft: branch protection op main pint
  # op de context `checks-test / test`, en een required context die nooit meer verschijnt
  # blokkeert elke merge. Deze job toetst zelf niets — hij bundelt het shard-resultaat en
  # plaatst de coverage-comment over de rapporten van alle shards.
  test:
    needs: [changes, shard]
    # `!cancelled()` i.p.v. de impliciete success(): bij een docs-only wijziging slaan de shards
    # zichzelf over, en de check moet dan alsnog groen rapporteren i.p.v. mee te vallen in
    # 'skipped'. Bij een geannuleerde run valt er niets te oordelen.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: write voor de coverage-PR-comment (madrapps/jacoco-report).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Beoordeel de shards
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.shard.result }}
          # De meegegeven uitkomst wint; alleen als die leeg is draaide `changes` zelf.
          RUN: ${{ inputs.wijzigingen-relevant || needs.changes.outputs.run }}
          MEEGEGEVEN: ${{ inputs.wijzigingen-relevant }}
        run: |
          set -euo pipefail

          # Zonder deze check zou een gevallen `changes`-job de shards overslaan en hier stil
          # als groen doortellen — precies het gat dat de fail-safe hierboven dicht wil houden.
          # Overslaan is alleen legitiem wanneer de caller de uitkomst meegaf: dan is er niets
          # te bepalen en is 'skipped' de bedoeling.
          case "$CHANGES" in
            success) ;;
            skipped)
              if [ -z "$MEEGEGEVEN" ]; then
                echo "::error::De wijzigingsdetectie is overgeslagen zonder meegegeven uitkomst — testresultaat onbepaald."
                exit 1
              fi
              ;;
            *)
              echo "::error::De wijzigingsdetectie eindigde als '$CHANGES' — testresultaat onbepaald."
              exit 1
              ;;
          esac

          # Bij een matrix is dit het resultaat van alle shards samen: 'success' alleen als
          # elke shard slaagde.
          case "$SHARDS" in
            success)
              echo "Alle testshards geslaagd."
              ;;
            skipped)
              # Overslaan is alleen legitiem als de wijzigingsdetectie dat besloot. Een lege
              # matrix levert óók 'skipped' op, en dan zou dit groen rapporteren terwijl er geen
              # enkele test heeft gedraaid.
              if [ "$RUN" != "false" ]; then
                echo "::error::Shards overgeslagen terwijl er wél getest moest worden (run=$RUN) — testresultaat onbepaald."
                exit 1
              fi

              echo "::warning::Testshards overgeslagen — als OK geteld (alleen documentatie gewijzigd)."
              ;;
            *)
              echo "::error::Een testshard eindigde als '$SHARDS'."
              exit 1
              ;;
          esac
      # Vóór het ophalen van de artefacten: checkout schoont de workspace, en zou de rapporten
      # er anders weer uit vegen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && inputs.demo-only != 'true' && needs.changes.outputs.demo-only != 'true' && needs.shard.result == 'success'
      - name: Coverage-rapporten ophalen
        if: github.event_name == 'pull_request' && inputs.demo-only != 'true' && needs.changes.outputs.demo-only != 'true' && needs.shard.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jacoco-*
          # De shards delen de gedeelde bibliotheken (`-am`), dus hun rapporten overlappen
          # daar; samenvoegen op pad houdt één exemplaar per module over.
          merge-multiple: true
      # Coverage-zichtbaarheid op PR-niveau. Bewust GitHub-native (madrapps/jacoco-report)
      # i.p.v. Codecov: geen externe SaaS, geen upload-token, geen extra supply-chain-
      # oppervlak (Codecov kende in 2021 een uploader-compromittering). JaCoCo levert al een
      # XML-rapport per service; deze action leest dat en plaatst de diff als PR-comment.
      # De harde 90%-gate blijft de JaCoCo `check` in de build; deze drempels staan op 0
      # zodat de comment informatief is en de PR niet extra blokkeert.
      #
      # Lees het `target/site/jacoco`-rapport (jacoco-maven-plugin), NIET
      # `target/jacoco-report` (auto-rapport van de quarkus-jacoco-extensie). De
      # quarkus-variant telt alleen `@QuarkusTest`-data en past geen excludes toe, dus
      # gegenereerde OpenAPI-klassen (`api.**`) tellen als onafgedekt mee — dat drukt het
      # cijfer kunstmatig (bv. ~38% i.p.v. ~95% voor dezelfde module). Het site/jacoco-
      # rapport hanteert dezelfde excludes als de 90%-gate, dus de comment spiegelt de gate.
      # Glob op `services/*` + `libraries/*` zodat nieuwe modules (services én gedeelde
      # libraries zoals fbs-common) automatisch meegenomen worden.
      #
      # demo-only sluit deze stap uit: services/demo-console/pom.xml heeft geen
      # jacoco-maven-plugin (geen coverage-gate voor de wegwerp-module), dus bij een
      # demo-only-run bestaat er nergens een jacoco.xml — de comment-stap zou dan niets te
      # rapporteren hebben.
      - name: JaCoCo coverage als PR-comment
        if: github.event_name == 'pull_request' && inputs.demo-only != 'true' && needs.changes.outputs.demo-only != 'true' && needs.shard.result == 'success'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/services/*/target/site/jacoco/jacoco.xml
            ${{ github.workspace }}/libraries/*/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "JaCoCo coverage"
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          update-comment: true

  # 460+ regels compose zijn de enige beschrijving van de demo-stack en worden door geen
  # enkele build-stap gelezen: een typfout of een ongeldige verwijzing blijkt nu pas als
  # iemand de stack start, meestal vlak voor een demo. `config -q` parseert en valideert
  # zonder daemon of images, in seconden. Met `--profile demo`, want de demo-services staan
  # achter dat profiel en zouden anders juist niet gecontroleerd worden.
  compose:
    needs: changes
    if: "!cancelled() && inputs.wijzigingen-relevant != 'false' && needs.changes.outputs.run != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose.yaml valideren
        run: docker compose --profile demo config -q
