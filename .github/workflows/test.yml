name: Test

on:
  # deploy.yml roept deze workflow aan voor PR's naar main en voor pushes naar main. Daar hangt
  # de deploy er met `needs:` aan, in plaats van in een eigen job op de check-run te pollen —
  # een pollende job houdt een runner bezet zonder werk te doen.
  workflow_call:
    inputs:
      wijzigingen-relevant:
        description: >-
          Uitkomst van de gedeelde wijzigingsdetectie in deploy.yml: 'false' wanneer de PR
          alleen documentatie raakt. Leeg (de default) betekent "niet meegegeven", en dan
          bepaalt deze workflow het zelf. Het overslaan gebeurt hier, in de job — niet bij de
          caller: die overslaan zou deze workflow helemaal niet draaien, waardoor de required
          check-run nooit verschijnt en de merge voorgoed blokkeert.
        type: string
        required: false
        default: ""
      demo-only:
        description: >-
          Uitkomst van de gedeelde wijzigingsdetectie in deploy.yml: 'true' wanneer de PR
          uitsluitend demo-console raakt. Leeg (de default) betekent "niet meegegeven", en dan
          bepaalt deze workflow het zelf — zo blijft hij zelfstandig bruikbaar op een
          gestapelde PR.
        type: string
        required: false
        default: ""
  # Het complement van deploy.yml's `branches: [main]`, dat op de DOELbranch filtert. Een
  # gestapelde PR (base = een feature-branch) draait deploy.yml niet en heeft deze workflow dus
  # zelfstandig nodig: zo'n PR wordt op eigen merites gereviewd en gemerged, en zonder tests komt
  # breuk pas aan het licht op de PR naar main, vermengd met de rest van de stapel. Voor een PR
  # naar main roept deploy.yml deze workflow aan; zonder dit filter zouden de tests dan twee keer
  # draaien. De asymmetrie — wel toetsen, niet deployen — is opzet.
  pull_request:
    branches-ignore: [main]
  workflow_dispatch:

# Geen `read-all`: als aangeroepen workflow mag dit nooit meer zijn dan de caller-job toekent, en
# die kent alleen toe wat hier daadwerkelijk nodig is. De `changes`-job leest de bestandenlijst van
# de PR; de `test`-job verhoogt zelf naar pull-requests: write voor de coverage-comment.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bepaalt of er iets buiten documentatie (docs/, *.md) is gewijzigd. De zware test-job is
  # hieraan gegate, maar de workflow zelf draait wél door — zo wordt de required status check ook
  # bij een docs-only PR gerapporteerd: een via `if` overgeslagen job telt als 'skipped' = succes
  # voor branch protection. Een workflow-niveau paths-filter zou de check juist nooit rapporteren
  # en de PR eeuwig blokkeren.
  # Draait alleen wanneer de caller de uitkomst niet meegaf; anders is dit dezelfde vraag
  # voor de tweede keer, en dat kostte per PR een runner-allocatie voor een bekend antwoord.
  # LET OP: het patroon hieronder staat óók in de `changes`-job van deploy.yml en moet daarmee
  # gelijk blijven. Op een PR naar main draait alleen die van deploy.yml, dus een eenzijdige
  # wijziging hier heeft daar geen effect en valt niet op.
  changes:
    if: inputs.wijzigingen-relevant == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
      demo-only: ${{ steps.filter.outputs.demo-only }}
    steps:
      - name: Detecteer niet-documentatie wijzigingen
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "demo-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail-safe: kan de bestandenlijst niet opgehaald worden (API-hik, rate-limit), draai
          # de code-checks dan TÓCH i.p.v. ze stil over te slaan. Een overslaan-op-fout zou als
          # 'skipped' (= succes) doortellen in de deploy-gate en ongeteste code laten deployen.
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename'); then
            echo "::warning::Kon gewijzigde bestanden niet ophalen — code-checks draaien fail-safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "demo-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Gewijzigde bestanden:"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Alleen documentatie gewijzigd — code-checks overgeslagen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

          # demo-console heeft bewust geen afhankelijkheid op fbs-common of een andere
          # reactor-module (zie services/demo-console/pom.xml) — het enige blad in de
          # module-graaf zonder koppeling. Raakt de PR verder niets buiten
          # services/demo-console/ en demo/ (de Python-generator + smoke.sh, die alleen de
          # demo-stack aansturen), dan hoeven berichtenmagazijn/berichtenuitvraag/libraries
          # niet mee gebouwd en getest te worden. Fail-safe zoals hierboven: elk onbekend of
          # breder pad → false (volledige build), nooit omgekeerd stil onder-testen.
          if printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$|^services/demo-console/|^demo/)'; then
            echo "demo-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "Uitsluitend demo-console geraakt — test-job scoped naar die module."
            echo "demo-only=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    # Sla alleen over bij een expliciete 'false', uit welke van de twee bronnen dan ook; een
    # lege of ontbrekende uitkomst (detectie faalde) betekent draaien. `!cancelled()` zodat een
    # overgeslagen `changes` deze job niet meesleept — een overgeslagen job ín deze workflow
    # telt wél als succes voor branch protection.
    if: "!cancelled() && inputs.wijzigingen-relevant != 'false' && needs.changes.outputs.run != 'false'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pull-requests: write voor de coverage-PR-comment (madrapps/jacoco-report).
    permissions:
      contents: read
      pull-requests: write
    # Quarkus Dev Services (Testcontainers) start Redis Stack + WireMock voor integratietests.
    # Geen `services:` block nodig — alle tests draaien in de `test` Maven-phase
    # (JaCoCo coverage-check incluis), dus `mvnw test` op root volstaat.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # demo-only (changes-job): scope naar de ene module zonder reactor-koppeling i.p.v. ook
      # berichtenmagazijn/berichtenuitvraag/libraries en hun Testcontainers-integratietests te
      # bouwen voor een wijziging die ze niet raakt.
      - name: Test
        run: |
          if [ "${{ inputs.demo-only }}" = "true" ] || [ "${{ needs.changes.outputs.demo-only }}" = "true" ]; then
            ./mvnw -B test -pl services/demo-console
          else
            ./mvnw -B test
          fi
      # Coverage-zichtbaarheid op PR-niveau. Bewust GitHub-native (madrapps/jacoco-report)
      # i.p.v. Codecov: geen externe SaaS, geen upload-token, geen extra supply-chain-
      # oppervlak (Codecov kende in 2021 een uploader-compromittering). JaCoCo levert al een
      # XML-rapport per service; deze action leest dat en plaatst de diff als PR-comment.
      # De harde 90%-gate blijft de JaCoCo `check` in de build; deze drempels staan op 0
      # zodat de comment informatief is en de PR niet extra blokkeert.
      #
      # Lees het `target/site/jacoco`-rapport (jacoco-maven-plugin), NIET
      # `target/jacoco-report` (auto-rapport van de quarkus-jacoco-extensie). De
      # quarkus-variant telt alleen `@QuarkusTest`-data en past geen excludes toe, dus
      # gegenereerde OpenAPI-klassen (`api.**`) tellen als onafgedekt mee — dat drukt het
      # cijfer kunstmatig (bv. ~38% i.p.v. ~95% voor dezelfde module). Het site/jacoco-
      # rapport hanteert dezelfde excludes als de 90%-gate, dus de comment spiegelt de gate.
      # Glob op `services/*` + `libraries/*` zodat nieuwe modules (services én gedeelde
      # libraries zoals fbs-common) automatisch meegenomen worden.
      #
      # demo-only sluit deze stap uit: services/demo-console/pom.xml heeft geen
      # jacoco-maven-plugin (geen coverage-gate voor de wegwerp-module), dus bij een
      # demo-only-run bestaat er nergens een jacoco.xml — de comment-stap zou dan niets te
      # rapporteren hebben.
      - name: JaCoCo coverage als PR-comment
        if: github.event_name == 'pull_request' && inputs.demo-only != 'true' && needs.changes.outputs.demo-only != 'true'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/services/*/target/site/jacoco/jacoco.xml
            ${{ github.workspace }}/libraries/*/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "JaCoCo coverage"
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          update-comment: true

  # 460+ regels compose zijn de enige beschrijving van de demo-stack en worden door geen
  # enkele build-stap gelezen: een typfout of een ongeldige verwijzing blijkt nu pas als
  # iemand de stack start, meestal vlak voor een demo. `config -q` parseert en valideert
  # zonder daemon of images, in seconden. Met `--profile demo`, want de demo-services staan
  # achter dat profiel en zouden anders juist niet gecontroleerd worden.
  compose:
    needs: changes
    if: "!cancelled() && inputs.wijzigingen-relevant != 'false' && needs.changes.outputs.run != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose.yaml valideren
        run: docker compose --profile demo config -q
