name: ClusterFuzzLite cron (coverage + pruning)
on:
  schedule:
    - cron: '0 1 * * 0' # Zondag 01:00 UTC

permissions: read-all

jobs:
  Coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          # Expliciet aan, ook al is `true` de default van de action: de PR- en batch-workflow
          # verwijzen hierheen met "hier staat hij bewust wél aan", en dan moet wie daarop grept
          # een sleutel vinden in plaats van proza. De coverage- en prune-ronden draaien over het
          # bestaande corpus en vallen niet om op een doel dat wel compileert maar bij het starten
          # crasht; zonder deze check rapporteert zo'n doel stilzwijgend 0% dekking. Wekelijkse
          # cron, dus de ~161s kosten hier geen wachttijd.
          bad-build-check: true
      - name: Run Fuzzers (coverage)
        id: coverage
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage

  Pruning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          # Expliciet aan, ook al is `true` de default van de action: de PR- en batch-workflow
          # verwijzen hierheen met "hier staat hij bewust wél aan", en dan moet wie daarop grept
          # een sleutel vinden in plaats van proza. De coverage- en prune-ronden draaien over het
          # bestaande corpus en vallen niet om op een doel dat wel compileert maar bij het starten
          # crasht; zonder deze check rapporteert zo'n doel stilzwijgend 0% dekking. Wekelijkse
          # cron, dus de ~161s kosten hier geen wachttijd.
          bad-build-check: true
      - name: Run Fuzzers (pruning)
        id: pruning
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune

  # De PR-melding over een verouderde basis-image-pin verdwijnt met de PR: eenmaal gemerged is er
  # niemand meer die hem ziet, en kan de pin onbeperkt achterlopen terwijl elke fuzz-run stilletjes
  # weer de volle voorbereiding betaalt. Deze wekelijkse ronde is de plek om dat wél hard te maken:
  # ze kost geen wachttijd op een PR, en het is precies de ronde waarin een trage voorbereiding een
  # week lang zichtbaar is.
  #
  # Falen alleen is niet genoeg — een rode geplande run mailt hoogstens degene die het cron-bestand
  # het laatst aanraakte. Daarom ook een issue, met de regel die bijgewerkt moet worden, dat zichzelf
  # sluit zodra de pin weer klopt. Een issue mag wél door GITHUB_TOKEN aangemaakt worden; een PR zou
  # zijn verplichte checks nooit krijgen.
  Basisimagepin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hoort de gepinde digest bij de huidige pom's
        id: pin
        env:
          VERWACHT: ${{ hashFiles('**/pom.xml', '.mvn/**', 'mvnw') }}
        run: .github/scripts/fuzz-basis-pin.sh

      - name: Meld of ruim het issue op
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STATUS: ${{ steps.pin.outputs.status }}
          DIGEST: ${{ steps.pin.outputs.verwachte_digest }}
          IMAGE_PAD: ${{ steps.pin.outputs.image_pad }}
          MARKER: '<!-- fuzz-basis-pin -->'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          bestaand=$(gh api --paginate "repos/$REPO/issues?state=open" \
            --jq "[.[] | select(.pull_request == null) | select(.body != null and (.body | contains(\"$MARKER\")))] | first | .number // empty" | head -1)

          if [ "$STATUS" = "ok" ] || [ "$STATUS" = "oncontroleerbaar" ]; then
            # Bij 'oncontroleerbaar' is er niets vastgesteld: dan het issue niet sluiten (de pin kan
            # nog steeds achterlopen) maar ook geen nieuw openen op basis van een niet-meting.
            if [ "$STATUS" = "ok" ] && [ -n "$bestaand" ]; then
              gh issue comment "$bestaand" --repo "$REPO" --body "De pin hoort weer bij de huidige dependency-declaraties; automatisch gesloten."
              gh issue close "$bestaand" --repo "$REPO"
              echo "Issue #$bestaand gesloten."
            fi

            exit 0
          fi

          titel="Fuzz-basis-image loopt achter op de dependency-declaraties"
          case "$STATUS" in
            verouderd)
              # shellcheck disable=SC2016
              kern=$(printf 'Er is een basis-image dat bij de huidige declaraties hoort, maar `.clusterfuzzlite/Dockerfile` wijst naar een ander.\n\nWerk de pin bij naar:\n\n```dockerfile\nFROM ghcr.io/%s@%s\n```' "$IMAGE_PAD" "$DIGEST")
              ;;
            ontbreekt)
              # shellcheck disable=SC2016
              kern='Er is nog geen basis-image voor de huidige declaraties. Draai de workflow **Fuzz-basis-image** en pin de digest die hij print.'
              ;;
            *)
              # shellcheck disable=SC2016
              kern=$(printf 'De controle kon niets vaststellen (status `%s`) — waarschijnlijk is de `FROM`-regel of het bestandspatroon gewijzigd.' "$STATUS")
              ;;
          esac

          body=$(printf '%s\n%s\n\nZolang dit openstaat betaalt elke fuzz-run de volle voorbereiding (~100s extra).\n\nGevonden in de wekelijkse ronde: %s\n' "$MARKER" "$kern" "$RUN_URL")

          if [ -n "$bestaand" ]; then
            gh issue edit "$bestaand" --repo "$REPO" --body "$body"
            echo "Issue #$bestaand bijgewerkt."
          else
            gh issue create --repo "$REPO" --title "$titel" --body "$body" --jq .html_url 2>/dev/null || \
              gh issue create --repo "$REPO" --title "$titel" --body "$body"
          fi

      - name: Faal bij een verouderde pin
        env:
          STATUS: ${{ steps.pin.outputs.status }}
        run: |
          set -euo pipefail

          case "$STATUS" in
            ok)
              echo "Basis-image-pin hoort bij de huidige pom's."
              ;;
            oncontroleerbaar)
              # Niets vastgesteld: een rode wekelijkse ronde op een registry-hik is ruis, geen signaal.
              echo "::warning::De basis-image-pin is deze ronde NIET gecontroleerd (registry niet te bevragen)."
              ;;
            *)
              echo "::error::Basis-image-pin niet in orde (status=$STATUS) — de fuzz-voorbereiding draait onnodig traag. Zie het bijbehorende issue."
              exit 1
              ;;
          esac
