# Drie pin-controles: `infra-image-pins` houdt de pins van de zelf-gedeployde infra-images uniform
# over alle vindplaatsen, `fuzz-basis-pin` en `proeftuin-pin` bewaken of een pin nog actueel is.
# Alleen de eerste is blokkerend van aard; de motivatie per job staat erboven.
#
# Over `infra-image-pins`:
#
# De pins staan (bewust expliciet, conform Scorecard Pinned-Dependencies) op meerdere
# plekken: compose.yaml, .github/workflows/deploy.yml (REDIS_IMAGE, TOXIPROXY_IMAGE),
# demo/environment/zad-demo/README.md en de test-devservices-image-names. Dependabot's
# docker-compose-ecosystem ziet alléén compose.yaml; de workflow-env, het runbook en de
# Kotlin-test-strings niet. Een Dependabot-bump zou dus drift veroorzaken. Deze guard maakt zo'n
# gedeeltelijke bump een harde fout, zodat alle pins samen bewegen (de pins zelf blijven expliciet).
#
# De melding hieronder noemt de vindplaatsen niet met naam: die lijst verouderde eerder al. Ze zegt
# waar je ze vindt, zodat het antwoord altijd klopt.

name: Pin consistency

on:
  # deploy.yml roept deze workflow aan voor PR's naar main en voor pushes naar main. Daar hangt
  # de deploy er met `needs:` aan, in plaats van in een eigen job op de check-run te pollen —
  # een pollende job houdt een runner bezet zonder werk te doen.
  workflow_call:
  # Complement van deploy.yml's `branches: [main]`: een gestapelde PR draait deploy.yml niet en
  # heeft deze guard dus zelfstandig nodig. Zonder dit filter zou hij op een PR naar main twee
  # keer draaien.
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened]
  # De twee actualiteitscontroles hangen anders volledig aan PR-verkeer: in een rustige week meldt
  # niemand dat een pin onvindbaar is geworden of dat het bron-repository is verdwenen. Wekelijks
  # is genoeg — het gaat om toestanden die dagen blijven staan, niet om iets dat per commit wijzigt.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infra-image-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: infra-image-pins moeten overal identiek zijn
        run: |
          fail=0
          for img in redis/redis-stack-server ghcr.io/shopify/toxiproxy; do
            # -I slaat binaire bestanden over (pins staan in tekst), zodat geen stderr-ruis;
            # stderr verder NIET dempen — een echte grep/xargs-fout moet zichtbaar zijn.
            #
            # `git grep` en niet `git ls-files | xargs grep`: die vorm splitst geciteerde paden
            # (niet-ASCII, witruimte) op witruimte en slaat die bestanden dus over — een
            # afwijkende pin daarin verdwijnt en de guard meldt "uniform". `xargs` maakt het
            # bovendien onmogelijk 1 (geen match) van 2 (leesfout) te onderscheiden zodra de
            # bestandenlijst over meerdere aanroepen verdeeld wordt.
            #
            # Status vasthouden: 1 is "geen match" (de tak hieronder meldt dat precies), alles
            # daarboven is een echte fout en mag deze guard niet stilzwijgend passeren.
            #
            # `--cached` leest de blobs uit de index: een onleesbaar of ontbrekend werkboombestand
            # verkleint de zoekruimte anders stilzwijgend (git grep meldt dat op stderr en eindigt
            # gewoon met 0), en dan meldt de guard "uniform" over een pin die hij niet gezien heeft.
            # `docs/plans/` valt erbuiten: een plan is een verslag van een moment en citeert de pin
            # die tóen gold. Die meeslepen zou de vastlegging vervalsen, en hem meetellen zou deze
            # guard laten falen op een bestand dat niets uitrolt.
            ruwe_pins=$(git grep --cached -hoIE "${img}:[A-Za-z0-9._-]+" -- . ':!docs/plans/' ) || rc=$?
            rc=${rc:-0}

            if [ "$rc" -gt 1 ]; then
              echo "::error::git grep faalde (rc=$rc) bij het zoeken naar ${img} — deze guard meet niets."
              fail=1
              unset rc

              continue
            fi

            unset rc
            mapfile -t pins < <(printf '%s\n' "$ruwe_pins" | grep -v '^$' | sort -u)
            printf '%s pin(s): %s\n' "$img" "${pins[*]:-<geen>}"
            if [ "${#pins[@]}" -eq 0 ]; then
              # Nul matches = image overal hernoemd/verwijderd (of regex matcht niet meer).
              # Zonder deze tak zou de guard stil groen worden en drift juist niet meer zien.
              echo "::error::geen pin gevonden voor ${img} — guard kan drift niet meer detecteren (image hernoemd/verwijderd, of pas deze workflow aan)."
              fail=1
            elif [ "${#pins[@]}" -gt 1 ]; then
              echo "::error::${img}-pin niet uniform (${pins[*]}). Alle vindplaatsen: git grep -nI '${img}:' -- . ':!docs/plans/'; Dependabot bumpt alleen compose.yaml."
              fail=1
            fi
          done
          exit "$fail"

  # Het fuzz-basis-image bevat een warme Maven-repository die bij de pom's van dát moment hoort.
  # `.clusterfuzzlite/Dockerfile` pint het op digest, dus na een pom-wijziging hoort er een nieuw
  # image gebouwd en gepind te worden.
  #
  # Deze job WAARSCHUWT en blokkeert niet. Een verouderde pin maakt de fuzz-build namelijk niet
  # stuk: Maven haalt op wat er in de warme repository ontbreekt, dus het gevolg is een tragere
  # voorbereiding, niet een foute. Blokkeren zou bovendien vastlopen — het nieuwe image wordt pas
  # gebouwd bij een push naar main, en die push is precies wat een blokkerende check tegenhoudt.
  # Elke dependency-bump zou dan handwerk vragen vóór hij überhaupt gemerged kan worden.
  fuzz-basis-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: write voor de melding hieronder. Een annotatie alleen is te makkelijk te
    # missen: deze job blijft bij een verouderde pin groen, dus niemand opent hem.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hoort de gepinde digest bij de huidige pom's
        id: pin
        env:
          # Zelfde bestandenset als .github/workflows/fuzz-base-image.yml voor de tag gebruikt.
          VERWACHT: ${{ hashFiles('**/pom.xml', '.mvn/**', 'mvnw') }}
        run: .github/scripts/fuzz-basis-pin.sh

      - name: Beoordeel de uitkomst
        id: oordeel
        env:
          STATUS: ${{ steps.pin.outputs.status }}
          DIGEST: ${{ steps.pin.outputs.verwachte_digest }}
          IMAGE_PAD: ${{ steps.pin.outputs.image_pad }}
        run: |
          set -euo pipefail

          case "$STATUS" in
            ok)
              echo "Basis-image-pin hoort bij de huidige pom's."
              ;;
            ontbreekt)
              echo "::warning::Nog geen fuzz-basis-image voor deze pom's."
              {
                echo "melding<<EOM"
                echo "De dependency-declaraties zijn gewijzigd, dus het fuzz-basis-image met de warme"
                echo "Maven-repository hoort opnieuw gebouwd te worden."
                echo
                echo "**Blokkeert niets.** De fuzz-controle werkt gewoon; hij haalt alleen het verschil"
                echo "elke run opnieuw op, en is daarmee zo traag als vóór het basis-image."
                echo
                echo "Na de merge naar \`main\` bouwt de workflow **Fuzz-basis-image** het nieuwe image en"
                echo "biedt hij de nieuwe pin als PR aan. Merge die PR en deze melding verdwijnt."
                echo "EOM"
              } >> "$GITHUB_OUTPUT"
              ;;
            verouderd)
              echo "::warning::De pin hoort niet bij de huidige pom's; pin $DIGEST."
              {
                echo "melding<<EOM"
                echo "Er is een fuzz-basis-image dat wél bij de huidige dependency-declaraties hoort, maar"
                echo "\`.clusterfuzzlite/Dockerfile\` wijst nog naar een ander."
                echo
                echo "**Blokkeert niets**, maar de fuzz-voorbereiding is tot die tijd trager dan nodig."
                echo
                echo "Werk de pin bij naar:"
                echo
                echo '```dockerfile'
                echo "FROM ghcr.io/${IMAGE_PAD}@${DIGEST}"
                echo '```'
                echo "EOM"
              } >> "$GITHUB_OUTPUT"
              ;;
            oncontroleerbaar)
              echo "::warning::De basis-image-pin is deze run NIET gecontroleerd (registry niet te bevragen)."
              ;;
            *)
              # geen-pin / geen-pom-hash: geen situatie die een dependency-bump veroorzaakt, maar
              # een wijziging aan de Dockerfile of aan deze workflow zelf. Dan valt er niets meer
              # te controleren en is stil doorgaan het slechtste antwoord.
              echo "::error::Basis-image-pin niet te beoordelen (status=$STATUS) — er valt niets meer te controleren."
              exit 1
              ;;
          esac

      # Alleen op een PR uit deze repo: bij een fork is GITHUB_TOKEN read-only, dus zou de
      # comment een 403 geven en zou uitgerekend deze job — die zichzelf niet-blokkerend noemt —
      # de deploy-gate tegenhouden. `continue-on-error` vangt de resterende API-hikken af: een
      # gemiste melding mag nooit zwaarder wegen dan de wijziging zelf.
      - name: Meld een verouderde pin op de PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MELDING: ${{ steps.oordeel.outputs.melding }}
          MARKER: '<!-- fuzz-basis-pin -->'
        run: |
          set -euo pipefail

          bestaand=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | first | .id // empty" | head -1)

          if [ -z "$MELDING" ]; then
            if [ -n "$bestaand" ]; then
              gh api -X DELETE "repos/$REPO/issues/comments/$bestaand"
              echo "Pin is weer bij; melding verwijderd."
            fi
            exit 0
          fi

          body=$(printf '%s\n### Fuzz-basis-image loopt achter op de dependency-declaraties\n\n%s\n' "$MARKER" "$MELDING")

          if [ -n "$bestaand" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$bestaand" -f body="$body" --jq .html_url
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" --jq .html_url
          fi

  # De berichtenbox van de proeftuin (MinBZK/moza-poc) staat in compose.yaml op digest gepind, en
  # Dependabot bumpt die digest zodra hun main verder gaat. Dit is het vangnet naast dat pad: geen
  # PR is precies hoe "alles bij" eruitziet, dus een stilgevallen bump — hun `latest` blijft staan,
  # zijn parser struikelt over een volgende wijziging in dat bestand — valt zonder deze job niemand
  # op. Hier staat actief wat de stand is.
  #
  # Achterlopen waarschuwt en blokkeert niet: een oudere berichtenbox is een oudere demo, geen
  # kapotte build, en meebewegen vraagt een oordeel omdat hun main ook halfaf werk draagt. Wat wél
  # blokkeert is een pin die niet te trekken is of een guard die zijn eigen bron kwijt is: daar
  # levert doorgaan een kapot component op, of een controle die niets meer meet.
  proeftuin-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: write voor de melding hieronder; deze job blijft bij een verouderde pin groen,
    # dus een annotatie alleen zou niemand openen.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wijst de pin naar de huidige main van de proeftuin
        id: pin
        env:
          # Alleen om de anonieme API-limiet (60 per uur per IP, gedeeld met elke andere runner op
          # dat IP) te ontlopen; het gaat om een publiek repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/proeftuin-pin.sh

      - name: Beoordeel de uitkomst
        id: oordeel
        env:
          STATUS: ${{ steps.pin.outputs.status }}
          TAG: ${{ steps.pin.outputs.verwachte_tag }}
          REGEL: ${{ steps.pin.outputs.verwachte_regel }}
          HUIDIG: ${{ steps.pin.outputs.huidige_referentie }}
        run: |
          set -euo pipefail

          # Eén opbouw voor de twee gevallen die om een oordeel van een mens vragen.
          melding() {
            {
              echo "melding<<EOM"
              printf '%s\n' "$@"
              echo "EOM"
            } >> "$GITHUB_OUTPUT"
          }

          case "$STATUS" in
            ok)
              echo "De berichtenbox staat op de huidige main van MinBZK/moza-poc ($TAG)."
              ;;
            verouderd)
              echo "::warning::De berichtenbox loopt achter; hun main is $TAG."
              melding \
                "De demo draait \`$HUIDIG\`, terwijl \`MinBZK/moza-poc\` op \`$TAG\` staat." \
                "" \
                "**Blokkeert niets** en is geen opdracht: hun main draagt ook werk dat halfaf kan zijn." \
                "" \
                "Normaal komt deze bump vanzelf langs als Dependabot-PR, want de pin staat op digest." \
                "Blijft die uit terwijl deze melding staat, dan is er iets mis met dat pad en is dit" \
                "de regel om met de hand te zetten in \`compose.yaml\`:" \
                "" \
                '```yaml' \
                "$REGEL" \
                '```'
              ;;
            preview)
              echo "::warning::De berichtenbox staat op een preview van hun kant: $HUIDIG"
              melding \
                "De demo draait \`$HUIDIG\` — nog niet gemergd werk uit hun preview-repository." \
                "" \
                "Dat mag tijdelijk, om hun werk vóór hun merge te beproeven. Maar die tag verdwijnt uit" \
                "ghcr zodra hun PR sluit, en dan trekt de eerstvolgende herstart een image dat er niet" \
                "meer is. Zwaai vóór het mergen van déze PR terug naar een digest uit hun main."
              ;;
            ontbreekt)
              # Hun bouw loopt nog, of viel. Beide keren valt er niets te kiezen, dus geen melding
              # op de PR: die zou bij de volgende run vanzelf weer verdwijnen.
              echo "::warning::Voor de huidige main-commit van de proeftuin ($TAG) staat nog geen image in ghcr."
              ;;
            oncontroleerbaar)
              echo "::warning::De proeftuin-pin is deze run NIET gecontroleerd (GitHub of ghcr niet te bevragen)."
              ;;
            pin-onvindbaar)
              # Anders dan achterlopen is dit geen kwestie van smaak: het image bestaat niet meer,
              # dus de eerstvolgende herstart van het component levert ImagePullBackOff op. Dat
              # laten passeren maakt de demo stuk op een moment dat niemand aan deze pin denkt.
              echo "::error::De gepinde berichtenbox ($HUIDIG) bestaat niet in het register; een herstart zou hem niet kunnen trekken."
              exit 1
              ;;
            bron-weg)
              echo "::error::Het bron-repository van de proeftuin bestaat niet meer onder die naam; deze controle meet niets meer."
              exit 1
              ;;
            *)
              # geen-pin: de image-regel is uit compose.yaml verdwenen of onleesbaar geworden. Dan
              # meet deze job niets meer, en stil groen worden is het slechtste antwoord — te meer
              # omdat deploy.yml diezelfde regel leest en dus óók niets meer zou vinden.
              echo "::error::Proeftuin-pin niet te beoordelen (status=$STATUS) — er valt niets meer te controleren."
              exit 1
              ;;
          esac

      # Zelfde afweging als bij fuzz-basis-pin: op een fork is GITHUB_TOKEN read-only, en een
      # gemiste melding mag nooit zwaarder wegen dan de wijziging zelf.
      - name: Meld de stand van de pin op de PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STATUS: ${{ steps.pin.outputs.status }}
          MELDING: ${{ steps.oordeel.outputs.melding }}
          MARKER: '<!-- proeftuin-pin -->'
        run: |
          set -euo pipefail

          bestaand=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | first | .id // empty" | head -1)

          if [ -z "$MELDING" ]; then
            # Alleen wissen bij een positief vastgestelde stand. Een run die niets kón vaststellen —
            # of die op hun bouw wacht — zou anders een eerder wél vastgestelde bevinding van de PR
            # halen, met "Pin is weer bij" in het logboek. De PR ziet er dan schoon uit terwijl er
            # niets gecontroleerd is.
            if [ -n "$bestaand" ] && [ "$STATUS" = ok ]; then
              gh api -X DELETE "repos/$REPO/issues/comments/$bestaand"
              echo "Pin is weer bij; melding verwijderd."
            fi

            exit 0
          fi

          body=$(printf '%s\n### De berichtenbox van de proeftuin vraagt aandacht\n\n%s\n' "$MARKER" "$MELDING")

          if [ -n "$bestaand" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$bestaand" -f body="$body" --jq .html_url
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" --jq .html_url
          fi
