# Houdt de pins van de zelf-gedeployde infra-images uniform over alle locaties.
#
# De pins staan (bewust expliciet, conform Scorecard Pinned-Dependencies) op meerdere
# plekken: compose.yaml, .github/workflows/deploy.yml (REDIS_IMAGE) en de
# test-devservices-image-names. Dependabot's docker-compose-ecosystem ziet alléén
# compose.yaml; de workflow-env en de Kotlin-test-strings niet. Een Dependabot-bump
# zou dus drift veroorzaken. Deze guard maakt zo'n gedeeltelijke bump een harde fout,
# zodat alle pins samen bewegen (de pins zelf blijven expliciet).

name: Pin consistency

on:
  # deploy.yml roept deze workflow aan voor PR's naar main en voor pushes naar main. Daar hangt
  # de deploy er met `needs:` aan, in plaats van in een eigen job op de check-run te pollen —
  # een pollende job houdt een runner bezet zonder werk te doen.
  workflow_call:
  # Complement van deploy.yml's `branches: [main]`: een gestapelde PR draait deploy.yml niet en
  # heeft deze guard dus zelfstandig nodig. Zonder dit filter zou hij op een PR naar main twee
  # keer draaien.
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  infra-image-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: infra-image-pins moeten overal identiek zijn
        run: |
          fail=0
          for img in redis/redis-stack-server; do
            # -I slaat binaire bestanden over (pins staan in tekst), zodat geen stderr-ruis;
            # stderr verder NIET dempen — een echte grep/xargs-fout moet zichtbaar zijn.
            mapfile -t pins < <(git ls-files | xargs grep -hoIE "${img}:[A-Za-z0-9._-]+" | sort -u)
            printf '%s pin(s): %s\n' "$img" "${pins[*]:-<geen>}"
            if [ "${#pins[@]}" -eq 0 ]; then
              # Nul matches = image overal hernoemd/verwijderd (of regex matcht niet meer).
              # Zonder deze tak zou de guard stil groen worden en drift juist niet meer zien.
              echo "::error::geen pin gevonden voor ${img} — guard kan drift niet meer detecteren (image hernoemd/verwijderd, of pas deze workflow aan)."
              fail=1
            elif [ "${#pins[@]}" -gt 1 ]; then
              echo "::error::${img}-pin niet uniform (${pins[*]}). Sync compose.yaml, .github/workflows/deploy.yml en de test-image-names; Dependabot bumpt alleen compose.yaml."
              fail=1
            fi
          done
          exit "$fail"

  # Het fuzz-basis-image bevat een warme Maven-repository die bij de pom's van dát moment hoort.
  # `.clusterfuzzlite/Dockerfile` pint het op digest, dus na een pom-wijziging hoort er een nieuw
  # image gebouwd en gepind te worden.
  #
  # Deze job WAARSCHUWT en blokkeert niet. Een verouderde pin maakt de fuzz-build namelijk niet
  # stuk: Maven haalt op wat er in de warme repository ontbreekt, dus het gevolg is een tragere
  # voorbereiding, niet een foute. Blokkeren zou bovendien vastlopen — het nieuwe image wordt pas
  # gebouwd bij een push naar main, en die push is precies wat een blokkerende check tegenhoudt.
  # Elke dependency-bump zou dan handwerk vragen vóór hij überhaupt gemerged kan worden.
  fuzz-basis-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: De gepinde digest hoort bij de huidige pom's
        env:
          # Zelfde bestandenset als .github/workflows/fuzz-base-image.yml gebruikt voor de tag;
          # lopen die twee uiteen, dan vindt de opzoeking hieronder niets en faalt deze job.
          VERWACHT: ${{ hashFiles('**/pom.xml', '.mvn/**', 'mvnw') }}
          IMAGE_PAD: minbzk/fbs-fuzz-base
        run: |
          set -euo pipefail

          gepind=$(grep -oE 'sha256:[a-f0-9]{64}' .clusterfuzzlite/Dockerfile | head -1)
          if [ -z "$gepind" ]; then
            # Wél hard: zonder pin kan hier niets meer gecontroleerd worden, en dat is een
            # wijziging aan de Dockerfile zelf — geen situatie die een dependency-bump veroorzaakt.
            echo "::error::geen digest-pin gevonden in .clusterfuzzlite/Dockerfile — er valt niets meer te controleren."
            exit 1
          fi

          # Publiek image: een anoniem pull-token volstaat, geen secret nodig.
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE_PAD}:pull&service=ghcr.io" | jq -r .token)
          verwachte_digest=$(curl -fsSI \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${IMAGE_PAD}/manifests/poms-${VERWACHT}" \
            | tr -d '\r' | awk '/[Dd]ocker-[Cc]ontent-[Dd]igest/ {print $2}') || verwachte_digest=""

          if [ -z "$verwachte_digest" ]; then
            echo "::warning::Nog geen fuzz-basis-image voor deze pom's (tag poms-${VERWACHT}). De fuzz-controle werkt gewoon, maar haalt het verschil elke run opnieuw op. Na de merge naar main bouwt de workflow 'Fuzz-basis-image' het nieuwe image; pin daarna de digest die hij print in .clusterfuzzlite/Dockerfile."
            exit 0
          fi

          printf 'gepind:    %s\nverwacht:  %s\n' "$gepind" "$verwachte_digest"

          if [ "$gepind" != "$verwachte_digest" ]; then
            echo "::warning::Er is een fuzz-basis-image dat wél bij deze pom's hoort, maar de pin wijst naar een ander. Pin ${verwachte_digest} in .clusterfuzzlite/Dockerfile; tot dan is de fuzz-voorbereiding trager dan nodig."
            exit 0
          fi

          echo "Basis-image-pin hoort bij de huidige pom's."
