# Houdt de pins van de zelf-gedeployde infra-images uniform over alle locaties.
#
# De pins staan (bewust expliciet, conform Scorecard Pinned-Dependencies) op meerdere
# plekken: compose.yaml, .github/workflows/deploy.yml (REDIS_IMAGE) en de
# test-devservices-image-names. Dependabot's docker-compose-ecosystem ziet alléén
# compose.yaml; de workflow-env en de Kotlin-test-strings niet. Een Dependabot-bump
# zou dus drift veroorzaken. Deze guard maakt zo'n gedeeltelijke bump een harde fout,
# zodat alle pins samen bewegen (de pins zelf blijven expliciet).

name: Pin consistency

on:
  # deploy.yml roept deze workflow aan voor PR's naar main en voor pushes naar main. Daar hangt
  # de deploy er met `needs:` aan, in plaats van in een eigen job op de check-run te pollen —
  # een pollende job houdt een runner bezet zonder werk te doen.
  workflow_call:
  # Complement van deploy.yml's `branches: [main]`: een gestapelde PR draait deploy.yml niet en
  # heeft deze guard dus zelfstandig nodig. Zonder dit filter zou hij op een PR naar main twee
  # keer draaien.
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  infra-image-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: infra-image-pins moeten overal identiek zijn
        run: |
          fail=0
          for img in redis/redis-stack-server; do
            # -I slaat binaire bestanden over (pins staan in tekst), zodat geen stderr-ruis;
            # stderr verder NIET dempen — een echte grep/xargs-fout moet zichtbaar zijn.
            mapfile -t pins < <(git ls-files | xargs grep -hoIE "${img}:[A-Za-z0-9._-]+" | sort -u)
            printf '%s pin(s): %s\n' "$img" "${pins[*]:-<geen>}"
            if [ "${#pins[@]}" -eq 0 ]; then
              # Nul matches = image overal hernoemd/verwijderd (of regex matcht niet meer).
              # Zonder deze tak zou de guard stil groen worden en drift juist niet meer zien.
              echo "::error::geen pin gevonden voor ${img} — guard kan drift niet meer detecteren (image hernoemd/verwijderd, of pas deze workflow aan)."
              fail=1
            elif [ "${#pins[@]}" -gt 1 ]; then
              echo "::error::${img}-pin niet uniform (${pins[*]}). Sync compose.yaml, .github/workflows/deploy.yml en de test-image-names; Dependabot bumpt alleen compose.yaml."
              fail=1
            fi
          done
          exit "$fail"

  # Het fuzz-basis-image bevat een warme Maven-repository die bij de pom's van dát moment hoort.
  # `.clusterfuzzlite/Dockerfile` pint het op digest, dus na een pom-wijziging hoort er een nieuw
  # image gebouwd en gepind te worden.
  #
  # Deze job WAARSCHUWT en blokkeert niet. Een verouderde pin maakt de fuzz-build namelijk niet
  # stuk: Maven haalt op wat er in de warme repository ontbreekt, dus het gevolg is een tragere
  # voorbereiding, niet een foute. Blokkeren zou bovendien vastlopen — het nieuwe image wordt pas
  # gebouwd bij een push naar main, en die push is precies wat een blokkerende check tegenhoudt.
  # Elke dependency-bump zou dan handwerk vragen vóór hij überhaupt gemerged kan worden.
  fuzz-basis-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: write voor de PR-comment hieronder. Een annotatie alleen is te makkelijk te
    # missen: deze job blijft groen, dus niemand opent hem.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: De gepinde digest hoort bij de huidige pom's
        id: pin
        env:
          # Zelfde bestandenset als .github/workflows/fuzz-base-image.yml gebruikt voor de tag;
          # lopen die twee uiteen, dan vindt de opzoeking hieronder niets en faalt deze job.
          VERWACHT: ${{ hashFiles('**/pom.xml', '.mvn/**', 'mvnw') }}
        run: |
          set -euo pipefail

          # Anker op de FROM-regel: een losse `sha256:`-grep pakt ook een voorbeeld-digest uit
          # het commentaarblok erboven, en vergelijkt dan stilzwijgend de verkeerde. `|| true`
          # omdat grep zonder match exit 1 geeft, wat met `pipefail` de eigen foutmelding
          # hieronder zou overslaan.
          from_regel=$(grep -oE '^FROM +[^ ]+@sha256:[a-f0-9]{64}' .clusterfuzzlite/Dockerfile || true)
          gepind=${from_regel##*@}
          image_pad=$(sed -E 's|^FROM +ghcr\.io/||; s|@sha256:.*||' <<<"$from_regel")

          if [ -z "$gepind" ] || [ -z "$image_pad" ]; then
            # Wél hard: zonder pin kan hier niets meer gecontroleerd worden, en dat is een
            # wijziging aan de Dockerfile zelf — geen situatie die een dependency-bump veroorzaakt.
            echo "::error::geen FROM-regel met digest-pin in .clusterfuzzlite/Dockerfile — er valt niets meer te controleren."
            exit 1
          fi

          if [ -z "$VERWACHT" ]; then
            echo "::error::hashFiles leverde geen pom-hash op — het bestandspatroon in deze job klopt niet meer."
            exit 1
          fi

          # Publiek image: een anoniem pull-token volstaat, geen secret nodig. `jq -e` zodat een
          # antwoord zonder token niet als de string "null" doorgaat en verderop een 401 oplevert
          # die we dan voor "image bestaat niet" zouden aanzien.
          if ! token=$(curl -fsS "https://ghcr.io/token?scope=repository:${image_pad}:pull&service=ghcr.io" | jq -er .token); then
            echo "::warning::Geen pull-token van ghcr — de basis-image-pin is deze run NIET gecontroleerd."
            exit 0
          fi

          # Alleen een 404 betekent "dit image bestaat nog niet". Elke andere fout (401, 429,
          # 5xx, DNS) zegt dat de controle zelf niet kon draaien; die mag niet als "nog niet
          # gebouwd" gerapporteerd worden, want dan meldt de guard een oorzaak die hij nooit
          # heeft vastgesteld en blijft hij dat eeuwig doen.
          http=$(curl -sS -o /tmp/manifest-headers -D /tmp/manifest-headers -w '%{http_code}' -I \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${image_pad}/manifests/poms-${VERWACHT}" || echo "000")

          case "$http" in
            200)
              verwachte_digest=$(tr -d '\r' < /tmp/manifest-headers | awk '/[Dd]ocker-[Cc]ontent-[Dd]igest/ {print $2}')
              if [ -z "$verwachte_digest" ]; then
                echo "::warning::ghcr antwoordde 200 zonder Docker-Content-Digest — de pin is deze run NIET gecontroleerd."
                exit 0
              fi
              ;;
            404)
              verwachte_digest=""
              ;;
            *)
              echo "::warning::ghcr antwoordde $http — de basis-image-pin is deze run NIET gecontroleerd."
              exit 0
              ;;
          esac

          if [ -z "$verwachte_digest" ]; then
            echo "::warning::Nog geen fuzz-basis-image voor deze pom's (tag poms-${VERWACHT})."
            {
              echo "melding<<EOM"
              echo "De dependency-declaraties zijn gewijzigd, dus het fuzz-basis-image met de warme"
              echo "Maven-repository hoort opnieuw gebouwd te worden."
              echo
              echo "**Blokkeert niets.** De fuzz-controle werkt gewoon; hij haalt alleen het verschil"
              echo "elke run opnieuw op, en is daarmee zo traag als vóór het basis-image."
              echo
              echo "Na de merge naar \`main\` bouwt de workflow **Fuzz-basis-image** het nieuwe image en"
              echo "print hij de digest. Zet die in \`.clusterfuzzlite/Dockerfile\` en deze melding verdwijnt."
              echo "EOM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'gepind:    %s\nverwacht:  %s\n' "$gepind" "$verwachte_digest"

          if [ "$gepind" != "$verwachte_digest" ]; then
            echo "::warning::De pin hoort niet bij de huidige pom's; pin ${verwachte_digest}."
            {
              echo "melding<<EOM"
              echo "Er is een fuzz-basis-image dat wél bij de huidige dependency-declaraties hoort, maar"
              echo "\`.clusterfuzzlite/Dockerfile\` wijst nog naar een ander."
              echo
              echo "**Blokkeert niets**, maar de fuzz-voorbereiding is tot die tijd trager dan nodig."
              echo
              echo "Werk de pin bij naar:"
              echo
              echo '```dockerfile'
              echo "FROM ghcr.io/${image_pad}@${verwachte_digest}"
              echo '```'
              echo "EOM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Basis-image-pin hoort bij de huidige pom's."

      # De annotatie hierboven staat op de run-samenvatting van een job die groen blijft — die
      # leest niemand. Deze comment staat waar de wijziging beoordeeld wordt, en wordt weer
      # opgeruimd zodra de pin klopt, zodat er geen verouderde melding blijft hangen.
      # Alleen op een PR uit deze repo: bij een fork is GITHUB_TOKEN read-only, dus zou de
      # comment een 403 geven en zou uitgerekend deze job — die zichzelf niet-blokkerend noemt —
      # de deploy-gate tegenhouden. `continue-on-error` vangt de resterende API-hikken af: een
      # gemiste melding mag nooit zwaarder wegen dan de wijziging zelf.
      - name: Meld een verouderde pin op de PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MELDING: ${{ steps.pin.outputs.melding }}
          MARKER: '<!-- fuzz-basis-pin -->'
        run: |
          set -euo pipefail

          bestaand=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | first | .id // empty")

          if [ -z "$MELDING" ]; then
            if [ -n "$bestaand" ]; then
              gh api -X DELETE "repos/$REPO/issues/comments/$bestaand"
              echo "Pin is weer bij; melding verwijderd."
            fi
            exit 0
          fi

          body=$(printf '%s\n### Fuzz-basis-image loopt achter op de dependency-declaraties\n\n%s\n' "$MARKER" "$MELDING")

          if [ -n "$bestaand" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$bestaand" -f body="$body" --jq .html_url
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" --jq .html_url
          fi
