# Prometheus-alertregels voor de berichtenuitvraag. Laden met `rule_files` in Prometheus of als
# Mimir/Grafana-regelgroep. Uitleg, drempels en wat te doen: beheer/README.md en de sectie
# "Meldingen" van docs/operator-handleiding-uitvraag.md.
#
# Elke expressie sluit previews uit (`omgeving!~"pr-.*"`). Elke expr staat op één regel; de toets
# BeheerbestandenTest leest ze zo en eist dat elke genoemde meetwaarde bestaat.
groups:
  - name: berichtenuitvraag
    rules:
      - alert: UitvraagLevertGeenMeetgegevens
        expr: absent(process_uptime_seconds{dienst="berichtenuitvraag", omgeving!~"pr-.*"})
        for: 5m
        labels:
          severity: kritiek
        annotations:
          summary: De berichtenuitvraag levert geen meetgegevens
          description: "Vijf minuten lang leverde geen instantie meetgegevens. Wat te doen: kijk of de dienst draait (health, logs) en of de scrape hem bereikt."
          runbook_url: https://github.com/MinBZK/moza-poc-fbs-berichtenbox/blob/main/docs/operator-handleiding-uitvraag.md#meldingen

      - alert: UitvraagFoutpercentageHoog
        expr: sum by (omgeving) (rate(http_server_requests_seconds_count{dienst="berichtenuitvraag", omgeving!~"pr-.*", status=~"5.."}[5m])) / sum by (omgeving) (rate(http_server_requests_seconds_count{dienst="berichtenuitvraag", omgeving!~"pr-.*"}[5m])) > 0.05
        for: 5m
        labels:
          severity: kritiek
        annotations:
          summary: Meer dan 5% van de verzoeken aan de uitvraag eindigt in een 5xx
          description: "Een 429 (de bovengrens op gelijktijdige ophaalrondes) telt niet mee. Wat te doen: kijk of UitvraagLogboekWeigert of UitvraagMagazijnFaalt ook afgaat, anders de log op errorId's en Redis."
          runbook_url: https://github.com/MinBZK/moza-poc-fbs-berichtenbox/blob/main/docs/operator-handleiding-uitvraag.md#meldingen

      - alert: UitvraagMagazijnFaalt
        expr: sum by (omgeving, address) (rate(http_client_requests_seconds_count{dienst="berichtenuitvraag", omgeving!~"pr-.*", clientName="none", outcome!="SUCCESS"}[5m])) / sum by (omgeving, address) (rate(http_client_requests_seconds_count{dienst="berichtenuitvraag", omgeving!~"pr-.*", clientName="none"}[5m])) > 0.5
        for: 5m
        labels:
          severity: waarschuwing
        annotations:
          summary: "Meer dan de helft van de aanroepen van magazijn {{ $labels.address }} mislukt"
          description: "Ondernemers zien de berichten van dit magazijn niet of onvolledig; de andere magazijnen gaan door. Wat te doen: de bereikbaarheid van het magazijn, en de FSC-outway als die ertussen zit."
          runbook_url: https://github.com/MinBZK/moza-poc-fbs-berichtenbox/blob/main/docs/operator-handleiding-uitvraag.md#meldingen

      - alert: UitvraagLogboekWeigert
        expr: sum by (omgeving) (increase(fbs_logboek_geweigerd_total{dienst="berichtenuitvraag", omgeving!~"pr-.*"}[5m])) > 0
        for: 0m
        labels:
          severity: kritiek
        annotations:
          summary: De uitvraag weigert verzoeken omdat het logboek faalt
          description: "Het logboek kon een verwerking niet vastleggen en de dienst faalt dicht. Wat te doen: de database van het logboek (LDV_POSTGRES_URL) en de log op LogboekWriteException."
          runbook_url: https://github.com/MinBZK/moza-poc-fbs-berichtenbox/blob/main/docs/operator-handleiding-uitvraag.md#meldingen

      - alert: UitvraagLogboekWaarschuwing
        expr: sum by (omgeving, code) (increase(fbs_logboek_waarschuwing_total{dienst="berichtenuitvraag", omgeving!~"pr-.*"}[15m])) > 0
        for: 0m
        labels:
          severity: waarschuwing
        annotations:
          summary: "Waarschuwing van het logboek: {{ $labels.code }}"
          description: "Het logboek geeft een verwerking mogelijk onjuist weer, of gegevens verdwijnen zonder logregel (sessie_veger_faalt, opruimen_na_schrijven: de Redis-TTL wist straks zonder logregel). Wat te doen: per code in de operator-handleiding."
          runbook_url: https://github.com/MinBZK/moza-poc-fbs-berichtenbox/blob/main/docs/operator-handleiding-uitvraag.md#meldingen
