wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
# Zonder deze som borgt alleen TLS de distributie: dat beschermt het transport, niet de herkomst
# van het archief. mvnw en mvnw.cmd breken de build af zodra de som niet klopt, en ook wanneer
# sha256sum/shasum ontbreekt — de controle valt dus nergens stil weg. Ze vuurt wel alleen bij een
# echte download: is de distributie al uitgepakt (lokaal, of uit de maven-wrapper-cache van een
# CI-runner), dan valt er niets te toetsen.
#
# Bij een versiebump hoort deze regel mee; de wrapper meldt dat expliciet zodra de som niet meer
# past. Apache publiceert zelf alleen SHA-512, op zowel repo.maven.apache.org als
# archive.apache.org. Toets de download eerst daartegen en leid de SHA-256 pas daarna af:
#   curl -fsSLO <distributionUrl> && sha512sum apache-maven-<versie>-bin.zip
#   sha256sum apache-maven-<versie>-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
