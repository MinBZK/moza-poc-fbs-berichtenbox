quarkus.application.name=fbs-demo-console
quarkus.container-image.name=fbs-demo-console

# Laat afwezige velden weg (bv. bijlagen=null) uit de aanlever-JSON naar het magazijn.
quarkus.jackson.serialization-inclusion=non-null

# Zet de default rest-client-exception-mapper uit: die mapt elke 4xx/5xx naar een
# WebApplicationException, óók voor methodes die `Response` teruggeven. Deze module inspecteert de
# status juist zelf (controleer(), status/body uitlezen bij foutieve aanlevering, 404 negeren bij
# het verwijderen van een niet-bestaande WireMock-overlay). Zonder dit gooit bv. een DELETE-op-404.
microprofile.rest.client.disable.default.mapper=true

# Browser-zichtbaar adres van de uitvraag-API. Leeg lokaal: de Berichtenbox-pagina leidt het adres
# dan af uit de browser-locatie, wat ook op een VM-adres klopt. Op ZAD is er geen poort 8086 en is
# het schema https, dus daar zet de deployment deze waarde.
demo.omgeving.uitvraag-basis=${UITVRAAG_BASIS:}

# Browser-zichtbaar adres van de berichtenbox, voor het frame in het paneel. Leeg lokaal: daar zet
# de demo-proxy de berichtenbox op dezelfde origin als dit paneel en klopt het eigen pad. Op een
# gedeelde omgeving draagt elk component zijn eigen hostnaam en hoort hier de volledige URL.
demo.omgeving.berichtenbox-url=${BERICHTENBOX_URL:}

# Kan deze omgeving bij de sessiecache hieronder? Lokaal ja: de console deelt het compose-netwerk
# met Redis. Op een gedeelde omgeving staat Redis in een ander project, en cluster-intern verkeer
# daarheen bestaat alleen met een netwerkregel — die noemt een vaste deployment, dus hij volgt geen
# preview. Staat deze op false, dan laat het paneel de cache-verval-knop weg in plaats van een knop
# te tonen die gegarandeerd faalt.
demo.omgeving.sessiecache=${SESSIECACHE_BEREIKBAAR:true}

# Kent deze omgeving een magazijn-simulator? Alleen of, niet hoeveel: het aantal vraagt de console
# aan de simulator zelf. Staat deze op false, dan laat het paneel de knoppen voor de gesimuleerde
# magazijnen en hun chip weg in plaats van knoppen te tonen die gegarandeerd falen.
demo.omgeving.simulator=${SIMULATOR_BEREIKBAAR:true}

# Toxiproxy-instanties per proxy. Lokaal wijzen ze alle zes naar dezelfde container; op ZAD staat
# elke stroom achter zijn eigen Toxiproxy vóór zijn upstream, want daar draagt de eerste poort van
# een component de ingress en is er per stroom een eigen adres. Een lege waarde schakelt een proxy
# uit (zie ToxiproxyAdressen): hij verdwijnt uit /api/demo/omgeving en het paneel toont zijn knop
# dan niet meer — zo ontbreken de magazijn-proxies op ZAD.
#
# De twéé echte magazijnen houden hun proxy. De variatie in storingsgedrag komt nu uit de simulator,
# die per magazijn traag, haperend, kapot, onbereikbaar of weigerend kan zijn — maar A en B zitten
# niet in die simulator, en zij dragen wél het aanleveren, de bijlagen, de notificatie-outbox en FSC.
# Vier scenario's uit het runbook gaan juist over het uitvallen van dát soort magazijn; die proxies
# schrappen zou demonstratievermogen weghalen zonder dat er iets voor terugkomt.
demo.toxiproxy."magazijn-a".url=${TOXIPROXY_MAGAZIJN_A_URL:${TOXIPROXY_ADMIN_URL:http://localhost:8474}}
demo.toxiproxy."magazijn-b".url=${TOXIPROXY_MAGAZIJN_B_URL:${TOXIPROXY_ADMIN_URL:http://localhost:8474}}
demo.toxiproxy."profiel".url=${TOXIPROXY_PROFIEL_URL:${TOXIPROXY_ADMIN_URL:http://localhost:8474}}
demo.toxiproxy."notificatie".url=${TOXIPROXY_NOTIFICATIE_URL:${TOXIPROXY_ADMIN_URL:http://localhost:8474}}
demo.toxiproxy."aanmeld".url=${TOXIPROXY_AANMELD_URL:${TOXIPROXY_ADMIN_URL:http://localhost:8474}}
demo.toxiproxy."redis".url=${TOXIPROXY_REDIS_URL:${TOXIPROXY_ADMIN_URL:http://localhost:8474}}

# Waar elke proxy luistert en naartoe stuurt. De console maakt de proxies hiermee zelf aan
# (ProxyBootstrap), want op ZAD is er geen proxies.json: de inhoud van een attachment wordt daar
# ongewijzigd gemount en zou in elke preview de upstream van `test` noemen. De upstream komt daar uit
# een alias, en aliassen kennen $DEPLOYMENT_NAME wél.
#
# De defaults hieronder zijn de lokale compose-waarden en moeten gelijk blijven aan
# toxiproxy/proxies.json — ToxiproxyProxiesConsistentieTest faalt zodra dat niet meer klopt.
demo.toxiproxy."profiel".listen=${TOXIPROXY_PROFIEL_LISTEN:0.0.0.0:18089}
demo.toxiproxy."profiel".upstream=${TOXIPROXY_PROFIEL_UPSTREAM:profiel-service:8080}
demo.toxiproxy."notificatie".listen=${TOXIPROXY_NOTIFICATIE_LISTEN:0.0.0.0:18084}
demo.toxiproxy."notificatie".upstream=${TOXIPROXY_NOTIFICATIE_UPSTREAM:notificatie-stub:8080}
demo.toxiproxy."aanmeld".listen=${TOXIPROXY_AANMELD_LISTEN:0.0.0.0:18086}
demo.toxiproxy."aanmeld".upstream=${TOXIPROXY_AANMELD_UPSTREAM:berichtenuitvraag:8086}
demo.toxiproxy."redis".listen=${TOXIPROXY_REDIS_LISTEN:0.0.0.0:16379}
demo.toxiproxy."redis".upstream=${TOXIPROXY_REDIS_UPSTREAM:redis:6379}
demo.toxiproxy."magazijn-a".listen=${TOXIPROXY_MAGAZIJN_A_LISTEN:0.0.0.0:18090}
demo.toxiproxy."magazijn-a".upstream=${TOXIPROXY_MAGAZIJN_A_UPSTREAM:berichtenmagazijn-a:8090}
demo.toxiproxy."magazijn-b".listen=${TOXIPROXY_MAGAZIJN_B_LISTEN:0.0.0.0:18091}
demo.toxiproxy."magazijn-b".upstream=${TOXIPROXY_MAGAZIJN_B_UPSTREAM:berichtenmagazijn-b:8090}

# Hoe vaak de console controleert of de proxies er nog zijn. Toxiproxy houdt ze in het geheugen, dus
# een herstart van die pod laat de keten dood achter tot deze ronde ze terugzet. NIET onder de prefix
# `demo`: die is geclaimd door @ConfigMapping(prefix="demo"), dat elke `demo.*`-property op een
# mapping-member eist (SRCFG00050 bij boot).
toxiproxy.reconcile-interval=${TOXIPROXY_RECONCILE_INTERVAL:30s}

# Redis-verbinding voor de cache-verval-knop (fase 4). Rechtstreeks op Redis (niet via
# Toxiproxy — het is een beheeractie). Geen Dev Services: de demo verbindt met de compose-Redis.
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
# Lokaal draait Redis zonder wachtwoord, op een gedeelde omgeving mét. Zonder deze regel krijgt de
# knop daar 'NOAUTH Authentication required' op zijn eerste opdracht — een fout die pas bij een druk
# op de knop verschijnt, niet bij het starten. De lege default houdt het lokaal werkend: SmallRye
# leest een lege waarde als afwezig, dus er gaat dan geen AUTH overheen.
quarkus.redis.password=${REDIS_PASSWORD:}
quarkus.redis.devservices.enabled=false

# Idem voor de datasources: alleen de benoemde (magazijn-a-db/-b-db) zijn ingericht en wijzen naar
# de compose-Postgres. Zonder dit probeert Dev Services in de testfase een naamloze
# default-datasource te starten en waarschuwt het over de ontbrekende db-kind.
quarkus.datasource.devservices.enabled=false

# Uitvraag-aanmeld-webhook (fase 5 ontdubbeling). In de demo-compose zet UITVRAAG_URL de
# container-DNS; buiten containers de default.
quarkus.rest-client.uitvraag.url=${UITVRAAG_URL:http://localhost:8086}

# Het beheerpad van de magazijn-simulator. In de demo-compose zet MAGAZIJN_SIMULATOR_URL het
# container-adres; de default is voor draaien vanaf de host.
#
# Het aantal magazijnen staat hier bewust NIET: dat vraagt de console aan de simulator zelf. Twee
# getallen die uit elkaar kunnen lopen zijn er één te veel — de console zou dan magazijnen
# aansturen die er niet zijn, of er een paar overslaan.
quarkus.rest-client.magazijnsimulator.url=${MAGAZIJN_SIMULATOR_URL:http://localhost:8092}
# Ruimer dan de standaard dertig seconden. Vullen zet honderd magazijnen maal vier ondernemers maal
# twintig berichten klaar; gemeten duurt dat onder een seconde, maar op een belaste machine hoort een
# knop niet te breken terwijl de simulator gewoon doorschrijft. Dan lijkt hij kapot en levert een
# tweede druk "alles stond er al" — verwarrender dan even wachten.
quarkus.rest-client.magazijnsimulator.read-timeout=120000
# Het token waarmee het beheerpad van de simulator zich afschermt. Leeg lokaal: daar draait de
# simulator onder dev en staat zijn beheerpad open. Op een gedeelde omgeving is het token daar
# verplicht — de simulator start zonder niet eens — en dan moet de console dezelfde waarde
# meesturen, anders geeft elke knop een 401 terwijl de keten verder gezond is.
#
# NIET onder de prefix `demo`: die is geclaimd door @ConfigMapping(prefix="demo"), dat elke
# `demo.*`-property op een mapping-member eist (SRCFG00050 bij boot).
simulator.beheer-token=${MAGAZIJN_SIMULATOR_BEHEER_TOKEN:}
# Vrije poort naast magazijn (8090/8091), uitvraag (8086), de externe stubs (8081-8084, 8089),
# de stub-magazijnen van fase 6 (8092) en de Toxiproxy-admin van fase 3 (8474).
# Niets uit dit paneel mag uit een cache komen. Elke pagina en elk antwoord toont de huidige stand
# van de demo — welke magazijnen op storing staan, wat er in de bakken zit — en een hergebruikt
# antwoord laat precies dát zien wat er niet meer is. Dan lijkt een knop niets te doen terwijl hij
# zijn werk gedaan heeft, en gaat iemand middenin een demo zoeken naar iets dat niet stuk is. De
# andere services zetten dezelfde header; de console erft die niet, omdat hij bewust geen enkele
# afhankelijkheid op het stelsel heeft.
quarkus.http.header."Cache-Control".value=no-store

quarkus.http.port=8095
quarkus.http.host=0.0.0.0

# Wegwerp-console. Lokaal zet compose het dev-profiel voor het debug-logniveau hieronder; op de
# gedeelde omgeving draait hij onder het default prod-profiel, waar alleen dat logniveau wegvalt.
quarkus.log.level=INFO
%dev.quarkus.log.category."nl.rijksoverheid.moz".level=DEBUG

# Onder dev eist Quarkus dat de Host-header naar localhost wijst — bescherming tegen DNS-rebinding.
# Zodra de demo via een hostnaam of een ander adres binnenkomt (de proeftuin zet de Host van de
# bezoeker door) levert dat een lege 400 op die naar de verkeerde component wijst. Deze console
# bindt standaard op loopback; wie hem ruimer openzet doet dat met DEMO_BEDIENING_BIND. Op de
# gedeelde omgeving draait prod, waar deze eis niet geldt.
%dev.quarkus.http.host-validation.require-localhost=false

# Magazijn-aanlever-URL's. Buiten containers de dev-poorten; in de demo-compose
# overschrijven MAGAZIJN_A_URL/MAGAZIJN_B_URL naar container-DNS.
demo.magazijnen."00000000000000100000".url=${MAGAZIJN_A_URL:http://localhost:8090}
demo.magazijnen."00000001823288444000".url=${MAGAZIJN_B_URL:http://localhost:8091}

# Demo-identiteiten: één set voor zowel de keuzelijst van een berichtenbox als de berichten die
# de generator opvoert. `magazijnen` zijn de organisatie-OIN's waarvan de persona berichten
# ontvangt; die moeten sporen met de profielservice-stubs onder wiremock/demo-profiel/, anders
# weigert het magazijn de aanlevering met 403. Grootbedrijf B.V. heeft geen opt-in bij de twee
# echte magazijnen; zijn stub voor de stub-magazijnen staat in demo/generated/profiel/.
# `bron` zegt hoe een berichtenbox de inhoud presenteert. Geen default: een weggevallen regel
# hoort niet stil op `keten` uit te komen.
demo.personas.pietersen.label=J. Pietersen
demo.personas.pietersen.type=BSN
demo.personas.pietersen.waarde=999993653
demo.personas.pietersen.bron=keten
demo.personas.pietersen.magazijnen=00000000000000100000,00000001823288444000

demo.personas.bakkerij.label=Bakkerij De Vroege Vogel
demo.personas.bakkerij.type=BSN
demo.personas.bakkerij.waarde=999996666
demo.personas.bakkerij.bron=keten
demo.personas.bakkerij.magazijnen=00000000000000100000

# De vier ondernemers uit demo/genereer-magazijnen.py, van klein naar extreem: 3, 15, 45 en 100
# aangesloten organisaties. De sets zijn genest — elke grotere bevat de kleinere helemaal — zodat
# het verschil in wachttijd puur door het aantal komt en niet door een andere mengeling.
#
# `magazijnen` noemt alléén de organisaties waar de console zélf berichten voor aanlevert; dat zijn
# de twee echte magazijnen. De rest van de fan-out komt uit de profiel-stub en wordt gevuld via het
# beheerpad van de simulator.
demo.personas.vandijk.label=Garage Van Dijk B.V.
demo.personas.vandijk.type=KVK
demo.personas.vandijk.waarde=90000014
demo.personas.vandijk.bron=keten
demo.personas.vandijk.magazijnen=00000000000000100000,00000001823288444000

demo.personas.grootbedrijf.label=Grootbedrijf B.V.
demo.personas.grootbedrijf.type=KVK
demo.personas.grootbedrijf.waarde=90000001
demo.personas.grootbedrijf.bron=keten

# Bewust extreem: geen echte ondernemer heeft honderd aangesloten organisaties. Deze persona bestaat
# om het gedrag van de keten in de breedte zichtbaar te maken, niet om realisme te tonen.
demo.personas.concern.label=Landelijk Concern N.V.
demo.personas.concern.type=KVK
demo.personas.concern.waarde=90000003
demo.personas.concern.bron=keten

# Keten-personas: bestaan óók in _data/personas.json van de proeftuin, met dezelfde naam en
# hetzelfde nummer. Wie hier staat, kent de keten — dat is wat GET /api/demo/personas een
# berichtenbox vertelt. De kopie in src/test/resources/proeftuin-personas.json bewaakt dat de
# twee niet uiteenlopen.

demo.personas.proeftuin-een.label=Demo-onderneming 1
demo.personas.proeftuin-een.type=KVK
demo.personas.proeftuin-een.waarde=90000011
demo.personas.proeftuin-een.bron=keten
demo.personas.proeftuin-een.magazijnen=00000000000000100000

demo.personas.proeftuin-twee.label=Demo-onderneming 2
demo.personas.proeftuin-twee.type=KVK
demo.personas.proeftuin-twee.waarde=90000012
demo.personas.proeftuin-twee.bron=keten
demo.personas.proeftuin-twee.magazijnen=00000001823288444000

demo.personas.proeftuin-drie.label=Demo-onderneming 3
demo.personas.proeftuin-drie.type=KVK
demo.personas.proeftuin-drie.waarde=90000013
demo.personas.proeftuin-drie.bron=keten
demo.personas.proeftuin-drie.magazijnen=00000000000000100000,00000001823288444000

# Twee datasources voor het legen (directe TRUNCATE). Lazy: geen DB-verbinding bij boot,
# zodat de module ook zonder draaiende Postgres start.
quarkus.datasource.magazijn-a-db.db-kind=postgresql
quarkus.datasource.magazijn-a-db.jdbc.url=${MAGAZIJN_A_DB_URL:jdbc:postgresql://localhost:5432/berichtenmagazijn}
quarkus.datasource.magazijn-a-db.username=${MAGAZIJN_A_DB_USER:berichtenmagazijn}
quarkus.datasource.magazijn-a-db.password=${MAGAZIJN_A_DB_PASSWORD:berichtenmagazijn}
quarkus.datasource.magazijn-a-db.health-exclude=true

quarkus.datasource.magazijn-b-db.db-kind=postgresql
quarkus.datasource.magazijn-b-db.jdbc.url=${MAGAZIJN_B_DB_URL:jdbc:postgresql://localhost:5433/berichtenmagazijn}
quarkus.datasource.magazijn-b-db.username=${MAGAZIJN_B_DB_USER:berichtenmagazijn}
quarkus.datasource.magazijn-b-db.password=${MAGAZIJN_B_DB_PASSWORD:berichtenmagazijn}
quarkus.datasource.magazijn-b-db.health-exclude=true

# Op ZAD delen beide magazijnen één database en één user; alleen het schema scheidt ze, precies
# zoals de magazijnen zelf dat doen met DB_SCHEMA. currentSchema zet het search_path van de sessie,
# zodat de ongekwalificeerde TRUNCATE in het juiste schema landt. Lokaal zijn het twee databases,
# dus daar blijft public de juiste waarde.
quarkus.datasource.magazijn-a-db.jdbc.additional-jdbc-properties.currentSchema=${MAGAZIJN_A_DB_SCHEMA:public}
quarkus.datasource.magazijn-b-db.jdbc.additional-jdbc-properties.currentSchema=${MAGAZIJN_B_DB_SCHEMA:public}

# De tempo-stroom plant zijn tik-taak uitsluitend programmatisch (TempoKlok/SchedulerTempoKlok), en
# zonder gestarte scheduler gooien newJob()/unscheduleJob() een UnsupportedOperationException zodra
# de tempo-knoppen worden gebruikt. ProxyBootstrap.reconcile is weliswaar een @Scheduled-methode,
# waarmee de scheduler ook in de default 'normal'-modus zou starten, maar de tempo-knoppen mogen
# niet afhangen van het voortbestaan van een methode in een andere klasse.
quarkus.scheduler.start-mode=forced
