# --- Instellingen van de dienst zelf ---------------------------------------------------------
#
# Ook deze staan hier en niet in een application.properties: dat bestand wordt óók uit een jar
# gelezen, op ordinal 250, en zou dan de gelijknamige waarden van elke afnemer beconcurreren —
# welke wint hangt dan van de classpath-volgorde af. Op ordinal 100 verliezen ze gegarandeerd van
# wie deze module opneemt.
#
# Let op: verliezen doen ze alleen van een sleutel die de afnemer zélf noemt. Wie zwijgt, erft.
# Elke `quarkus.*`-regel die hier bijkomt verandert dus het gedrag van elke afnemer die die sleutel
# niet toevallig zet — de demo-console noemt de headers hieronder daarom expliciet in zijn eigen
# configuratie.
# Deze dienst draagt het endpoint; een afnemer zet hem uit in zijn eigen application.properties
# (ordinal 250) en houdt daarmee één adres over waar de lijst vandaan komt.
personadienst.endpoint=true

quarkus.application.name=fbs-demo-personas
quarkus.container-image.name=fbs-demo-personas

# Eigen poort naast de andere demo-onderdelen (console 8095, proeftuin 8096, demo-proxy 8097).
quarkus.http.port=8098

# Deze dienst staat op een gedeelde omgeving zonder authenticatiemuur — dat is de reden dat hij
# naast de demo-console bestaat. Wat hier binnenkomt mag dus niets kunnen veranderen; het enige
# endpoint is een GET.
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Cache-Control".value=no-store

# Bewust GEEN CORS. Elke afnemer haalt dit pad server-side op: de nginx van de proeftuin proxyt
# /api/demo/personas, en de demo-proxy doet lokaal hetzelfde. Een browser doet dus nooit een
# cross-origin-verzoek hierheen.
