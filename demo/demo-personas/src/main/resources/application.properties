quarkus.application.name=fbs-demo-personas
quarkus.container-image.name=fbs-demo-personas

# Eigen poort naast de andere demo-onderdelen (console 8095, proeftuin 8096, demo-proxy 8097).
quarkus.http.port=8098

# Deze dienst staat op een gedeelde omgeving zonder authenticatiemuur — dat is de reden dat hij
# naast de demo-console bestaat. Wat hier binnenkomt mag dus niets kunnen veranderen; het enige
# endpoint is een GET. Dezelfde beveiligingsheaders als de rest van de keten, plus de
# no-store-regel die de demo overal hanteert.
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Cache-Control".value=no-store

# De personalijst wordt door een berichtenbox op een ándere origin gelezen: op ZAD staat de
# proeftuin op een eigen hostnaam. De proxy van die proeftuin haalt hem server-side op, maar een
# pagina die het rechtstreeks vanuit de browser doet moet dat ook kunnen — anders is de enige
# foutmelding een CORS-melding in de console van de bezoeker.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${DEMO_CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=GET
