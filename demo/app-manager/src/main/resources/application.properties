quarkus.application.name=fbs-demo-app-manager
quarkus.container-image.name=fbs-demo-app-manager
# De container draait in Nederlandse tijd, zodat logtijden overeenkomen met de klok van wie meekijkt.
quarkus.jib.environment-variables.TZ=Europe/Amsterdam
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSSXXX} %-5p [%c] (%t) %s%e%n
quarkus.http.port=8093
quarkus.http.test-port=0

# De persona's komen uit de jar van demo-personas; het personas-endpoint hoort bij die dienst, niet hier.
personadienst.endpoint=false
quarkus.index-dependency.demo-personas.group-id=nl.rijksoverheid.moz
quarkus.index-dependency.demo-personas.artifact-id=demo-personas

# Het enige adres waar een registration_token heen gaat. Buiten dev en test zonder default: een
# verkeerd terugadres stuurt het token naar iemand anders.
app-manager.terug-url=${APP_MANAGER_TERUG_URL}
%dev.app-manager.terug-url=${APP_MANAGER_TERUG_URL:http://localhost:8099/}
%test.app-manager.terug-url=https://app.test/
app-manager.sleutel-pad=${APP_MANAGER_SLEUTEL_PAD:}

# De app draait op een andere origin. Toegang hangt aan het sessietoken in Authorization, niet aan
# een cookie die de browser vanzelf meestuurt; een open origin zonder credentials geeft een
# aanvaller dus niets wat hij niet al heeft. De keuzepagina gebruikt wel een cookie, maar die is
# SameSite=Lax en een fetch van een andere origin krijgt hem met `*` niet mee.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=WWW-Authenticate,Retry-After
quarkus.http.cors.access-control-max-age=PT10M

# Achter een ingress komt het client-adres (voor de quota van de opslag) van de proxy, nooit uit een
# header die de client zelf zet.
quarkus.http.proxy.proxy-address-forwarding=${APP_MANAGER_PROXY_FORWARDING:false}
quarkus.http.proxy.trusted-proxies=${APP_MANAGER_TRUSTED_PROXIES:127.0.0.1}

# Tokens staan in de URL van /register_app en in het fragment van de terug-URL: geen Referer.
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Cache-Control".value=no-store
# De Content-Security-Policy zet de resource zelf: form-action noemt de origin van de terug-URL, want
# een browser past form-action ook toe op de doorverwijzing na het formulier.
