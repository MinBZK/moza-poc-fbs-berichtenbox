# SNI-passthrough router op :443 — hostnet-variant van haproxy.cfg, gebruikt door
# docker-compose.podman-hostnet.yaml. Alle backends draaien in dezelfde netns.
#
# Twee verschillen met haproxy.cfg, allebei gevolg van die gedeelde netns:
#  - Vaste 127.0.0.1-adressen in plaats van runtime-DNS. De `resolvers`-sectie uit de basis lost
#    daar een probleem op dat hier niet bestaat (een backend-IP dat na `up --force-recreate`
#    verandert); een loopback-poort verhuist niet.
#  - Geen `check` op de backends. Zonder resolver valt er niets te herontdekken, er is één server
#    per backend dus geen failover-keuze, en op loopback geeft een dode backend meteen
#    `ECONNREFUSED`. Wat overblijft is ruis: elke check is een TCP-connect die de Go-TLS-listeners
#    als mislukte handshake loggen, in exact de debug-logs waarvoor deze harness bestaat.
#
# Binden op 127.0.0.1 en niet op `*`: in een gedeelde netns is `*` élke interface van de
# aanroeper. De backend-poorten hieronder spiegelen docker-compose.podman-hostnet.yaml; wijzig ze
# samen.
global
    log stdout format raw local0 info

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend https_sni
    bind 127.0.0.1:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend dir       if { req_ssl_sni -i directory.fsc-test.local }
    use_backend mgz       if { req_ssl_sni -i magazijn-a.fsc-test.local }
    use_backend inway_mgz if { req_ssl_sni -i inway.magazijn-a.fsc-test.local }

backend dir
    server s1 127.0.0.1:18443          # = manager-directory LISTEN_ADDRESS_EXTERNAL
backend mgz
    server s1 127.0.0.1:28443          # = manager-magazijn-a LISTEN_ADDRESS_EXTERNAL
backend inway_mgz
    server s1 127.0.0.1:8443           # = inway-magazijn-a LISTEN_ADDRESS
