# Federatie-overlay voor de peer `magazijn-a`, bovenop zijn eigen drie compose-bestanden:
#
#   docker compose -f magazijn-a/deploy/local/docker-compose.yaml \
#                  -f magazijn-a/deploy/local/docker-compose.podman.yaml \
#                  -f magazijn-a/deploy/local/docker-compose.podman-hostnet.yaml \
#                  -f federatie/compose/magazijn-a.yaml up -d
#
# Deze peer is GAST: postgres, router, directory en directory-ui komen uit de logius-stack
# (zie federatie/compose/logius.yaml). `profiles` houdt ze hier uit `up` zonder ze te hoeven
# verwijderen; elke `depends_on` die er nog naar wees, wordt vervangen.
#
# Op de drie migrate-jobs is `!override {}` gelijkwaardig aan `!reset` — beide laten de sleutel
# leeg. Op manager-magazijn-a niet: daar draagt de override inhoud, en `!reset` zou die weggooien
# ongeacht wat eronder staat. De manager start dan gelijk met zijn eigen migratie en sterft op
# `relation "peers.peers" does not exist`. Eén tag voor alle vier, zodat een kopieerfout tussen
# die gevallen niet kan ontstaan.
#
# Peer-adresruimte: 127.20.2.0/24, met de vaste component-octetten uit README.md. Voor het waarom
# van `extra_hosts` op élke service en van de standaardpoorten, zie logius.yaml.
x-hosts-federatie: &hosts-federatie
  - "directory.fsc-test.local:127.20.0.1"
  - "logius.fsc-test.local:127.20.0.1"
  - "inway.logius.fsc-test.local:127.20.0.1"
  - "magazijn-a.fsc-test.local:127.20.0.1"
  - "inway.magazijn-a.fsc-test.local:127.20.0.1"
  - "manager.logius.fsc-test.local:127.20.1.1"
  - "controller.logius.fsc-test.local:127.20.1.2"
  - "txlog.logius.fsc-test.local:127.20.1.3"
  - "outway.logius.fsc-test.local:127.20.1.5"
  - "manager.magazijn-a.fsc-test.local:127.20.2.1"
  - "controller.magazijn-a.fsc-test.local:127.20.2.2"
  - "txlog.magazijn-a.fsc-test.local:127.20.2.3"
  - "postgres:127.20.0.2"
  - "stub-upstream:127.20.2.6"

services:
  # --- Federatie-infra: komt uit de logius-stack ---------------------------------------------
  postgres:
    profiles: ["gastheer-only"]
  router:
    profiles: ["gastheer-only"]
  manager-directory:
    profiles: ["gastheer-only"]
  directory-ui:
    profiles: ["gastheer-only"]

  # --- Migrate-jobs: postgres draait in de gastheer-stack, niet in deze -----------------------
  migrate-magazijn-a:
    extra_hosts: *hosts-federatie
    depends_on: !override {}

  migrate-controller-magazijn-a:
    extra_hosts: *hosts-federatie
    depends_on: !override {}

  migrate-txlog-magazijn-a:
    extra_hosts: *hosts-federatie
    depends_on: !override {}
    environment:
      LISTEN_ADDRESS: 127.20.2.3:9443
      MONITORING_ADDRESS: 127.20.2.3:8081

  # --- magazijn-a als peer: 127.20.2.x -------------------------------------------------------
  manager-magazijn-a:
    extra_hosts: *hosts-federatie
    # manager-directory staat in deze stack in een inactief profiel; de directory van de
    # gastheer-stack draait al voordat deze stack omhoog komt — federatie.sh wacht daarop.
    depends_on: !override
      migrate-magazijn-a:
        condition: service_completed_successfully
    environment:
      LISTEN_ADDRESS_EXTERNAL: 127.20.2.1:8443
      LISTEN_ADDRESS_INTERNAL: 127.20.2.1:9443
      LISTEN_ADDRESS_INTERNAL_UNAUTHENTICATED: 127.20.2.1:9444
      MONITORING_ADDRESS: 127.20.2.1:8080
      CONTROLLER_REGISTRATION_API_ADDRESS: https://controller.magazijn-a.fsc-test.local:9443
      TX_LOG_API_ADDRESS: https://txlog.magazijn-a.fsc-test.local:9443

  controller-magazijn-a:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS_UI: 127.20.2.2:8080
      LISTEN_ADDRESS_REGISTRATION_API: 127.20.2.2:9443
      LISTEN_ADDRESS_ADMINISTRATION_API: 127.20.2.2:9444
      MONITORING_ADDRESS: 127.20.2.2:8081
      MANAGER_ADDRESS_INTERNAL: https://manager.magazijn-a.fsc-test.local:9443

  txlog-magazijn-a:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS: 127.20.2.3:9443
      MONITORING_ADDRESS: 127.20.2.3:8081

  inway-magazijn-a:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS: 127.20.2.4:8443
      MONITORING_ADDRESS: 127.20.2.4:8081
      CONTROLLER_REGISTRATION_API_ADDRESS: https://controller.magazijn-a.fsc-test.local:9443
      MANAGER_INTERNAL_UNAUTHENTICATED_ADDRESS: https://manager.magazijn-a.fsc-test.local:9444
      TX_LOG_API_ADDRESS: https://txlog.magazijn-a.fsc-test.local:9443

  stub-upstream:
    extra_hosts: *hosts-federatie
    command: ["-listen=127.20.2.6:8080", "-text=hello from magazijn-a stub-upstream"]

  toolbox:
    extra_hosts: *hosts-federatie
