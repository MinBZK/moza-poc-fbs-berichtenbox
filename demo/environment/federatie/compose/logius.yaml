# Federatie-overlay voor de peer `logius`, bovenop zijn eigen drie compose-bestanden:
#
#   docker compose -f logius/deploy/local/docker-compose.yaml \
#                  -f logius/deploy/local/docker-compose.podman.yaml \
#                  -f logius/deploy/local/docker-compose.podman-hostnet.yaml \
#                  -f federatie/compose/logius.yaml up -d
#
# Twee compose-projecten die béide `network_mode: host` draaien delen al één netns. De
# federatie hoeft de bestanden dus niet samen te voegen — ze moet alleen zorgen dat de peers
# elkaars poorten niet claimen en dezelfde directory én group-CA gebruiken.
#
# logius draagt in deze opstelling twee rollen. Als GASTHEER levert hij de federatie-infra die
# alle peers delen: postgres, de SNI-router en de directory. Als PEER krijgt hij, net als elke
# andere, een eigen blok van 100 poorten — hier 61000. Die scheiding staat in README.md.
#
# Waarom élke service die TLS naar een peer-naam opzet `extra_hosts` krijgt, en niet alleen de
# managers: de directory haalt bij het tekenen van een servicePublication-contract de JWKS op bij
# de publicerende peer
# (`https://<peer>/.well-known/jwks.json`). Kan hij die naam niet resolven, dan blijft dat
# contract op CONTRACT_STATE_PROPOSED staan, is de dienst niet vindbaar, en wordt er niet
# automatisch opnieuw geprobeerd. Eén lijst voor iedereen sluit die klasse fouten uit.
x-hosts-federatie: &hosts-federatie
  - "directory.fsc-test.local:127.0.0.1"
  - "logius.fsc-test.local:127.0.0.1"
  - "manager.logius.fsc-test.local:127.0.0.1"
  - "controller.logius.fsc-test.local:127.0.0.1"
  - "txlog.logius.fsc-test.local:127.0.0.1"
  - "outway.logius.fsc-test.local:127.0.0.1"
  - "inway.logius.fsc-test.local:127.0.0.1"
  - "magazijn-a.fsc-test.local:127.0.0.1"
  - "manager.magazijn-a.fsc-test.local:127.0.0.1"
  - "controller.magazijn-a.fsc-test.local:127.0.0.1"
  - "txlog.magazijn-a.fsc-test.local:127.0.0.1"
  - "inway.magazijn-a.fsc-test.local:127.0.0.1"
  - "postgres:127.0.0.1"
  - "stub-upstream:127.0.0.1"

services:
  # --- Federatie-infra (gastheer-rol): vaste poorten, buiten de peer-blokken ------------------
  # De paden hieronder zijn relatief aan de PROJECT-directory — de map van het eerste
  # `-f`-bestand, dus `logius/deploy/local/` — niet aan dit overlay-bestand. Vandaar drie
  # niveaus omhoog naar `demo/environment/`. Hetzelfde geldt voor `PKI_DIR` in de basis.
  postgres:
    volumes:
      - ../../../federatie/postgres-init.federatie.sql:/docker-entrypoint-initdb.d/init.sql:ro

  router:
    volumes:
      - ../../../federatie/haproxy.federatie.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  manager-directory:
    extra_hosts: *hosts-federatie

  directory-ui:
    extra_hosts: *hosts-federatie

  # --- logius als peer: blok 61000 -----------------------------------------------------------
  manager-logius:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS_EXTERNAL: 127.0.0.1:61000                 # +00
      LISTEN_ADDRESS_INTERNAL: 127.0.0.1:61001                 # +01
      LISTEN_ADDRESS_INTERNAL_UNAUTHENTICATED: 127.0.0.1:61002  # +02
      MONITORING_ADDRESS: 127.0.0.1:61003                       # +03
      CONTROLLER_REGISTRATION_API_ADDRESS: https://controller.logius.fsc-test.local:61011
      TX_LOG_API_ADDRESS: https://txlog.logius.fsc-test.local:61020

  controller-logius:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS_UI: 127.0.0.1:61010                        # +10
      LISTEN_ADDRESS_REGISTRATION_API: 127.0.0.1:61011          # +11
      LISTEN_ADDRESS_ADMINISTRATION_API: 127.0.0.1:61012        # +12
      MONITORING_ADDRESS: 127.0.0.1:61013                       # +13
      MANAGER_ADDRESS_INTERNAL: https://manager.logius.fsc-test.local:61001

  migrate-controller-logius:
    extra_hosts: *hosts-federatie

  migrate-logius:
    extra_hosts: *hosts-federatie

  # De migrate-job erft LISTEN/MONITORING uit het txlog-anchor van de basis; die moeten mee
  # verhuizen, ook al opent een `migrate up` die listeners naar verwachting nooit.
  migrate-txlog-logius:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS: 127.0.0.1:61020                           # +20
      MONITORING_ADDRESS: 127.0.0.1:61021                       # +21

  txlog-logius:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS: 127.0.0.1:61020                           # +20
      MONITORING_ADDRESS: 127.0.0.1:61021                       # +21

  inway-logius:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS: 127.0.0.1:61030                           # +30
      MONITORING_ADDRESS: 127.0.0.1:61031                       # +31
      CONTROLLER_REGISTRATION_API_ADDRESS: https://controller.logius.fsc-test.local:61011
      MANAGER_INTERNAL_UNAUTHENTICATED_ADDRESS: https://manager.logius.fsc-test.local:61002
      TX_LOG_API_ADDRESS: https://txlog.logius.fsc-test.local:61020

  outway-logius:
    extra_hosts: *hosts-federatie
    environment:
      LISTEN_ADDRESS: 127.0.0.1:61040                           # +40
      MONITORING_ADDRESS: 127.0.0.1:61041                       # +41
      MANAGER_INTERNAL_ADDRESS: https://manager.logius.fsc-test.local:61001
      CONTROLLER_REGISTRATION_API_ADDRESS: https://controller.logius.fsc-test.local:61011
      TX_LOG_API_ADDRESS: https://txlog.logius.fsc-test.local:61020

  stub-upstream:
    extra_hosts: *hosts-federatie
    command: ["-listen=127.0.0.1:61050", "-text=hello from logius stub-upstream"]   # +50

  toolbox:
    extra_hosts: *hosts-federatie
