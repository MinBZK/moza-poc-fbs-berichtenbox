# SNI-passthrough router voor de federatie-opstelling: alle peers achter één :443, met één
# gedeelde directory. Variant op de per-peer `haproxy.podman-hostnet.cfg`; zelfde afwegingen
# (vaste backends, geen `check`, bind op loopback) staan daar toegelicht.
#
# De backends spiegelen de component-adressen uit README.md; wijzig ze samen. Een peer toevoegen =
# twee `use_backend`-regels en twee `backend`-blokken: `<net>.1:8443` voor de externe manager en
# `<net>.4:8443` voor de inway. De poorten zijn voor élke peer gelijk — het adres onderscheidt ze.
global
    log stdout format raw local0 info

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend https_sni
    bind 127.20.0.1:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    use_backend dir        if { req_ssl_sni -i directory.fsc-test.local }
    use_backend logius     if { req_ssl_sni -i logius.fsc-test.local }
    use_backend logius_in  if { req_ssl_sni -i inway.logius.fsc-test.local }
    use_backend mgza       if { req_ssl_sni -i magazijn-a.fsc-test.local }
    use_backend mgza_in    if { req_ssl_sni -i inway.magazijn-a.fsc-test.local }

# Federatie-infra: 127.20.0.x, buiten de peer-/24's.
backend dir
    server s1 127.20.0.3:8443

# logius — 127.20.1.0/24
backend logius
    server s1 127.20.1.1:8443          # .1 manager extern
backend logius_in
    server s1 127.20.1.4:8443          # .4 inway

# magazijn-a — 127.20.2.0/24
backend mgza
    server s1 127.20.2.1:8443          # .1 manager extern
backend mgza_in
    server s1 127.20.2.4:8443          # .4 inway
