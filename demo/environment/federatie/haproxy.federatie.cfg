# SNI-passthrough router voor de federatie-opstelling: alle peers achter één :443, met één
# gedeelde directory. Variant op de per-peer `haproxy.podman-hostnet.cfg`; zelfde afwegingen
# (vaste 127.0.0.1-backends, geen `check`, bind op loopback) staan daar toegelicht.
#
# De backend-poorten spiegelen de peer-blokken uit README.md; wijzig ze samen. Een peer
# toevoegen = twee `use_backend`-regels en twee `backend`-blokken, met <blok>+00 voor de
# manager en <blok>+30 voor de inway.
global
    log stdout format raw local0 info

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend https_sni
    bind 127.0.0.1:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    use_backend dir        if { req_ssl_sni -i directory.fsc-test.local }
    use_backend logius     if { req_ssl_sni -i logius.fsc-test.local }
    use_backend logius_in  if { req_ssl_sni -i inway.logius.fsc-test.local }
    use_backend mgza       if { req_ssl_sni -i magazijn-a.fsc-test.local }
    use_backend mgza_in    if { req_ssl_sni -i inway.magazijn-a.fsc-test.local }

# Federatie-infra: vaste poort, buiten de peer-blokken.
backend dir
    server s1 127.0.0.1:18443

# logius — blok 61000
backend logius
    server s1 127.0.0.1:61000          # +00 manager extern
backend logius_in
    server s1 127.0.0.1:61030          # +30 inway

# magazijn-a — blok 61100
backend mgza
    server s1 127.0.0.1:61100          # +00 manager extern
backend mgza_in
    server s1 127.0.0.1:61130          # +30 inway
