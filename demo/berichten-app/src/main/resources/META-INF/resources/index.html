<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berichten-app</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<main>
  <h1>Berichten-app</h1>
  <p>
    Deze app haalt berichten rechtstreeks bij de magazijnen op. Daarvoor activeert u hem eerst: u kiest
    bij de App Manager een ondernemer, en de app krijgt een bewijs op een sleutel die deze browser
    niet kan prijsgeven.
  </p>
  <p id="status" role="status" aria-live="polite">Laden…</p>
  <p id="fout" class="fout" role="alert"></p>
  <div class="knoppen">
    <button id="activeren" type="button" disabled>Activeren</button>
    <button id="vernieuwen" type="button" disabled>Bewijs vernieuwen</button>
    <button id="wissen" type="button" disabled>Activering wissen</button>
    <button id="ophalen" type="button" disabled>Berichten ophalen</button>
  </div>
  <section aria-labelledby="kop-berichten">
    <h2 id="kop-berichten">Berichten</h2>
    <p id="overzicht" role="status" aria-live="polite"></p>
    <ul id="berichten"></ul>
    <div id="niet-bereikt" hidden>
      <h3>Niet bereikt</h3>
      <ul id="mislukt"></ul>
    </div>
  </section>
</main>
</body>
</html>
