quarkus.application.name=fbs-demo-berichten-app
quarkus.container-image.name=fbs-demo-berichten-app
# De container draait in Nederlandse tijd, zodat logtijden overeenkomen met de klok van wie meekijkt.
quarkus.jib.environment-variables.TZ=Europe/Amsterdam
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSSXXX} %-5p [%c] (%t) %s%e%n
# Het terugadres dat de App Manager in ontwikkelmodus kent.
quarkus.http.port=8099
quarkus.http.test-port=0

# Buiten dev en test zonder default: de app stuurt het session_token naar dit adres.
berichten-app.app-manager-url=${BERICHTEN_APP_APP_MANAGER_URL}
%dev.berichten-app.app-manager-url=${BERICHTEN_APP_APP_MANAGER_URL:http://localhost:8093/}
%test.berichten-app.app-manager-url=https://app-manager.test/
berichten-app.app-manager-oin=${BERICHTEN_APP_APP_MANAGER_OIN:00000000000000001100}

# De sleutel woont op deze origin, en script dat hier binnenkomt kan ermee tekenen. Daarom alleen
# script en stijl van deze origin, geen inline script, Trusted Types zonder policies (geen enkele
# HTML-sink), en verbindingen alleen naar de eigen origin en de App Manager. Als header en niet in
# een <meta>: daar werkt frame-ancestors niet. De header geldt ook voor /q/dev-ui, dat daardoor in
# ontwikkelmodus niet laadt; de app zelf gaat voor.
# TODO(#1216): het stelselregister en de magazijnen in connect-src, zodra de app daar ophaalt.
quarkus.http.header."Content-Security-Policy".value=default-src 'none'; script-src 'self'; style-src 'self'; \
  connect-src 'self' ${berichten-app.app-manager-url}; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; \
  form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'
# Het registration_token komt terug in het fragment van deze pagina: geen Referer.
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
# Een pagina die deze app opent, houdt geen referentie om het tabblad tijdens het activeren om te leiden.
quarkus.http.header."Cross-Origin-Opener-Policy".value=same-origin
# Script dat via een gestripte http-verbinding binnenkomt, kan met de sleutel tekenen. Over http
# negeert een browser deze header, dus localhost heeft er geen last van.
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000
