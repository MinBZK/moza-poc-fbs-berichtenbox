quarkus.application.name=magazijn-simulator
quarkus.application.version=0.1.0

# Container-image (jib): stabiele image-naam zodat de deploy-keten een vaste coördinaat heeft.
# Registry, group, tag, build/push en credentials komen uit de CI-flags (-Dquarkus.container-image.*).
quarkus.container-image.name=fbs-magazijn-simulator

# Dezelfde poort als de WireMock-stubs die de simulator vervangt, zodat de demo-omgeving alleen
# van doel verandert en niet ook van adres.
quarkus.http.port=8092

# BEWUST GEEN `quarkus.rest.path`. Het echte magazijn zet die op `/api/v1`; hier komt dat prefix
# uit de `baseUri` die MagazijnPadFilter per request opbouwt (`/magazijn/<OIN>/api/v1/`). Zou
# `quarkus.rest.path` gezet zijn, dan bepaalt Quarkus vóór élk JAX-RS-filter of het pad bij de
# applicatie hoort — en een request op `/magazijn/<OIN>/api/v1/berichten` valt daarbuiten, dus het
# @PreMatching-filter zou nooit aan bod komen en het pad zou een kale 404 opleveren.
#
# Netto zien clients hetzelfde als bij een echt magazijn: het pad eindigt op `/api/v1/berichten` en
# de HAL-links dragen dat prefix, omdat de herschreven baseUri het meedraagt.

# Laat afwezige velden weg in plaats van ze als `null` te serialiseren: HAL-velden als
# `_links.next` horen op de laatste pagina afwezig te zijn, anders klopt de response niet meer met
# het schema van de gedeelde spec.
quarkus.jackson.serialization-inclusion=non-null

# Security headers op ÁLLE HTTP-responses, ook op /q/health en de dev-UI.
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Content-Security-Policy".value=frame-ancestors 'none'
quarkus.http.header."Referrer-Policy".value=no-referrer
# De simulator serveert straks berichtinhoud van demo-persona's; caching door browsers, proxies of
# CDN's is net zo ongewenst als bij het echte magazijn.
quarkus.http.header."Cache-Control".value=no-store

# Backend-only API; geen browser-clients. Expliciet uit zodat een toekomstige misconfig niet
# stilletjes cross-origin requests toelaat.
quarkus.http.cors.enabled=false

# Persistentie. Eén PostgreSQL onder alle gesimuleerde magazijnen; `magazijn_db_id` op de
# bericht-tabel is de discriminator. Dev gebruikt de database uit compose; tests gebruiken Quarkus
# Dev Services, dat per run een verse Testcontainers-Postgres start.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18
# De env-var hoort op de %dev-regel zelf: staat dezelfde sleutel ook zonder profiel-prefix, dan
# schaduwt %dev die en wordt een ${ENV} daar nooit geevalueerd.
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5435/magazijnsimulator}
%dev.quarkus.datasource.username=${DB_USERNAME:magazijnsimulator}
%dev.quarkus.datasource.password=${DB_PASSWORD:magazijnsimulator}
# Geen default in %prod: de deploy MOET een database aanwijzen, anders hoort de simulator te falen
# bij het starten in plaats van stilletjes localhost te proberen.
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Een eigen schema binnen de gedeelde database, net als elk magazijn er een heeft. ZAD levert één
# database en één user per deployment, en de simulator draagt tabelnamen die ook bij de magazijnen
# bestaan (`bericht`, `bericht_status`, `bijlage`). Zonder deze scheiding migreert Flyway in het
# schema dat toevallig eerst komt, botsen twee migratiegeschiedenissen, en mengt demodata met de
# berichten van de echte magazijnen. Geen default: liever niet starten dan stilzwijgend `public`
# delen. Flyway maakt het schema zelf aan zolang de databasegebruiker CREATE mag; mag hij dat niet,
# dan het schema vooraf laten aanmaken en `quarkus.flyway.create-schemas=false` zetten.
%prod.quarkus.flyway.schemas=${DB_SCHEMA}
%prod.quarkus.hibernate-orm.database.default-schema=${DB_SCHEMA}
# `default-schema` kwalificeert alleen entity- en HQL-queries. De bulkvulling en het bijwerken van de
# status gaan via native SQL, en die volgt de search_path van de connectie; staat die op `public`,
# dan bestaat de tabel daar niet. `currentSchema` (PG JDBC) zet de search_path van de sessie.
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=${DB_SCHEMA}

# De connectiepool is ruimer dan de Quarkus-default van twintig. Dat is geen fijnslijperij: dit is
# één service die er honderd voorstelt, en dus komt elke per-service-default hier op een honderdste
# van zijn bedoelde last uit. Bij een ondernemer met honderd aangesloten organisaties vraagt de
# uitvraag ze allemaal tegelijk, en met twintig connecties lopen de wachtenden in hun
# acquisitie-timeout — wat de Berichtenbox als TIMEOUT registreert, alsof die magazijnen onbereikbaar
# waren. Gemeten: met de default viel bij fan-out 100 vrijwel alles om, ook magazijnen die op
# normaal stonden; met zestig hield één ophaalronde op de drie het nog niet.
#
# Honderdtwintig is de grootste fan-out die de demo kent, met dezelfde marge als de bulkhead van
# de uitvraag. Elke aanvraag houdt zijn connectie kort vast: de gesimuleerde vertraging gaat in
# een filter vóór de resource, dus een traag magazijn bezet er geen.
#
# De database moet meegroeien: PostgreSQL laat standaard honderd verbindingen toe, en die grens
# raken is dezelfde storing met een andere melding. Zie `postgres-simulator` in compose.yaml.
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:120}
# Tests draaien nooit een volle fan-out en krijgen hun database van Dev Services, die honderd
# verbindingen toelaat. Honderdtwintig zou daar een grens beloven die de container niet heeft.
%test.quarkus.datasource.jdbc.max-size=20

# Flyway beheert de DDL; Hibernate valideert alleen dat de mapping klopt met het schema en
# genereert nooit zelf DDL. Een simulator die stilzwijgend een kolom bijmaakt, verbergt precies het
# soort verschil dat we juist willen zien.
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

# De set magazijnen die deze instantie voorstelt. In de demo komt dit bestand uit
# demo/genereer-magazijnen.py en wordt het via SMALLRYE_CONFIG_LOCATIONS meegegeven; hetzelfde
# artefact vult het register van de uitvraag, zodat beide kanten niet uit elkaar kunnen lopen.
# De twee hieronder zijn er alleen om lokaal en in de tests te kunnen starten.
# `index` is het volgnummer in de gegenereerde set en bepaalt via de vastgelegde verdeling hoe een
# magazijn zich gedraagt; `gedrag` overschrijft dat als je één magazijn bewust anders wilt zetten.
# De twee hieronder krijgen bewust geen index: de meeste tests willen een magazijn dat het gewoon
# doet, en gedrag zetten ze zelf.
%dev.magazijnsimulator.magazijnen."00000009000000000001".naam=Demo-magazijn 1
%dev.magazijnsimulator.magazijnen."00000009000000000002".naam=Demo-magazijn 2
%test.magazijnsimulator.magazijnen."00000009000000000001".naam=Demo-magazijn 1
%test.magazijnsimulator.magazijnen."00000009000000000002".naam=Demo-magazijn 2
# Een derde magazijn voor de gedragstests, zodat die de andere twee met rust laten.
%test.magazijnsimulator.magazijnen."00000009000000000003".naam=Demo-magazijn 3

# Beveiliging van het beheerpad. Buiten dev en test blokkeert BeheerToken de boot als dit
# leeg is: een simulator die per ongeluk publiek komt te staan, laat anders zijn hele
# berichtenbestand legen door de eerste voorbijganger. Dat is precies wat er met de WireMock-stubs op
# de gedeelde omgeving gebeurde, waar de admin-API zonder authenticatie open stond.
magazijnsimulator.beheer.token=${BEHEER_TOKEN:}
