    name: MijnOverheid Zakelijk
    email: moza@minbzk.nl
    url: https://github.com/MinBZK/moza-poc-fbs-berichtenbox
  license:
    name: EUPL-1.2
    url: https://eupl.eu/1.2/nl/
  x-api-id: nl.rijksoverheid.moz.fbs.stelselregister
  x-summary: Het ondertekende stelseldocument met de deelnemende magazijnen

# ADR nlgov:servers-use-https — bewust afgeweken (pas-toe-of-leg-uit): de API wordt
# achter een TLS-terminerende gateway geserveerd, waardoor de externe https-host per
# omgeving verschilt. De relatieve base-path is omgeving-onafhankelijk.
servers:
  - url: /api/v1
    description: Base-path; de host verschilt per omgeving

tags:
  - name: Stelseldocument
    description: Het ondertekende document met de deelnemende organisaties en hun magazijn

paths:
  /stelseldocument:
    get:
      tags: [Stelseldocument]
      operationId: getStelseldocument
      summary: Haal het geldende stelseldocument op
      description: |
        Levert het geldende stelseldocument als JWS in compacte serialisatie. Het antwoord is
        publiek en mag kort gecachet worden. Zie de API-beschrijving voor de stappen waarmee je de
        handtekening controleert.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: De `ETag` van het exemplaar dat je al hebt; bij een ongewijzigd document volgt `304`.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Het geldende stelseldocument
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/jose:
              schema:
                type: string
                description: JWS compact (`header.payload.signature`), elk deel base64url zonder opvulling
                pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        '304':
          description: Het document is niet gewijzigd sinds de meegegeven `ETag`
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  headers:
    API-Version:
      description: De volledige versie van deze API (semver)
      schema:
        type: string
        example: 0.1.0
    ETag:
      description: Zwakke validator van dit exemplaar; verandert bij elke uitgifte
      schema:
        type: string
        example: W/"q1w2e3"
    Cache-Control:
      description: Het document is publiek en mag kort bewaard worden
      schema:
        type: string
        example: public, max-age=300
    Retry-After:
      description: Aantal seconden waarna opnieuw proberen zin heeft
      schema:
        type: integer

  schemas:
    # StelseldocumentHeader en StelseldocumentPayload hangen aan geen enkel pad: OpenAPI 3.0 kan
    # geen schema aan een `application/jose`-body koppelen. Spectral meldt ze daarom als ongebruikt.
    # Ze zijn wel contract: de contracttest decodeert de JWS en legt beide delen ertegen.
    StelseldocumentHeader:
      type: object
      description: De JWS-header van het stelseldocument. Bevat precies deze vier velden.
      required: [alg, typ, kid, x5c]
      additionalProperties: false
      properties:
        alg:
          type: string
          enum: [ES256]
        typ:
          type: string
          enum: [stelseldocument+jwt]
        kid:
          type: string
          description: RFC 7638-thumbprint van de ondertekensleutel
          pattern: '^[A-Za-z0-9_-]{43}$'
        x5c:
          type: array
          description: |
            De certificaatketen van het ondertekencertificaat, zonder de root. Het eerste element
            is het ondertekencertificaat. Elk element is een DER-certificaat in standaard base64.
          minItems: 1
          items:
            type: string

    StelseldocumentPayload:
      type: object
      description: De inhoud van het stelseldocument.
      required: [iss, iat, exp, version, environment, organizations, app_managers, document_types]
      additionalProperties: false
      properties:
        iss:
          type: string
          description: OIN van de stelselbeheerder die het document ondertekende
          pattern: '^[0-9]{20}$'
        iat:
          type: integer
          format: int64
          description: Moment van uitgifte, in seconden sinds 1970-01-01T00:00:00Z
        exp:
          type: integer
          format: int64
          description: Moment waarna het document niet meer geldt, in seconden sinds 1970-01-01T00:00:00Z
        version:
          type: string
          description: |
            Kenmerk van de inhoud (`organizations`, `app_managers`, `document_types`). Gelijke
            inhoud geeft een gelijke waarde; `iat` ordent twee exemplaren.
          pattern: '^[A-Za-z0-9_-]{43}$'
        environment:
          type: string
          description: |
            De omgeving waarvoor dit document is uitgegeven. Een demo- of previewdocument bevat
            fictieve organisatienummers; gebruik het niet buiten die omgeving.
          minLength: 1
        organizations:
          type: array
          description: De deelnemende organisaties, gesorteerd op OIN
          items:
            $ref: '#/components/schemas/Organisatie'
        app_managers:
          type: array
          description: De toegelaten app-beheerders. Nog leeg.
          items:
            type: object
        document_types:
          type: array
          description: De soorten documenten die in dit stelsel worden uitgewisseld
          items:
            $ref: '#/components/schemas/Documentsoort'

    Organisatie:
      type: object
      required: [oin, name, magazijn_url]
      additionalProperties: false
      properties:
        oin:
          type: string
          description: Organisatie-identificatienummer
          pattern: '^[0-9]{20}$'
        name:
          type: string
          description: Weergavenaam van de organisatie
          minLength: 1
        magazijn_url:
          type: string
          format: uri
          description: Het publieke adres van het berichtenmagazijn van deze organisatie

    Documentsoort:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. `type`, `title` en `status` zijn de stabiele velden waar clients
        op kunnen koppelen; `detail` en `instance` zijn diagnostisch.
      required: [type, title, status]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  responses:
    NotAcceptable:
      description: De `Accept`-header sluit `application/jose` uit
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Onverwachte fout; `instance` draagt de correlatie-id
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Er is op dit moment geen geldig stelseldocument beschikbaar
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
