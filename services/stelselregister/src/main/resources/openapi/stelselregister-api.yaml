openapi: 3.0.3
info:
  title: FBS Stelselregister API
  version: 0.1.0
  description: |
    Publiceert welke organisaties aan het Federatief Berichtenstelsel (FBS) deelnemen en waar hun
    berichtenmagazijn staat, als **stelseldocument**: één document, ondertekend door de
    stelselbeheerder. Een app die berichten rechtstreeks bij de magazijnen ophaalt, leest hier
    welke magazijnen er zijn en controleert aan de handtekening dat de lijst van de
    stelselbeheerder komt en onderweg niet is gewijzigd.

    De vorm volgt de conceptstandaard BK Connect (draft-00). Wat die standaard aan een
    toepassingsprofiel overlaat — pad, vorm van de handtekening, sleuteldistributie en
    geldigheidsduur — staat in `docs/stelseldocument-toepassingsprofiel.md` in de repository.

    ## Wat het document wel en niet zegt

    Het document is een **ondertekende adreslijst**. Het zegt welke organisaties meedoen en op
    welk adres hun magazijn staat. Het bevat nog geen sleutels van die organisaties: ontleen er
    dus geen vertrouwen in een magazijn aan. De verbinding met een magazijn is zo betrouwbaar als
    de TLS eronder.

    ## Vorm

    Het antwoord op `GET /stelseldocument` is een JWS in compacte serialisatie
    (`application/jose`): drie base64url-delen, gescheiden door een punt. Het middelste deel is de
    JSON-payload (schema `StelseldocumentPayload`), het eerste de header (schema
    `StelseldocumentHeader`). De veldnamen in de payload zijn Engels en snake_case, omdat ze uit
    de standaard komen.

    ## Het document verifiëren

    Voer deze vijf stappen uit in deze volgorde, en weiger het document zodra er één faalt:

    1. `alg` is exact `ES256` en `typ` exact `stelseldocument+jwt`. Accepteer geen andere waarde,
       en negeer nooit een `jku`, `jwk` of `x5u` in de header.
    2. Valideer de certificaatketen in `x5c` tot de root die je vooraf hebt vastgelegd, inclusief
       de geldigheidsperiode van elk certificaat. De root staat niet in `x5c` en komt niet van
       deze dienst: je legt hem vast bij het bouwen van je app.
    3. Controleer de handtekening met de publieke sleutel uit het eerste certificaat in `x5c`.
    4. Controleer dat `subject.serialNumber` van dat certificaat de OIN van de verwachte
       stelselbeheerder is, en dat `iss` dezelfde waarde heeft. Sla deze stap niet over: onder een
       root die ook andere certificaten uitgeeft, kan elke houder daarvan anders een document
       ondertekenen dat zich als de stelselbeheerder voordoet.
    5. Weiger een document waarvan `exp` voorbij is, of waarvan `iat` ouder is dan het laatste
       exemplaar dat je accepteerde.

    `/.well-known/jwks.json` toont de publieke sleutels van deze dienst, als gemak voor wie ze wil
    inzien. Het is geen bron van vertrouwen: het komt van hetzelfde adres als het document.

    ## Verversen

    Een document is 24 uur geldig en wordt elk uur opnieuw uitgegeven. `version` verandert alleen
    als de inhoud verandert; `iat` bij elke uitgifte. Gebruik `If-None-Match` met de `ETag` van je
    laatste exemplaar om alleen een nieuw document op te halen als er één is.

    ## Buiten deze API

    Twee paden staan los van `/api/v1` en dragen geen `API-Version`:

    - `GET /.well-known/jwks.json` — de publieke sleutels (RFC 7517), `application/jwk-set+json`.
    - `GET /.well-known/security.txt` — verwijst door naar het centrale meldpunt (RFC 9116).

    ## Foutantwoorden herkennen

    Elk foutantwoord is `application/problem+json` (RFC 9457) en draagt in `type` een kenmerk van
    de vorm `urn:fbs:fout:<code>`. Stuur je gedrag op `type`, niet op `title` of `detail`.

    | `type` | Status | Situatie |
    |---|---|---|
    | `urn:fbs:fout:niet-gevonden` | 404 | Het opgevraagde pad bestaat niet |
    | `urn:fbs:fout:ongeldig-verzoek` | 405, 406 | Een andere methode dan `GET`, of een `Accept` die `application/jose` uitsluit |
    | `urn:fbs:fout:tijdelijk-niet-beschikbaar` | 503 | Er is op dit moment geen geldig document |
    | `urn:fbs:fout:interne-fout` | 500 | Onverwachte fout; `instance` draagt de correlatie-id |
