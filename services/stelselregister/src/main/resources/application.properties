quarkus.application.name=stelselregister
quarkus.application.version=0.1.0

# Container-image (jib): stabiele image-naam zodat de deploy-keten een vaste
# coördinaat heeft. Registry, group, tag, build/push en credentials komen uit de
# CI-flags (-Dquarkus.container-image.*), niet uit deze property.
quarkus.container-image.name=fbs-stelselregister
# De container draait in Nederlandse tijd, zodat logtijden overeenkomen met de klok van wie meekijkt.
quarkus.jib.environment-variables.TZ=Europe/Amsterdam
# De offset in elke logregel legt het tijdstip eenduidig vast, ook in het uur dat bij de
# wintertijdovergang twee keer voorkomt. Verder het standaardformaat van Quarkus.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSSXXX} %-5p [%c] (%t) %s%e%n

quarkus.http.port=8094

# Root-pad voor álle JAX-RS-resources. De `/.well-known`-paden vallen daar bewust buiten en
# staan op de Vert.x-router (WellKnownRoutes).
quarkus.rest.path=/api/v1

# Inkomende-TLS-terminatie, per omgeving in te stellen. Default 'app' (TLS in de
# Quarkus-laag, vereist keystore) is fail-closed. Omgevingen waar de ingress TLS
# termineert zetten HTTP_TLS_TERMINATION=mesh. Zie HttpTlsValidator.
%prod.fbs.http.tls.termination=${HTTP_TLS_TERMINATION:app}

# OpenAPI (ADR: spec MOET op /openapi.json beschikbaar zijn). Swagger UI staat buiten
# dev-mode uit: deze dienst is publiek bereikbaar en heeft geen bedienbaar oppervlak nodig.
quarkus.smallrye-openapi.path=/openapi.json

# Security headers staan in fbs-common/SecurityHeaders, geplaatst door
# SecurityHeadersRegistratie. Het stelseldocument en de sleutelset zetten hun eigen
# Cache-Control; de `no-store` uit die set geldt alleen voor antwoorden zonder.

# Het document is klein; een verzoek aan deze dienst heeft geen body.
quarkus.http.limits.max-body-size=16K

# CORS — het stelseldocument is bedoeld voor apps in een browser, van elke herkomst, en bevat
# niets wat aan een sessie hangt. Daarom elke origin en nooit credentials: zonder cookies of
# Authorization valt er via een vreemde origin niets te halen wat niet al publiek is. Quarkus
# antwoordt bij `*` met de origin van de aanvrager en `Vary: Origin`; voor een browser is dat
# gelijk aan `*`, en een gedeelde cache houdt de antwoorden per origin uit elkaar.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,HEAD,OPTIONS
# If-None-Match is geen "simple header" en lokt dus een preflight uit; de max-age voorkomt dat
# een app die preflight bij elk verzoek herhaalt.
quarkus.http.cors.headers=If-None-Match
quarkus.http.cors.exposed-headers=ETag,API-Version
quarkus.http.cors.access-control-max-age=1H

quarkus.jackson.serialization-inclusion=non_null

# Stelseldocument. De uitgever (iss) en de omgeving hebben buiten dev/test geen default: een
# document met de verkeerde stelselbeheerder of zonder herkenbare omgeving hoort niet te bestaan.
stelseldocument.uitgever-oin=${STELSELDOCUMENT_UITGEVER_OIN}
stelseldocument.omgeving=${STELSELDOCUMENT_OMGEVING}
# De test-OIN van de FSC-peer `logius` in demo/environment; zo tonen stelseldocument en
# FSC-testnet lokaal dezelfde stelselbeheerder.
%dev.stelseldocument.uitgever-oin=${STELSELDOCUMENT_UITGEVER_OIN:00000000000000001000}
%dev.stelseldocument.omgeving=${STELSELDOCUMENT_OMGEVING:lokaal}
%test.stelseldocument.uitgever-oin=00000000000000001000
%test.stelseldocument.omgeving=test
stelseldocument.geldigheid=PT24H
stelseldocument.verversen=PT1H
# De keystore (PKCS#12) met de ondertekensleutel en zijn certificaatketen. Zonder pad start de
# dienst alleen in ontwikkel- en testmodus, met een wegwerpketen; zie Sleutelbron.
stelseldocument.keystore.pad=${STELSELDOCUMENT_KEYSTORE_PAD:}
stelseldocument.keystore.wachtwoord=${STELSELDOCUMENT_KEYSTORE_WACHTWOORD:}
stelseldocument.keystore.alias=${STELSELDOCUMENT_KEYSTORE_ALIAS:stelseldocument}

# Rijksorganisaties die het centrale CVD-beleid volgen, verwijzen naar het centrale bestand van
# het NCSC (advies Forum Standaardisatie bij security.txt).
stelselregister.security-txt-url=${SECURITY_TXT_URL:https://www.ncsc.nl/.well-known/security.txt}

# Magazijnregister: dezelfde basisregels als de berichtenuitvraag, zonder grant-hash — dat is
# routering van de eigen outway en hoort niet in een publiek document. De URL's zijn de publieke
# adressen van de magazijnen. RegisterGelijkAanUitvraagTest faalt zodra OIN's of namen afwijken.
magazijnen."00000000000000100000".url=${MAGAZIJN_A_URL}
magazijnen."00000000000000100000".naam=RVO
magazijnen."00000001823288444000".url=${MAGAZIJN_B_URL}
magazijnen."00000001823288444000".naam=Belastingdienst
%dev.magazijnen."00000000000000100000".url=${MAGAZIJN_A_URL:http://localhost:8090}
%dev.magazijnen."00000001823288444000".url=${MAGAZIJN_B_URL:http://localhost:8091}
%test.magazijnen."00000000000000100000".url=http://localhost:8090
%test.magazijnen."00000001823288444000".url=http://localhost:8091

# fbs-common levert ook onderdelen voor diensten die persoonsgegevens verwerken: het logboek
# dataverwerkingen, de Profiel-service, FSC-routering en de Redis-controle. Deze dienst verwerkt
# geen persoonsgegevens en heeft geen van die afhankelijkheden; zonder deze twee regels eist de
# start een logboek en een Profiel-adres die hier niets doen. Het logboekfilter heeft een eigen
# build-time-schakelaar omdat exclude-types een JAX-RS-provider niet uit de registratie haalt.
fbs.logboek.afwezig=true
quarkus.arc.exclude-types=nl.rijksoverheid.moz.fbs.common.LdvEndpointValidator,\
  nl.rijksoverheid.moz.fbs.common.LdvFailClosedValidator,\
  nl.rijksoverheid.moz.fbs.common.LdvTabelnaamValidator,\
  nl.rijksoverheid.moz.fbs.common.RedisVerbindingValidator,\
  nl.rijksoverheid.moz.fbs.common.profiel.**,\
  nl.rijksoverheid.moz.fbs.common.fsc.**
