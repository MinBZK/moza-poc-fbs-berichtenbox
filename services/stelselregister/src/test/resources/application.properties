quarkus.http.test-port=0

# De planner staat uit: tests roepen het verversen zelf aan, zodat het moment vastligt.
quarkus.scheduler.enabled=false

# Uitgesloten: gegenereerde OpenAPI-stubs, en fbs-common dat zijn eigen suite en gate heeft.
quarkus.jacoco.excludes=nl/rijksoverheid/moz/fbs/stelselregister/api/**,nl/rijksoverheid/moz/fbs/common/**,nl/rijksoverheid/moz/fbs/magazijnregister/**

quarkus.http.test-timeout=15s
