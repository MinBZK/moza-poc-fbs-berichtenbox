quarkus.application.name=beheerconsole
quarkus.application.version=0.1.0

# Container-image (jib): stabiele image-naam zodat de deploy-keten een vaste
# coördinaat heeft. Registry, group, tag, build/push en credentials komen uit de
# CI-flags (-Dquarkus.container-image.*), niet uit deze property.
quarkus.container-image.name=fbs-beheerconsole
# De container draait in Nederlandse tijd, zodat logtijden overeenkomen met de klok van wie meekijkt.
quarkus.jib.environment-variables.TZ=Europe/Amsterdam
# De offset in elke logregel legt het tijdstip eenduidig vast, ook in het uur dat bij de
# wintertijdovergang twee keer voorkomt. Verder het standaardformaat van Quarkus.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSSXXX} %-5p [%c] (%t) %s%e%n

quarkus.http.port=8093

# Root-pad voor de eigen API; alles daarbuiten is de app.
quarkus.rest.path=/api/v1

# Inkomende-TLS-terminatie, per omgeving in te stellen. Default 'app' (TLS in de
# Quarkus-laag, vereist keystore) is fail-closed. Omgevingen waar de ingress TLS
# termineert zetten HTTP_TLS_TERMINATION=mesh. Zie HttpTlsValidator.
%prod.fbs.http.tls.termination=${HTTP_TLS_TERMINATION:app}

# Security headers staan in fbs-common/SecurityHeaders, geplaatst door
# SecurityHeadersRegistratie, met een eigen CSP voor de schermen van de app.

# fbs-common levert ook onderdelen voor diensten die persoonsgegevens verwerken: het logboek
# dataverwerkingen, de Profiel-service, FSC-routering en de Redis-controle. De console verwerkt
# geen persoonsgegevens en heeft geen van die afhankelijkheden; dezelfde uitsluiting als het
# stelselregister. Het logboekfilter heeft een eigen build-time-schakelaar omdat exclude-types
# een JAX-RS-provider niet uit de registratie haalt.
fbs.logboek.afwezig=true
quarkus.arc.exclude-types=nl.rijksoverheid.moz.fbs.common.LdvEndpointValidator,\
  nl.rijksoverheid.moz.fbs.common.LdvFailClosedValidator,\
  nl.rijksoverheid.moz.fbs.common.LdvTabelnaamValidator,\
  nl.rijksoverheid.moz.fbs.common.RedisVerbindingValidator,\
  nl.rijksoverheid.moz.fbs.common.profiel.**,\
  nl.rijksoverheid.moz.fbs.common.fsc.**

# OpenAPI (ADR: spec MOET op /openapi.json beschikbaar zijn). Gelijk aan info.version in de spec.
quarkus.smallrye-openapi.path=/openapi.json
quarkus.smallrye-openapi.info-title=FBS Beheerconsole API
quarkus.smallrye-openapi.info-version=0.1.0

# Het stelselregister waarvan de console het stelseldocument leest. Op ZAD via het publieke adres:
# tussen projecten loopt verkeer alleen over de route op 443.
quarkus.rest-client.stelselregister.url=${STELSELREGISTER_URL}
%dev.quarkus.rest-client.stelselregister.url=${STELSELREGISTER_URL:http://localhost:8094}
quarkus.rest-client.stelselregister.connect-timeout=2000
quarkus.rest-client.stelselregister.read-timeout=5000

# Wat een afnemer vooraf vastlegt: de root (PEM) van de stelselbeheerder, zijn OIN en de omgeving.
# Zonder root toont het overzicht NIET_GETOETST. Buiten dev geen default voor OIN en omgeving.
beheerconsole.stelseldocument.root=${STELSELDOCUMENT_ROOT_PEM:}
beheerconsole.stelseldocument.uitgever=${STELSELDOCUMENT_UITGEVER_OIN}
beheerconsole.stelseldocument.omgeving=${STELSELDOCUMENT_OMGEVING}
%dev.beheerconsole.stelseldocument.uitgever=${STELSELDOCUMENT_UITGEVER_OIN:00000000000000001000}
%dev.beheerconsole.stelseldocument.omgeving=${STELSELDOCUMENT_OMGEVING:lokaal}
%test.beheerconsole.stelseldocument.uitgever=00000000000000001000
%test.beheerconsole.stelseldocument.omgeving=test
%test.quarkus.rest-client.stelselregister.url=http://localhost:1

# De React-app (src/main/webui). Quinoa installeert een vaste Node, installeert met `npm ci`
# tegen de ingecheckte lockfile en bouwt met `npm run build`. Elk pad dat geen API, geen /q en
# geen bestand is, krijgt index.html: de router van de app kiest dan het scherm.
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.22.2
quarkus.quinoa.package-manager-command.install=ci
quarkus.quinoa.enable-spa-routing=true
# Gelijk houden met API_PADEN in SecurityHeadersRegistratie: een pad dat hier ontbreekt, krijgt
# index.html met de webapp-policy (en /.well-known/security.txt zou dan als HTML antwoorden).
quarkus.quinoa.ignored-path-prefixes=/api,/q,/openapi.json,/.well-known
