openapi: 3.0.3
info:
  title: Berichten Uitvraag API
  version: 0.1.0
  description: |
    Frontend-API voor het MijnOverheid-Zakelijk portaal. Leest berichten uit de
    in-process berichtensessiecache (Redis-backed) en raadpleegt het
    berichtenmagazijn voor bijlagen en persistente status-mutaties.

    ## Foutantwoorden herkennen

    Elk foutantwoord is `application/problem+json` (RFC 9457) en draagt in `type` een
    kenmerk van de vorm `urn:fbs:fout:<code>`. Daaraan zie je twee dingen: dat het antwoord
    van deze keten komt, en om welke situatie het gaat. Ontbreekt `type`, of staat er
    `about:blank`, dan komt het antwoord ergens anders vandaan — een proxy onderweg
    bijvoorbeeld — en zegt het niets over het bericht.

    De codes liggen vast: een bestaande code verandert niet van betekenis, er komen er
    hooguit bij. Stuur je gedrag op `type`, niet op `title` of `detail` — die zijn proza en
    mogen wijzigen.

    | `type` | Status | Situatie | Wat je de gebruiker kunt vertellen |
    |---|---|---|---|
    | `urn:fbs:fout:bericht-onbekend` | 404 | Het bericht bestaat niet, hoort bij een andere ondernemer, of zat niet in de opgehaalde set | "Dit bericht is niet (meer) beschikbaar" |
    | `urn:fbs:fout:bericht-verwijderd` | 410 | De ondernemer verwijderde dit bericht zelf | "Je hebt dit bericht verwijderd" |
    | `urn:fbs:fout:nog-niet-opgehaald` | 409 | Er is nog geen ophaalronde geweest | Start `GET /berichten/_ophalen` en probeer daarna opnieuw |
    | `urn:fbs:fout:ophalen-bezig` | 409 | Er loopt een ophaalronde | "Een moment" — wachten, dit is geen fout |
    | `urn:fbs:fout:ophalen-mislukt` | 503 | De vorige ophaalronde strandde | "Probeer het opnieuw" — `_ophalen` opnieuw aanroepen |
    | `urn:fbs:fout:tijdelijk-niet-beschikbaar` | 503 | De tijdelijke berichtenopslag was niet bereikbaar | "Probeer het straks nog eens", na `Retry-After` |
    | `urn:fbs:fout:niet-gevonden` | 404 | Het opgevraagde pad bestaat niet — geen uitspraak over een bericht | — |
    | `urn:fbs:fout:ongeldig-verzoek` | 400, 415, … | Het verzoek zelf klopt niet | Fout bij de afnemer |
    | `urn:fbs:fout:geen-toegang` | 401, 403 | Ontbrekende of ontoereikende toegang | — |
    | `urn:fbs:fout:keten-fout` | 502 | Een schakel verderop hapert | "Probeer het straks nog eens" |
    | `urn:fbs:fout:configuratie-mismatch` | 500, 502 | De configuratie van de keten spreekt zichzelf tegen | Opnieuw proberen helpt niet; dit vraagt een beheerder |
    | `urn:fbs:fout:interne-fout` | 500 | Onverwachte fout | "Er ging iets mis", met de referentie uit `instance` |

    ### Wat `bericht-verwijderd` wel en niet zegt

    De keten weet van een verwijdering zolang het spoor ervan leeft — dat krijgt bij het
    verwijderen de sessie-bewaartermijn mee en schuift daarna niet mee met leesverkeer — en
    alleen van verwijderingen die via deze API liepen. Drie gevolgen:

    - Zodra dat spoor verlopen is, wordt het antwoord weer `bericht-onbekend`, ook als de sessie
      dan nog loopt. Het uitblijven van `bericht-verwijderd` is dus géén bewijs dat er niets
      verwijderd is.
    - Haalt de organisatie het bericht in haar eigen magazijn weg, dan verdwijnt het bij de
      volgende ophaalronde uit de lijst zonder dat deze code verschijnt.
    - Op `PATCH` komt de code niet uit dat spoor maar rechtstreeks uit het magazijn, dat de
      verwijdering persistent kent. Daar geldt de bewaartermijn dus niet.

    Het downloaden van een bijlage begint met dezelfde opzoeking als het ophalen van het bericht
    zelf en geeft dus dezelfde 410. Wat daar níét kan, is een verwijdering die alleen het magazijn
    kent: dat filtert een verwijderd bericht weg vóór het de eigenaar controleert, dus een eigen
    code op díé misser zou het bestaan van andermans bericht verraden. Die blijft
    `bericht-onbekend`.

    ### Wat het nooit zegt

    Bij het ophalen van een bericht of een bijlage leveren "dit bericht bestaat niet" en "dit
    bericht bestaat wel, maar is niet van jou" exact hetzelfde antwoord: `bericht-onbekend` met
    een 404. Dat is opzet — een verschil daartussen zou het bestaan van andermans berichten
    aftastbaar maken. De opzoeking is per ontvanger gesleuteld, dus die twee gevallen zijn hier
    letterlijk dezelfde misser.

    Op `PATCH` en `DELETE` geldt dat niet: die gaan naar het magazijn, dat het bericht opzoekt
    vóór het de eigenaar controleert en daardoor `geen-toegang` (403) geeft op andermans bericht
    en `bericht-onbekend` (404) op een bericht dat niet bestaat. Wie dat verschil wil dichten,
    kan het gedrag van het magazijn niet uit deze API afleiden.
  contact:
    name: MOZA Team
    email: moza@minbzk.nl
    url: https://github.com/MinBZK/moza-poc-fbs-berichtenbox
  license:
    name: EUPL-1.2
    url: https://eupl.eu/1.2/nl/
servers:
  - url: /api/v1
    description: Versioned API base path (relatief; TLS termineert op de gateway).

tags:
  - name: Uitvraag
    description: Berichten-uitvraag voor het portaal
  - name: Ophalen
    description: SSE-endpoint voor cache-warming; wordt buiten codegen afgehandeld
  - name: Aanmeld
    description: |
      CloudEvents-webhook waarop de Publicatie Stream van een magazijn een nieuw
      gepubliceerd bericht aanmeldt. Werkt de sessiecache bij voor ontvangers met
      een actieve sessie. Wordt buiten codegen afgehandeld (custom media type +
      202-respons).

paths:
  /berichten:
    get:
      tags: [Uitvraag]
      summary: Berichtenlijst
      description: |
        Volledige berichtenlijst voor de ontvanger; bron is de sessiecache.
        Filteren per map is (nog) niet beschikbaar: de sessiecache indexeert
        `map` niet (zie issue #571). Het `map`-veld wordt wél per bericht
        teruggegeven.
      operationId: getBerichten
      parameters:
        - $ref: '#/components/parameters/OntvangerHeader'
        - name: pagina
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: paginaGrootte
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Berichtenlijst
          headers:
            API-Version: { $ref: '#/components/headers/API-Version' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BerichtenLijst' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /berichten/_ophalen:
    get:
      tags: [Ophalen]
      summary: Vul cache voor alle mappen (Server-Sent Events)
      operationId: ophalenBerichten
      description: |
        Start het ophalen van berichten uit de aangesloten magazijnen en vult de
        sessiecache. Antwoordt met Server-Sent Events met per-magazijn voortgang
        en een afsluitend gereed/fout-event. Geen query-parameters: alle mappen
        worden opgehaald.

        Levert een organisatie meer berichten dan de uitvraag ophaalt, dan draagt het
        `magazijn-bevraging-voltooid`-event `afgekapt: true` (en `totaalBeschikbaar`
        als het magazijn een totaal meldde). De status blijft `OK`: de opgehaalde
        berichten zijn er wél. Toon dat signaal, ook in een samenvattende regel —
        anders lijkt een afgekapte lijst een volledige lijst en kan de ontvanger niet
        weten wat hij mist.

        Een organisatie die niet bevraagd is omdat de uitvraag te veel werk tegelijk
        had, krijgt status `NIET_OPGEHAALD`. Dat is geen storing bij die organisatie:
        opnieuw ophalen helpt hier wél. Het afsluitende `ophalen-gereed`-event telt
        die organisaties in `nietOpgehaald`, apart van `mislukt`, zodat een
        samenvattende regel het onderscheid kan maken.

        Uitbreidbaarheid — deze woordenlijst kan groeien. Behandel een `status` die je
        niet kent als "niet geleverd, opnieuw proberen kan helpen", nooit als `OK`, en
        tel hem nooit als geslaagd. Negeer een `event` dat je niet kent. Een afnemer die
        zich hieraan houdt, breekt niet op een latere toevoeging.

        Foutsemantiek: header-validatie, een al lopende ophaling (`409`) en een
        onbereikbare cache (`503`) falen vóór de stream. Zodra de SSE-stream is
        opgezet staat de HTTP-status op `200` vast; een storing daarna uit zich
        niet in een afwijkende status maar in het uitblijven van het afsluitende
        `ophalen-gereed`-event (en de per-magazijn fout-events) — de client
        detecteert de storing dus op stream-niveau.
      parameters:
        - $ref: '#/components/parameters/OntvangerHeader'
      responses:
        '200':
          description: SSE-stream
          headers:
            API-Version: { $ref: '#/components/headers/API-Version' }
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/OphaalEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /berichten/_zoeken:
    get:
      tags: [Uitvraag]
      summary: Zoeken in berichten
      description: Volledig-tekst zoeken in berichten via de sessiecache.
      operationId: zoekenBerichten
      parameters:
        - $ref: '#/components/parameters/OntvangerHeader'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
      responses:
        '200':
          description: Zoekresultaten
          headers:
            API-Version: { $ref: '#/components/headers/API-Version' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BerichtenLijst' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /berichten/{berichtId}:
    parameters:
      - $ref: '#/components/parameters/BerichtIdPath'
    get:
      tags: [Uitvraag]
      summary: Bericht ophalen
      description: Volledig bericht inclusief inhoud en bijlage-metadata.
      operationId: getBerichtById
      parameters:
        - $ref: '#/components/parameters/OntvangerHeader'
      responses:
        '200':
          description: Bericht
          headers:
            API-Version: { $ref: '#/components/headers/API-Version' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bericht' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Uitvraag]
      summary: Bericht-status bijwerken / verplaatsen
      description: |
        Werk status (`gelezen`/`ongelezen`) en/of `map` van een bericht bij. Idempotent.
      operationId: updateBerichtMetadata
      parameters:
        - $ref: '#/components/parameters/OntvangerHeader'
        - $ref: '#/components/parameters/MagazijnIdQuery'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/BerichtPatch' }
      responses:
        '200':
          description: Bijgewerkt bericht
          headers:
            API-Version: { $ref: '#/components/headers/API-Version' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bericht' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      tags: [Uitvraag]
      summary: Bericht verwijderen
      description: |
        Verwijder een bericht. Idempotent.
      operationId: verwijderBericht
      parameters:
        - $ref: '#/components/parameters/OntvangerHeader'
        - $ref: '#/components/parameters/MagazijnIdQuery'
      responses:
        '204':
          description: Verwijderd
          headers:
            API-Version: { $ref: '#/components/headers/API-Version' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /berichten/{berichtId}/bijlagen/{bijlageId}:
    parameters:
      - $ref: '#/components/parameters/BerichtIdPath'
      - name: bijlageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Uniek ID van de bijlage binnen het bericht
    get:
      tags: [Uitvraag]
      summary: Bijlage ophalen (octet-stream, dynamic Content-Type)
      description: |
        Streamt bijlage-bytes rechtstreeks uit het magazijn, met `Content-Type` uit de
        metadata van de bijlage.

        `Content-Disposition` draagt de bestandsnaam en bepaalt of een browser de bijlage
        mag tonen. `inline` geldt uitsluitend voor `application/pdf`, `image/png` en
        `image/jpeg`: typen waarvan de weergave geen code uitvoert die bij de DOM of de
        cookies van de afnemer kan. Elk ander type krijgt `attachment` — met name `text/html` en
        `image/svg+xml`, die bij het openen van dit adres onder de origin van de afnemer
        zouden draaien (stored XSS); CSP `frame-ancestors` dekt die top-level navigatie
        niet. Een MIME-type dat onbruikbaar is als headerwaarde (niet te parsen, of met
        control-tekens) wordt `application/octet-stream` en dus een download. Dezelfde
        afweging als het magazijn maakt, zodat een rechtstreekse magazijn-afname
        hetzelfde antwoord geeft.
      operationId: getBijlage
      parameters:
        - $ref: '#/components/parameters/OntvangerHeader'
      responses:
        '200':
          description: Bijlage-bytes
          headers:
            API-Version: { $ref: '#/components/headers/API-Version' }
            Content-Type:
              schema: { type: string }
              description: Werkelijk MIME-type van de bijlage
            Content-Disposition:
              schema: { type: string }
              description: |
                `inline` voor `application/pdf`, `image/png` en `image/jpeg`, `attachment`
                voor elk ander type. Draagt de bestandsnaam als `filename` (ASCII-vorm voor
                clients die `filename*` niet kennen) en `filename*` (RFC 5987, UTF-8, voor
                de naam zoals hij werkelijk is). Kent de sessiecache de bijlage niet, dan
                blijft de naam weg en draagt de header alleen de dispositie.
              example: "inline; filename=\"voorlopige-aanslag-2026.pdf\"; filename*=UTF-8''voorlopige-aanslag-2026.pdf"
          content:
            '*/*':
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /aanmeldingen:
    post:
      tags: [Aanmeld]
      summary: Bericht aanmelden (CloudEvents-webhook)
      description: |
        Ontvangt een CloudEvent (`nl.rijksoverheid.fbs.bericht.gepubliceerd`) van de
        Publicatie Stream van een magazijn (structured content mode, NL GOV
        CloudEvents-profiel) en werkt daarmee de sessiecache bij voor de ontvanger.
        Alleen ontvangers met een actieve sessie worden bijgewerkt; ontbreekt die,
        dan wordt het event geaccepteerd maar overgeslagen. Idempotent op het
        CloudEvents `id`.
      operationId: meldBerichtAan
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema: { $ref: '#/components/schemas/CloudEvent' }
      responses:
        '202':
          description: |
            Event geaccepteerd. De cache is bijgewerkt, of bewust overgeslagen
            (geen actieve sessie / duplicaat). Geen response-body.
          headers:
            API-Version: { $ref: '#/components/headers/API-Version' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  parameters:
    OntvangerHeader:
      name: X-Ontvanger
      in: header
      required: true
      schema: { type: string, pattern: '^(BSN|RSIN|KVK|OIN):[0-9]+$' }
      description: 'Type:waarde, bijv. `BSN:999990019`'
    BerichtIdPath:
      name: berichtId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MagazijnIdQuery:
      name: magazijnId
      in: query
      required: true
      schema: { type: string, minLength: 1 }
      description: |
        Identifier van het magazijn waarin het bericht is opgeslagen — het OIN
        van de deelnemende organisatie (per organisatie bestaat precies één
        magazijn). Te halen uit het `magazijnId`-veld van de GET-response
        (lijst of detail); voor de client een opaque waarde. De client geeft
        het mee zodat de uitvraag-service geen sessiecache-lookup nodig heeft
        om het bron-magazijn te bepalen. Een waarde die niet in het
        magazijnregister staat levert 502 op; een bekend magazijn dat het
        bericht niet kent, handelt zelf af (404/403).

  headers:
    API-Version:
      description: Volledige API-versie (semver, major.minor.patch); komt overeen met `info.version`.
      schema:
        type: string
        example: "0.1.0"

  responses:
    BadRequest:
      description: Ongeldige aanvraag
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Niet geauthenticeerd
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Geauthenticeerd, maar niet geautoriseerd voor deze ontvanger of bron.
        Doorgegeven vanuit de sessiecache/magazijn die de ontvanger-match afdwingt.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Bericht niet gevonden (`urn:fbs:fout:bericht-onbekend`). Dekt met opzet drie
        situaties onder één antwoord: het bericht bestaat niet, het hoort bij een andere
        ondernemer, of het zat niet in de opgehaalde set.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: |
        De ondernemer verwijderde dit bericht zelf (`urn:fbs:fout:bericht-verwijderd`). Op de
        ophaalpaden alleen bekend zolang het spoor van die verwijdering leeft (de
        sessie-bewaartermijn vanaf het verwijderen) en alleen voor verwijderingen die via deze API
        liepen; daarbuiten is het antwoord een gewone 404. Op `PATCH` komt de code uit het
        magazijn, dat de verwijdering persistent kent.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Onverwacht request-content-type (bv. PATCH zonder `application/merge-patch+json`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalServerError:
      description: Serverfout
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        Sessie-conflict. Op leespaden: de cache is nog niet gevuld (`_ophalen`
        nog niet voltooid of nog bezig) — roep eerst `GET /berichten/_ophalen`
        aan en probeer daarna opnieuw. Op `_ophalen` zelf: er loopt al een
        ophaling voor deze ontvanger.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: |
        Tijdelijk niet beschikbaar; opnieuw proberen is zinvol, na de periode uit
        `Retry-After`. Twee oorzaken vallen hieronder: de tijdelijke berichtenopslag was
        niet bereikbaar, of de vorige ophaalronde is gestrand — bij dat laatste is
        `_ophalen` opnieuw aanroepen de weg vooruit.
      headers:
        Retry-After:
          description: Aantal seconden waarna opnieuw proberen zinvol is.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: |
        Een upstream-bron (de cache-backingstore of een magazijn) was onbereikbaar
        of leverde een onbruikbare respons. Dekt zowel een transport-/5xx-storing
        bij het lezen als het geval waarin de magazijn-write slaagde maar de
        cache-update faalde.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    BerichtenLijst:
      type: object
      description: |
        Paginatie via HAL `_links.next`/`prev`. Aantallen (totalElements,
        totalPages) bewust niet opgenomen — frontend navigeert via links zonder
        absolute paginavoortgang.
      required: [berichten]
      properties:
        berichten:
          type: array
          items: { $ref: '#/components/schemas/BerichtSamenvatting' }
        _links:
          $ref: '#/components/schemas/PaginaLinks'

    BerichtSamenvatting:
      type: object
      required: [berichtId, onderwerp, afzenderNaam, publicatietijdstip, aantalBijlagen, magazijnId]
      properties:
        berichtId: { type: string, format: uuid }
        onderwerp: { type: string }
        afzenderNaam:
          type: string
          minLength: 1
          description: |
            Weergavenaam van de afzendende organisatie, bijvoorbeeld "RVO" of
            "Belastingdienst". Altijd aanwezig en nooit leeg: elke deelnemende organisatie
            draagt een verplichte naam in het magazijnregister, en elk bericht krijgt die naam
            mee op het moment dat het in de sessie wordt opgeslagen. Een afnemer hoeft dus geen
            terugval te bouwen — `magazijnId` is een twintigcijferig nummer en geen naam.
        publicatietijdstip:
          type: string
          format: date-time
          description: Effectieve publicatie-tijd, overgenomen uit het magazijn
        aantalBijlagen: { type: integer, minimum: 0 }
        map: { type: string }
        status: { $ref: '#/components/schemas/BerichtStatus' }
        magazijnId:
          type: string
          description: Identifier van het decentrale magazijn waar dit bericht is opgeslagen (het OIN van de deelnemende organisatie); nodig voor bijlage-routering.
        _links: { $ref: '#/components/schemas/BerichtLinks' }

    Bericht:
      type: object
      required: [berichtId, onderwerp, afzenderNaam, publicatietijdstip, magazijnId]
      properties:
        berichtId: { type: string, format: uuid }
        onderwerp: { type: string }
        afzenderNaam:
          type: string
          minLength: 1
          description: |
            Weergavenaam van de afzendende organisatie, bijvoorbeeld "RVO" of
            "Belastingdienst". Altijd aanwezig en nooit leeg: elke deelnemende organisatie
            draagt een verplichte naam in het magazijnregister, en elk bericht krijgt die naam
            mee op het moment dat het in de sessie wordt opgeslagen. Een afnemer hoeft dus geen
            terugval te bouwen — `magazijnId` is een twintigcijferig nummer en geen naam.
        inhoud: { type: string }
        publicatietijdstip:
          type: string
          format: date-time
          description: Effectieve publicatie-tijd, overgenomen uit het magazijn
        map: { type: string }
        status: { $ref: '#/components/schemas/BerichtStatus' }
        magazijnId:
          type: string
          description: Identifier van het decentrale magazijn waar dit bericht is opgeslagen (het OIN van de deelnemende organisatie); nodig voor bijlage-routering.
        bijlagen:
          type: array
          items: { $ref: '#/components/schemas/BijlageMetadata' }
        _links: { $ref: '#/components/schemas/BerichtLinks' }

    BijlageMetadata:
      type: object
      description: |
        Bijlage-metadata. `mimeType` en `grootteInBytes` zijn optioneel en
        ontbreken wanneer het bericht uit de sessiecache komt (die bewaart per
        bijlage alleen `bijlageId` en `naam`); het werkelijke MIME-type wordt
        meegegeven bij het downloaden van de bijlage zelf.
      required: [bijlageId, naam]
      properties:
        bijlageId: { type: string, format: uuid }
        naam: { type: string }
        mimeType: { type: string }
        grootteInBytes: { type: integer, format: int64 }
        _links: { $ref: '#/components/schemas/BijlageLinks' }

    BerichtPatch:
      type: object
      description: |
        JSON Merge Patch (RFC 7396). Beide velden optioneel; minimaal één veld
        vereist. `status` wijzigt leesstatus; `map` verplaatst het bericht.
        Ontbrekend veld én `null` worden beide behandeld als "niet wijzigen".
      properties:
        status: { $ref: '#/components/schemas/BerichtStatus' }
        map: { type: string, minLength: 1, maxLength: 128 }
      minProperties: 1

    BerichtStatus:
      type: string
      enum: [gelezen, ongelezen]
      nullable: true

    Link:
      type: object
      properties:
        href: { type: string, format: uri-reference }

    BerichtLinks:
      type: object
      properties:
        self: { $ref: '#/components/schemas/Link' }

    BijlageLinks:
      type: object
      properties:
        self: { $ref: '#/components/schemas/Link' }

    PaginaLinks:
      type: object
      properties:
        self: { $ref: '#/components/schemas/Link' }
        next: { $ref: '#/components/schemas/Link' }
        prev: { $ref: '#/components/schemas/Link' }

    OphaalEvent:
      description: |
        Eén voortgangsbericht uit de SSE-stroom van `GET /berichten/_ophalen`. Elke SSE-regel
        draagt in zijn `data`-veld één van deze objecten als JSON; `event` zegt om welk soort
        bericht het gaat. Een soort die je niet kent, mag je negeren.

        Een ophaalronde levert eerst één `magazijn-bevraging-gestart` per organisatie, daarna per
        organisatie één `magazijn-bevraging-voltooid`, en sluit af met precies één
        `ophalen-gereed` of `ophalen-fout`. Blijft dat slotbericht uit, dan is de ronde afgebroken.
      oneOf:
        - $ref: '#/components/schemas/MagazijnBevragingGestart'
        - $ref: '#/components/schemas/MagazijnBevragingVoltooid'
        - $ref: '#/components/schemas/OphalenGereed'
        - $ref: '#/components/schemas/OphalenFout'
      discriminator:
        propertyName: event
        mapping:
          magazijn-bevraging-gestart: '#/components/schemas/MagazijnBevragingGestart'
          magazijn-bevraging-voltooid: '#/components/schemas/MagazijnBevragingVoltooid'
          ophalen-gereed: '#/components/schemas/OphalenGereed'
          ophalen-fout: '#/components/schemas/OphalenFout'

    MagazijnStatus:
      type: string
      description: |
        Uitkomst van de bevraging van één organisatie.

        * `OK` — de organisatie heeft geantwoord; haar berichten zitten in deze ophaalronde.
        * `FOUT` — de organisatie kon niet geraadpleegd worden.
        * `TIMEOUT` — de organisatie antwoordde niet binnen de tijd.
        * `NIET_OPGEHAALD` — de organisatie is niet bevraagd: de uitvraag had te veel
          organisaties tegelijk in behandeling. Dit zegt niets over die organisatie, en opnieuw
          ophalen helpt hier wél.

        Deze lijst kan groeien. Een waarde die je niet kent betekent "niet geleverd, opnieuw
        proberen kan helpen" — behandel hem nooit als `OK` en tel hem nooit als geslaagd.
      enum: [OK, FOUT, TIMEOUT, NIET_OPGEHAALD]

    MagazijnBevragingGestart:
      type: object
      description: |
        De bevraging van deze organisatie hoort bij deze ophaalronde. Alle
        `magazijn-bevraging-gestart`-berichten komen vooruit, vóór de eerste uitkomst, zodat het
        portaal meteen de volledige lijst kan tonen. Een organisatie waarvoor nog geen
        `magazijn-bevraging-voltooid` binnen is, is nog onderweg.
      required: [event, magazijnId]
      properties:
        event: { type: string, enum: [magazijn-bevraging-gestart] }
        magazijnId: { $ref: '#/components/schemas/MagazijnId' }
        naam: { $ref: '#/components/schemas/MagazijnNaam' }

    MagazijnBevragingVoltooid:
      type: object
      description: |
        De bevraging van deze organisatie is afgerond; `status` zegt hoe.

        Bij `OK` staan `aantalBerichten` en `afgekapt` erbij, en `totaalBeschikbaar` wanneer de
        organisatie een bruikbaar totaal meldde. Bij elke andere status staat er in plaats daarvan
        een `foutmelding` die aan de ontvanger getoond mag worden.
      required: [event, magazijnId, status]
      properties:
        event: { type: string, enum: [magazijn-bevraging-voltooid] }
        magazijnId: { $ref: '#/components/schemas/MagazijnId' }
        naam: { $ref: '#/components/schemas/MagazijnNaam' }
        status: { $ref: '#/components/schemas/MagazijnStatus' }
        aantalBerichten:
          type: integer
          description: Aantal berichten dat deze organisatie in deze ronde leverde. Alleen bij `OK`.
        afgekapt:
          type: boolean
          description: |
            Er staat méér bij deze organisatie dan er is opgehaald. Alleen bij `OK` — de opgehaalde
            berichten zijn er wél. Toon dit signaal, ook in een samenvattende regel: anders lijkt
            een afgekapte lijst een volledige lijst.
        totaalBeschikbaar:
          type: integer
          format: int64
          description: Wat de organisatie zelf als totaal meldde. Ontbreekt als ze geen bruikbaar totaal gaf.
        foutmelding:
          type: string
          description: Aan de ontvanger toonbare uitleg. Staat er bij elke status behalve `OK`.

    OphalenGereed:
      type: object
      description: |
        De ophaalronde is afgerond en het resultaat staat in de sessiecache. De tellers dekken
        samen alle organisaties uit `totaalMagazijnen`.
      required: [event, totaalBerichten, geslaagd, mislukt, nietOpgehaald, totaalMagazijnen]
      properties:
        event: { type: string, enum: [ophalen-gereed] }
        totaalBerichten:
          type: integer
          description: Aantal opgehaalde berichten over alle organisaties samen.
        geslaagd: { $ref: '#/components/schemas/AantalGeslaagd' }
        mislukt: { $ref: '#/components/schemas/AantalMislukt' }
        nietOpgehaald: { $ref: '#/components/schemas/AantalNietOpgehaald' }
        totaalMagazijnen: { $ref: '#/components/schemas/AantalMagazijnen' }

    OphalenFout:
      type: object
      description: |
        De ophaalronde is gestrand; er staat geen resultaat van deze ronde in de sessiecache.
        `referentie` is het support-anker dat ook in onze foutlog staat en dat in de tekst van
        `foutmelding` herhaald wordt.

        Strandde de ronde ná het bevragen — de organisaties antwoordden, maar het bewaren
        mislukte — dan staan de tellers erbij: het portaal heeft de uitkomsten per organisatie al
        gezien en moet weten dat ze niet bewaard zijn. Strandde de ronde ervóór, dan ontbreken ze
        en is `totaalMagazijnen` 0.
      required: [event, foutmelding, totaalMagazijnen, referentie]
      properties:
        event: { type: string, enum: [ophalen-fout] }
        foutmelding: { type: string, description: Aan de ontvanger toonbare uitleg. }
        geslaagd: { $ref: '#/components/schemas/AantalGeslaagd' }
        mislukt: { $ref: '#/components/schemas/AantalMislukt' }
        nietOpgehaald: { $ref: '#/components/schemas/AantalNietOpgehaald' }
        totaalMagazijnen: { $ref: '#/components/schemas/AantalMagazijnen' }
        referentie: { type: string, description: Support-anker; noem dit bij een melding aan de beheerder. }

    MagazijnId:
      type: string
      description: |
        Identificeert de organisatie waarvan de berichten komen — het OIN van de deelnemende
        organisatie (per organisatie bestaat precies één magazijn). Voor de client een opaque
        waarde; dezelfde waarde staat in het `magazijnId`-veld van een bericht.

    MagazijnNaam:
      type: string
      description: Weergavenaam van de organisatie. Ontbreekt als er geen naam bekend is; val dan terug op `magazijnId`.

    AantalGeslaagd:
      type: integer
      description: Organisaties die antwoordden (`OK`).

    AantalMislukt:
      type: integer
      description: Organisaties die bevraagd zijn maar niet leverden (`FOUT` of `TIMEOUT`).

    AantalNietOpgehaald:
      type: integer
      description: |
        Organisaties die niet bevraagd zijn omdat de uitvraag te veel werk tegelijk had
        (`NIET_OPGEHAALD`). Bewust apart van `mislukt`: hier is niets stuk en helpt opnieuw
        ophalen wél. Presenteer ze niet als mislukking.

    AantalMagazijnen:
      type: integer
      description: Aantal organisaties in deze ophaalronde.

    CloudEvent:
      type: object
      description: |
        CloudEvents-envelope (structured content mode) conform NL GOV
        CloudEvents-profiel v1.1 (op basis van CloudEvents core v1.0). Context-
        attributen bevatten geen persoonsgegevens: `subject` is het berichtId,
        niet de ontvanger.
      required: [id, source, specversion, type, data]
      properties:
        id:
          type: string
          description: Unieke event-identifier; `source` + `id` is globaal uniek. Basis voor idempotentie.
        source:
          type: string
          format: uri-reference
          description: 'URN met nld-namespace, bijv. `urn:nld:oin:<OIN>:systeem:fbs-magazijn`.'
        specversion:
          type: string
          enum: ["1.0"]
        type:
          type: string
          enum: [nl.rijksoverheid.fbs.bericht.gepubliceerd]
          description: Reverse Domain Name Notation.
        subject:
          type: string
          description: Onderwerp van het event (berichtId). Nooit een BSN/RSIN.
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          example: application/json
        dataschema:
          type: string
          format: uri
        data: { $ref: '#/components/schemas/AangemeldBerichtData' }

    AangemeldBerichtData:
      type: object
      description: Payload van het gepubliceerd-bericht-event; spiegelt het magazijn-contract.
      required: [berichtId, afzender, ontvanger, onderwerp, inhoud, publicatietijdstip]
      properties:
        berichtId: { type: string, format: uuid }
        afzender:
          type: string
          description: OIN (20 cijfers) van de afzendende organisatie.
        ontvanger: { $ref: '#/components/schemas/AangemeldOntvanger' }
        onderwerp: { type: string }
        inhoud: { type: string }
        tijdstipOntvangst:
          type: string
          format: date-time
        publicatietijdstip:
          type: string
          format: date-time

    AangemeldOntvanger:
      type: object
      description: Identificatienummer van de ontvanger (type + waarde, los i.p.v. geprefixt).
      required: [type, waarde]
      properties:
        type:
          type: string
          enum: [BSN, RSIN, KVK, OIN]
        waarde:
          type: string
          pattern: '^[0-9]+$'

    Problem:
      type: object
      description: Problem Details (RFC 9457)
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
