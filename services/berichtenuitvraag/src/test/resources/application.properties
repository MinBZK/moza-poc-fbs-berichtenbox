# Test configuratie
quarkus.http.test-port=0

# Logboek Dataverwerkingen uitgeschakeld in tests: het logboek is in CI/lokale
# unit-tests niet bereikbaar; de wrapper laat de ProcessingHandler anders falen
# tijdens lazy init.
logboekdataverwerking.enabled=false

# Profiel-service rest-client URL is verplicht omdat fbs-common ProfielServiceClient
# CDI-laadt; uitvraag-tests doen geen profiel-call maar config-validatie eist een URL.
quarkus.rest-client.profiel-service.url=http://localhost:8089

# Redis uit in de standaard-testsuite: de sessiecache-facade wordt gemockt
# (MockSessiecache); alleen het keten-E2E-profiel (KetenE2eProfile) schakelt
# Redis Dev Services in. Géén quarkus.redis.hosts hier: een geconfigureerde
# host onderdrukt Dev Services, ook met devservices.enabled=true in het
# E2E-profiel. De library-beans zijn lazy, dus zonder facade-gebruik wordt
# er geen verbinding opgezet.
quarkus.redis.devservices.enabled=false

# Bovengrens op één testrequest. Een afgewezen request wordt beantwoord zónder de body te lezen;
# zonder grens blijft de client schrijven tot iets anders ingrijpt, en dat liet een CI-job zes uur
# doorlopen bij de test die bewust een te grote bijlage aanbiedt. Dit is de knop die Quarkus
# daarvoor biedt: hij zet de socket-, connect- en pool-timeout op de RestAssured-config van élke
# test. Zelf die config zetten heeft geen zin — Quarkus overschrijft de hele httpClient-sectie per
# test, ná elke listener.
quarkus.http.test-timeout=60s
