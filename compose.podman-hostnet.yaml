# Overlay op compose.yaml + compose.podman.yaml — vangnet voor omgevingen zonder bruikbaar
# bridge-netwerk (podman-in-een-container: `/proc/sys` is read-only, dus netavark krijgt de
# sysctls van de bridge niet gezet, en aardvark-dns ontbreekt, dus container-DNS resolvet niet).
#
#   docker-compose -f compose.yaml -f compose.podman.yaml -f compose.podman-hostnet.yaml \
#                  --profile demo up -d
#
# Alle containers delen de netns van de aanroeper en praten over 127.0.0.1 in plaats van over
# container-DNS-namen. Images, mounts, SELinux-labels en de overige env blijven uit de twee
# onderliggende bestanden — hier staan alleen de verschillen.
#
# Vier soorten aanpassing, en alleen deze:
#
#  1. `network_mode: host` met `ports: !reset []`: in een gedeelde netns luistert alles al op de
#     netns van de aanroeper, en een gepubliceerde poort is daar onverenigbaar mee.
#  2. Eén netns is één poortruimte, dus botsende listeners krijgen een uniek poortnummer en de
#     adres-env's die ernaar wijzen volgen. De vijf WireMock-stubs luisteren in de basis allemaal
#     intern op 8080, en beide magazijnen op 8090; die krijgen hier hun gepubliceerde poort als
#     luisterpoort, zodat de URL's uit de runbook blijven kloppen.
#  3. Geen healthchecks: podman voert die uit via systemd-timers, en juist in de omgevingen die
#     deze overlay nodig hebben draait geen systemd — de status blijft dan eeuwig 'starting' en
#     `condition: service_healthy` loopt vast. De wachters worden `service_started`;
#     `demo/podman-up.sh` wacht zelf actief op Redis, Postgres en Toxiproxy.
#  4. Toxiproxy krijgt de omgeschreven proxy-definities uit `demo/generated/` (upstreams op
#     127.0.0.1); `demo/podman-prepare.sh hostnet` genereert die.
#
# Poortverdeling binnen de gedeelde netns:
#   6379 redis · 5432/5433 postgres a/b · 8081/8082 wiremock magazijn a/b (dev-stubs)
#   8083 aanmeld · 8084 notificatie · 8089 profiel · 8092 magazijn-stubs · 8123 clickhouse
#   8090/8091 berichtenmagazijn a/b · 8086 uitvraag · 8095 demo-console
#   8474 toxiproxy-admin · 16379/18084/18086/18089/18090/18091 toxiproxy-proxies
services:
  redis:
    network_mode: host
    ports: !reset []
    healthcheck: !reset null

  magazijn-a:
    network_mode: host
    ports: !reset []
    command: ["--port", "8081", "--verbose", "--global-response-templating"]

  magazijn-b:
    network_mode: host
    ports: !reset []
    command: ["--port", "8082", "--verbose", "--global-response-templating"]

  profiel-service:
    network_mode: host
    ports: !reset []
    command: ["--port", "8089", "--verbose"]

  aanmeld-stub:
    network_mode: host
    ports: !reset []
    command: ["--port", "8083", "--verbose", "--global-response-templating"]

  notificatie-stub:
    network_mode: host
    ports: !reset []
    command: ["--port", "8084", "--verbose", "--global-response-templating"]

  clickhouse:
    network_mode: host
    ports: !reset []

  postgres-a:
    network_mode: host
    ports: !reset []
    healthcheck: !reset null

  # PGPORT verplaatst zowel de server als pg_isready naar 5433; in een gedeelde netns kan de
  # tweede Postgres niet óók op 5432 luisteren.
  postgres-b:
    network_mode: host
    ports: !reset []
    healthcheck: !reset null
    environment:
      PGPORT: "5433"

  toxiproxy:
    network_mode: host
    ports: !reset []
    volumes:
      - ./demo/generated/proxies-host.json:/proxies.json:ro,z

  magazijn-stubs:
    network_mode: host
    ports: !reset []
    command: ["--port", "8092", "--verbose"]

  berichtenmagazijn-a:
    network_mode: host
    ports: !reset []
    depends_on:
      postgres-a:
        condition: service_started
    environment:
      DB_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/berichtenmagazijn
      AANMELD_URL: http://127.0.0.1:18086/api/v1/aanmeldingen
      NOTIFICATIE_URL: http://127.0.0.1:18084/events
      PROFIEL_SERVICE_URL: http://127.0.0.1:8089
      LDV_CLICKHOUSE_ENDPOINT: http://127.0.0.1:8123

  berichtenmagazijn-b:
    network_mode: host
    ports: !reset []
    depends_on:
      postgres-b:
        condition: service_started
    environment:
      # Beide magazijnen luisteren in de basis op 8090; b wijkt hier uit naar zijn eigen poort.
      QUARKUS_HTTP_PORT: "8091"
      DB_JDBC_URL: jdbc:postgresql://127.0.0.1:5433/berichtenmagazijn
      AANMELD_URL: http://127.0.0.1:18086/api/v1/aanmeldingen
      NOTIFICATIE_URL: http://127.0.0.1:18084/events
      PROFIEL_SERVICE_URL: http://127.0.0.1:8089
      LDV_CLICKHOUSE_ENDPOINT: http://127.0.0.1:8123

  berichtenuitvraag:
    network_mode: host
    ports: !reset []
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_HOSTS: redis://127.0.0.1:16379
      MAGAZIJN_A_URL: http://127.0.0.1:18090
      MAGAZIJN_B_URL: http://127.0.0.1:18091
      PROFIEL_SERVICE_URL: http://127.0.0.1:18089
      LDV_CLICKHOUSE_ENDPOINT: http://127.0.0.1:8123

  demo-console:
    network_mode: host
    ports: !reset []
    depends_on:
      redis:
        condition: service_started
    environment:
      TOXIPROXY_ADMIN_URL: http://127.0.0.1:8474
      REDIS_HOSTS: redis://127.0.0.1:6379
      UITVRAAG_URL: http://127.0.0.1:8086
      MAGAZIJN_A_URL: http://127.0.0.1:8090
      MAGAZIJN_B_URL: http://127.0.0.1:8091
      MAGAZIJN_A_DB_URL: jdbc:postgresql://127.0.0.1:5432/berichtenmagazijn
      MAGAZIJN_B_DB_URL: jdbc:postgresql://127.0.0.1:5433/berichtenmagazijn
      MAGAZIJN_STUBS_ADMIN_URL: http://127.0.0.1:8092
