# Overlay op compose.yaml + compose.podman.yaml — vangnet voor omgevingen zonder bruikbaar
# bridge-netwerk (podman-in-een-container: `/proc/sys` is read-only, dus netavark krijgt de
# sysctls van de bridge niet gezet, en aardvark-dns ontbreekt, dus container-DNS resolvet niet).
#
# Start deze modus via `demo/podman-up.sh` — het wachten zit daar, niet in compose (zie punt 3).
#
# Alle containers delen de netns van de aanroeper. Images, SELinux-labels en de overige env en
# mounts blijven uit de twee onderliggende bestanden — hier staan alleen de verschillen.
#
# Vier soorten aanpassing, en alleen deze:
#
#  1. `network_mode: host` met `ports: !reset []`: in een gedeelde netns luistert alles al op de
#     netns van de aanroeper, en een gepubliceerde poort is daar onverenigbaar mee.
#  2. Adressering: elke container-DNS-naam wordt 127.0.0.1, en listeners die daardoor op dezelfde
#     poort zouden botsen krijgen een uniek poortnummer dat de adres-env's volgen. De
#     WireMock-stubs luisteren in de basis allemaal intern op 8080 en beide magazijnen op 8090;
#     ze krijgen hier hun gepubliceerde poort als luisterpoort, zodat de poortentabel uit de
#     runbook blijft kloppen. Wat niet in die tabel staat, houdt zijn poort uit compose.yaml
#     (de dev-stubs) respectievelijk toxiproxy/proxies.json (de proxy-listeners).
#  3. Geen healthchecks en `service_started` als wachtconditie: podman voert healthchecks uit via
#     systemd-timers, en juist in de omgevingen die deze overlay nodig hebben draait geen systemd
#     — de status blijft dan eeuwig 'starting' en `condition: service_healthy` loopt vast.
#  4. Bestanden uit `demo/generated/` wijzen naar 127.0.0.1: de toxiproxy-definities krijgen hier
#     een eigen bestandsnaam, het magazijnregister wordt onder dezelfde naam herschreven en is
#     daarom hier niet zichtbaar. `demo/podman-prepare.sh hostnet` maakt beide.
services:
  redis:
    network_mode: host
    ports: !reset []
    healthcheck: !reset null
    # redis-stack-server start zonder bind op alle interfaces; in een gedeelde netns is dat de hele
    # machine, en deze Redis heeft geen wachtwoord.
    command: ["redis-stack-server", "--bind", "127.0.0.1"]

  magazijn-a:
    network_mode: host
    ports: !reset []
    command: ["--bind-address", "127.0.0.1", "--port", "8081", "--verbose", "--global-response-templating"]

  magazijn-b:
    network_mode: host
    ports: !reset []
    command: ["--bind-address", "127.0.0.1", "--port", "8082", "--verbose", "--global-response-templating"]

  profiel-service:
    network_mode: host
    ports: !reset []
    command: ["--bind-address", "127.0.0.1", "--port", "8089", "--verbose"]

  aanmeld-stub:
    network_mode: host
    ports: !reset []
    command: ["--bind-address", "127.0.0.1", "--port", "8083", "--verbose", "--global-response-templating"]

  notificatie-stub:
    network_mode: host
    ports: !reset []
    command: ["--bind-address", "127.0.0.1", "--port", "8084", "--verbose", "--global-response-templating"]

  postgres-a:
    network_mode: host
    ports: !reset []
    healthcheck: !reset null
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]

  # PGPORT verplaatst zowel de server als pg_isready naar 5433; in een gedeelde netns kan de
  # tweede Postgres niet óók op 5432 luisteren.
  postgres-b:
    network_mode: host
    ports: !reset []
    healthcheck: !reset null
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      PGPORT: "5433"

  # Idem voor het LDV-logboek: 5434 is ook het adres dat de dev-profielen als default gebruiken.
  # De magazijnen loggen in hun eigen datasource en volgen dus DB_JDBC_URL; alleen de uitvraag
  # krijgt hierboven een expliciete URL, omdat compose.yaml daar de container-DNS-naam zet.
  postgres-uitvraag:
    network_mode: host
    ports: !reset []
    healthcheck: !reset null
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      PGPORT: "5434"

  toxiproxy:
    network_mode: host
    ports: !reset []
    command: ["-host=127.0.0.1", "-config=/proxies.json"]
    volumes:
      - ./demo/generated/proxies-host.json:/proxies.json:ro,z

  magazijn-stubs:
    network_mode: host
    ports: !reset []
    command: ["--bind-address", "127.0.0.1", "--port", "8092", "--verbose"]

  berichtenmagazijn-a:
    network_mode: host
    ports: !reset []
    depends_on:
      postgres-a:
        condition: service_started
    environment:
      # 0.0.0.0 uit de basis zou in een gedeelde netns op élke interface van de machine binden.
      QUARKUS_HTTP_HOST: 127.0.0.1
      DB_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/berichtenmagazijn
      AANMELD_URL: http://127.0.0.1:18086/api/v1/aanmeldingen
      NOTIFICATIE_URL: http://127.0.0.1:18084/events
      PROFIEL_SERVICE_URL: http://127.0.0.1:8089

  berichtenmagazijn-b:
    network_mode: host
    ports: !reset []
    depends_on:
      postgres-b:
        condition: service_started
    environment:
      # 0.0.0.0 uit de basis zou in een gedeelde netns op élke interface van de machine binden.
      QUARKUS_HTTP_HOST: 127.0.0.1
      # Beide magazijnen luisteren in de basis op 8090; b wijkt hier uit naar zijn eigen poort.
      QUARKUS_HTTP_PORT: "8091"
      DB_JDBC_URL: jdbc:postgresql://127.0.0.1:5433/berichtenmagazijn
      AANMELD_URL: http://127.0.0.1:18086/api/v1/aanmeldingen
      NOTIFICATIE_URL: http://127.0.0.1:18084/events
      PROFIEL_SERVICE_URL: http://127.0.0.1:8089

  berichtenuitvraag:
    network_mode: host
    ports: !reset []
    # Het grant-hash per magazijn komt uit de contract-bootstrap van de federatie
    # (demo/environment/federatie/contracts/fbs-contracten.sh). Ontbreekt het bestand — geen
    # federatie op deze machine — dan start de stack gewoon zonder, en valt de uitvraag terug op
    # rechtstreeks verkeer: `magazijnen."<OIN>".grantHash` leeg betekent "geen FSC-headers".
    env_file:
      - path: demo/generated/fsc-grants.env
        required: false
    depends_on:
      redis:
        condition: service_started
      # Deze overlay reset élke healthcheck (podman draait die via systemd-timers, en juist in de
      # omgevingen die hostnet nodig hebben ontbreekt systemd). Een `condition: service_healthy`
      # die uit de basis blijft staan, faalt dan met "has no healthcheck configured" — en omdat
      # depends_on per sleutel gemerged wordt, moet elke wachtende sleutel hier expliciet terug.
      postgres-uitvraag:
        condition: service_started
    environment:
      # 0.0.0.0 uit de basis zou in een gedeelde netns op élke interface van de machine binden.
      QUARKUS_HTTP_HOST: 127.0.0.1
      REDIS_HOSTS: redis://127.0.0.1:16379
      # Default: rechtstreeks via toxiproxy, zodat de storing-knop van de demo werkt. Zet
      # MAGAZIJN_A_URL op de outway van de federatie (http://127.20.1.5:8443) om dit magazijn via
      # de FSC-keten te laten lopen; het grant-hash komt dan uit env_file hierboven.
      MAGAZIJN_A_URL: ${MAGAZIJN_A_URL:-http://127.0.0.1:18090}
      MAGAZIJN_B_URL: http://127.0.0.1:18091
      PROFIEL_SERVICE_URL: http://127.0.0.1:18089
      LDV_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5434/ldv_logging

  demo-console:
    network_mode: host
    ports: !reset []
    depends_on:
      redis:
        condition: service_started
    environment:
      # 0.0.0.0 uit de basis zou in een gedeelde netns op élke interface van de machine binden.
      QUARKUS_HTTP_HOST: 127.0.0.1
      TOXIPROXY_ADMIN_URL: http://127.0.0.1:8474
      REDIS_HOSTS: redis://127.0.0.1:6379
      UITVRAAG_URL: http://127.0.0.1:8086
      MAGAZIJN_A_URL: http://127.0.0.1:8090
      MAGAZIJN_B_URL: http://127.0.0.1:8091
      MAGAZIJN_A_DB_URL: jdbc:postgresql://127.0.0.1:5432/berichtenmagazijn
      MAGAZIJN_B_DB_URL: jdbc:postgresql://127.0.0.1:5433/berichtenmagazijn
      MAGAZIJN_STUBS_ADMIN_URL: http://127.0.0.1:8092
