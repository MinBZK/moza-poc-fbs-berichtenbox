description:
  nl:
    localisedName: MOZa PoC Federatief Berichtenstelsel
    shortDescription: >-
      PoC Federatief Berichtenstelsel voor MijnOverheid Zakelijk (MOZa).
    longDescription: >
      Deze Proof of Concept ontvangt, slaat op en haalt berichten op
      binnen MijnOverheid Zakelijk volgens het Federatief
      Berichtenstelsel (FBS) en bestaat uit de volgende onderdelen:

      - Berichtenmagazijn

      - Berichtenuitvraag


      Deze repository bevat de broncode van de PoC Federatief
      Berichtenstelsel. Het MOZa-project bestaat uit meerdere repositories
      binnen de MinBZK organisatie, te herkennen aan de moza- prefix of
      het topic mijnoverheidzakelijk.
    features:
      - Ontvangen en opslaan van berichten
      - Federatief ophalen van berichten bij alle magazijnen van een ontvanger
      - Streamen van de voortgang van een uitvraag
  en:
    shortDescription: >-
      PoC Federatief Berichtenstelsel (Federated Messaging System) for
      "MijnOverheid Zakelijk" (MOZa).
    longDescription: >
      This Proof of Concept receives, stores and retrieves messages
      within "MijnOverheid Zakelijk" following the Federatief
      Berichtenstelsel (FBS, Federated Messaging System) and consists of
      the following components:

      - Message store (berichtenmagazijn)

      - Message retrieval (berichtenuitvraag)


      This repository contains the source code of the PoC Federatief
      Berichtenstelsel. The MOZa project consists of multiple repositories
      within the MinBZK organisation, identifiable by the moza- prefix or
      the mijnoverheidzakelijk topic.
    features:
      - Receiving and storing messages
      - Federated retrieval of messages from all of a recipient's message stores
      - Streaming the progress of a retrieval
