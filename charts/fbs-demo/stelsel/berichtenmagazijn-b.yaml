#
# Magazijn B (Belastingdienst) in de demo, als release `berichtenmagazijn-b` van charts/fbs-dienst,
# na diensten/berichtenmagazijn.yaml en stelsel/berichtenmagazijn.yaml. Mee te geven:
# --set demo.basisdomein=<basisdomein van fbs-demo>, --set ingress.hostname=berichtenmagazijn-b.<basisdomein>
# en de image-tag. De OIN staat ook in het register van de uitvraag en in het paneel.

dienst:
  env:
    MAGAZIJN_OIN: "00000001823288444000"
    # Gelijk aan database.schemas.magazijnB van fbs-demo: het paneel leegt dit schema.
    DB_SCHEMA: magazijn_b
