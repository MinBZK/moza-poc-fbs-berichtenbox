{{- /*
SPDX-License-Identifier: EUPL-1.2

Faalt de render bij values waarmee de demo in het cluster niet kan werken. Een fout bij
`helm template` komt vóór de uitrol boven; een fout in het cluster pas als een pod niet start of
een knop niets doet.
*/}}
{{- $fouten := list }}
{{- $v := .Values }}
{{- if not $v.basisdomein }}
{{- $fouten = append $fouten "basisdomein is verplicht, bijvoorbeeld fbs.1-2-3-4.sslip.io: elke route krijgt <naam>.<basisdomein>" }}
{{- else if not (regexMatch "^([a-z0-9]([-a-z0-9]*[a-z0-9])?\\.)+[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $v.basisdomein) }}
{{- $fouten = append $fouten (printf "basisdomein %q is geen DNS-naam in kleine letters" $v.basisdomein) }}
{{- end }}
{{- if not $v.cluster.gateway.name }}
{{- $fouten = append $fouten "cluster.gateway.name is verplicht: de routes hangen eraan, en de NetworkPolicy laat zijn proxy's binnen" }}
{{- end }}
{{- if not $v.cluster.gateway.sectionName }}
{{- $fouten = append $fouten "cluster.gateway.sectionName is verplicht: zonder hangt een route ook aan een listener zonder TLS" }}
{{- end }}
{{- if not $v.images.tag }}
{{- $fouten = append $fouten "images.tag is verplicht: dezelfde tag als de stelseldiensten, main-<sha7> of pr-<n>-<sha7>" }}
{{- else if not (regexMatch "^(main|pr-[0-9]+)-[0-9a-f]{7}(-[rk][0-9]+)*$" (toString $v.images.tag)) }}
{{- $fouten = append $fouten (printf "images.tag %q is geen main-<sha7> of pr-<n>-<sha7> (eventueel met -r<n>/-k<n>): een meebewegende tag laat een herinstallatie stil een ander image draaien" (toString $v.images.tag)) }}
{{- end }}
{{- range $naam := list "portaal" "nginx" "toxiproxy" "redis" }}
{{- $ref := toString (get $v.images $naam) }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" $ref) }}
{{- $fouten = append $fouten (printf "images.%s %q staat niet op digest; neem voor het portaal de regel uit compose.yaml" $naam $ref) }}
{{- end }}
{{- end }}
{{- if not (regexMatch "(?m)^magazijnen\\." (toString $v.magazijnenregister)) }}
{{- $fouten = append $fouten "magazijnenregister is leeg of bevat geen magazijnen: geef demo/generated/magazijnen-register.properties mee met --set-file" }}
{{- end }}
{{- if not (regexMatch "(?m)^magazijnsimulator\\.magazijnen\\." (toString $v.simulatorSet)) }}
{{- $fouten = append $fouten "simulatorSet is leeg of bevat geen magazijnen: geef demo/generated/magazijn-simulator.properties mee met --set-file" }}
{{- end }}
{{- /* Een poortnaam of andere tekst in plaats van een nummer laat de NetworkPolicy stil iets
     anders doorlaten dan de bedoeling. */}}
{{- range $sleutel := list "servicePoort" "uitvraagPoort" "magazijnPoort" }}
{{- $poort := get $v.stelsel $sleutel }}
{{- if not (or (kindIs "float64" $poort) (kindIs "int64" $poort) (kindIs "int" $poort)) }}
{{- $fouten = append $fouten (printf "stelsel.%s is geen poortnummer" $sleutel) }}
{{- end }}
{{- end }}
{{- /* Aangemelde magazijnen: alleen de twee regels per OIN, zodat er via het register geen andere
     instelling van uitvraag of stelselregister mee kan. Een naam die op een backslash eindigt, laat
     de volgende regel aansluiten (properties-formaat), en Java leest ook CR als regeleinde: geen
     stuurtekens. Een OIN uit het gegenereerde register zou twee keer voorkomen. */}}
{{- $aanmeldingen := $v.aanmeldingen | default dict }}
{{- $aangemeld := dict }}
{{- range $regel := splitList "\n" (toString $aanmeldingen.register) }}
{{- $regel = trim $regel }}
{{- if and $regel (not (hasPrefix "#" $regel)) }}
{{- if not (regexMatch "^magazijnen\\.\"[0-9]{20}\"\\.(url=https://[^\\s\\x00-\\x1f\\x7f\\\\]+|naam=[^\\s\\x00-\\x1f\\x7f]([^\\x00-\\x1f\\x7f\\\\]|\\\\[^\\x00-\\x1f\\x7f])*)$" $regel) }}
{{- $fouten = append $fouten (printf "aanmeldingen.register: %q is geen regel magazijnen.\"<OIN>\".url=https://... of magazijnen.\"<OIN>\".naam=..." $regel) }}
{{- else }}
{{- $oin := regexFind "[0-9]{20}" $regel }}
{{- $soort := ternary "url" "naam" (contains "\".url=" $regel) }}
{{- $velden := get $aangemeld $oin | default list }}
{{- if has $soort $velden }}
{{- $fouten = append $fouten (printf "aanmeldingen.register: %s.%s staat er twee keer in" $oin $soort) }}
{{- end }}
{{- $_ := set $aangemeld $oin (append $velden $soort) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $oin := keys $aangemeld | sortAlpha }}
{{- if ne (len (get $aangemeld $oin)) 2 }}
{{- $fouten = append $fouten (printf "aanmeldingen.register: %s heeft niet zowel url als naam" $oin) }}
{{- end }}
{{- if contains (printf "magazijnen.\"%s\"." $oin) (toString $v.magazijnenregister) }}
{{- $fouten = append $fouten (printf "aanmeldingen.register: %s staat al in het gegenereerde magazijnenregister" $oin) }}
{{- end }}
{{- end }}
{{- $ontvangers := list }}
{{- range $i, $o := $aanmeldingen.optIns | default list }}
{{- if not (regexMatch "^(KVK|BSN):[0-9]{8,9}$" (toString $o.ontvanger)) }}
{{- $fouten = append $fouten (printf "aanmeldingen.optIns[%d].ontvanger %q is geen KVK:<nummer> of BSN:<nummer>" $i (toString $o.ontvanger)) }}
{{- else if has $o.ontvanger $ontvangers }}
{{- $fouten = append $fouten (printf "aanmeldingen.optIns: %s staat er twee keer in" $o.ontvanger) }}
{{- end }}
{{- $ontvangers = append $ontvangers $o.ontvanger }}
{{- if not $o.oins }}
{{- $fouten = append $fouten (printf "aanmeldingen.optIns[%d] heeft geen oins" $i) }}
{{- end }}
{{- range $oin := $o.oins | default list }}
{{- if not (hasKey $aangemeld (toString $oin)) }}
{{- $fouten = append $fouten (printf "aanmeldingen.optIns[%d]: %v is geen aangemeld magazijn" $i $oin) }}
{{- end }}
{{- end }}
{{- $voorkeur := false }}
{{- if kindIs "map" $o.basis }}
{{- range $o.basis.voorkeuren | default list }}{{ if eq .voorkeurType "OntvangViaBerichtenbox" }}{{ $voorkeur = true }}{{ end }}{{ end }}
{{- end }}
{{- if not $voorkeur }}
{{- $fouten = append $fouten (printf "aanmeldingen.optIns[%d].basis heeft geen voorkeur OntvangViaBerichtenbox" $i) }}
{{- end }}
{{- end }}
{{- if $fouten }}
{{- fail (printf "\nVALUES ONGELDIG:\n- %s" (join "\n- " $fouten)) }}
{{- end }}
