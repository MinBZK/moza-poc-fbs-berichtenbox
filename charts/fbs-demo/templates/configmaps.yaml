{{- include "fbs-demo.configmaps" . }}

{{- define "fbs-demo.configmaps" -}}
{{- $r := .Release.Name -}}
---
# Het magazijnregister van de uitvraag en het stelselregister: de gesimuleerde magazijnen. Die
# twee releases mounten hem als config/application.properties (zie stelsel/).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r }}-magazijnenregister
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "fbs-demo.labels" (dict "context" . "onderdeel" "magazijnenregister") | nindent 4 }}
data:
  application.properties: {{ .Values.magazijnenregister | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r }}-simulator-set
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "fbs-demo.labels" (dict "context" . "onderdeel" "simulator") | nindent 4 }}
data:
  application.properties: {{ .Values.simulatorSet | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r }}-demo-proxy
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "fbs-demo.labels" (dict "context" . "onderdeel" "demo-proxy") | nindent 4 }}
data:
  default.conf.template: |
    {{- include "fbs-demo.proxyConfig" . | nindent 4 }}
{{- end -}}

{{- /*
De demo-proxy: één origin voor berichtenbox, paneel, personalijst en uitvraag, zoals
demo/proxy/demo.conf.template lokaal. Twee verschillen: het paneel staat achter een wachtwoord,
en de bestemmingen staan in variabelen met een resolver. Zo start nginx ook als een bestemming
(de uitvraag, een andere release) nog niet bestaat, en volgt hij een nieuw adres van een Service.
${NGINX_LOCAL_RESOLVERS} vult het entrypoint van nginx in; de rest laat envsubst staan.
*/}}
{{- define "fbs-demo.proxyConfig" -}}
{{- $s := .Values.stelsel -}}
{{- $proeftuin := include "fbs-demo.fqdn" (dict "context" . "naam" (include "fbs-demo.naam" (dict "context" . "onderdeel" "proeftuin"))) -}}
{{- $console := include "fbs-demo.fqdn" (dict "context" . "naam" (include "fbs-demo.naam" (dict "context" . "onderdeel" "console"))) -}}
{{- $personas := include "fbs-demo.fqdn" (dict "context" . "naam" (include "fbs-demo.naam" (dict "context" . "onderdeel" "personas"))) -}}
{{- $uitvraag := include "fbs-demo.fqdn" (dict "context" . "naam" $s.uitvraag) -}}
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    set $proeftuin http://{{ $proeftuin }}:8080;
    set $console http://{{ $console }}:8095;
    set $personas http://{{ $personas }}:8098;
    set $uitvraag http://{{ $uitvraag }}:{{ $s.servicePoort }};

    # Niets bewaren: de onderdelen worden tijdens het werken eraan vervangen.
    add_header Cache-Control "no-store" always;

    # Na het inloggen op het paneel stuurt de browser het wachtwoord bij elk verzoek naar deze
    # origin mee. Geen enkele bestemming heeft het nodig. Een location met een eigen
    # proxy_set_header erft dit niet, dus die herhalen het.
    proxy_set_header Authorization "";

    location = /_gezond {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $proeftuin;
    }

    # Het paneel kan de magazijnen legen; op een publieke Gateway hoort het achter een wachtwoord.
    location /bediening/ {
        auth_basic "Bedieningspaneel FBS-demo";
        auth_basic_user_file /etc/nginx/bediening/htpasswd;
        rewrite ^/bediening/(.*)$ /$1 break;
        proxy_pass $console;
    }

    # De testaccounts voor de berichtenbox: het enige pad onder /api/demo dat die gebruikt, en
    # daarom zonder wachtwoord. Een exacte match; nginx normaliseert het pad vóór het matchen.
    location = /api/demo/personas {
        proxy_pass $personas;
    }

    # Het gereedschap van het paneel: storingen, vullen, legen.
    location /api/demo/ {
        auth_basic "Bedieningspaneel FBS-demo";
        auth_basic_user_file /etc/nginx/bediening/htpasswd;
        proxy_pass $console;
    }

    # Een bijlage opent de berichtenbox met een gewone link, zonder eigen header: ontvanger en
    # sessie komen uit de cookies. HTTP/1.1, anders is een afgebroken download niet van een
    # volledige te onderscheiden.
    location ~ ^/api/v1/berichten/[^/]+/bijlagen/[^/]+$ {
        proxy_pass $uitvraag;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header X-Ontvanger $cookie_ontvanger;
        proxy_set_header X-Sessie $cookie_sessie;
    }

    # De ophaalronde is een SSE-stream: zonder buffering, en met een lange read-timeout.
    location /api/v1/ {
        proxy_pass $uitvraag;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
{{- end -}}
