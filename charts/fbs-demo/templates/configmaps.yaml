{{- include "fbs-demo.configmaps" . }}

{{- define "fbs-demo.configmaps" -}}
{{- $r := .Release.Name -}}
---
# Het magazijnregister van de uitvraag en het stelselregister: de gesimuleerde magazijnen, en daarna
# wat `aanmelden` erbij zette. Die twee releases mounten hem als config/application.properties (zie
# stelsel/).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r }}-magazijnenregister
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "fbs-demo.labels" (dict "context" . "onderdeel" "magazijnenregister") | nindent 4 }}
data:
  application.properties: {{ include "fbs-demo.register" . | quote }}
---
# Opt-ins voor aangemelde magazijnen, als WireMock-mappings naast de stubs uit het image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r }}-profiel-aanmeldingen
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "fbs-demo.labels" (dict "context" . "onderdeel" "aanmeldingen") | nindent 4 }}
data:
  aanmeldingen.json: {{ include "fbs-demo.optInMappings" . | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r }}-simulator-set
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "fbs-demo.labels" (dict "context" . "onderdeel" "simulator") | nindent 4 }}
data:
  application.properties: {{ .Values.simulatorSet | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r }}-demo-proxy
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "fbs-demo.labels" (dict "context" . "onderdeel" "demo-proxy") | nindent 4 }}
data:
  default.conf.template: |
    {{- include "fbs-demo.proxyConfig" . | nindent 4 }}
{{- end -}}

{{- /*
De demo-proxy: één origin voor berichtenbox, paneel, personalijst en uitvraag, zoals
demo/proxy/demo.conf.template lokaal. Twee verschillen: het paneel staat achter een wachtwoord,
en de bestemmingen staan in variabelen met een resolver. Zo start nginx ook als een bestemming
(de uitvraag, een andere release) nog niet bestaat, en volgt hij een nieuw adres van een Service.
${NGINX_LOCAL_RESOLVERS} vult het entrypoint van nginx in; de rest laat envsubst staan.
*/}}
{{- define "fbs-demo.proxyConfig" -}}
{{- $s := .Values.stelsel -}}
{{- $proeftuin := include "fbs-demo.fqdn" (dict "context" . "naam" (include "fbs-demo.naam" (dict "context" . "onderdeel" "proeftuin"))) -}}
{{- $console := include "fbs-demo.fqdn" (dict "context" . "naam" (include "fbs-demo.naam" (dict "context" . "onderdeel" "console"))) -}}
{{- $personas := include "fbs-demo.fqdn" (dict "context" . "naam" (include "fbs-demo.naam" (dict "context" . "onderdeel" "personas"))) -}}
{{- $uitvraag := include "fbs-demo.fqdn" (dict "context" . "naam" $s.uitvraag) -}}
# Het paneel en zijn gereedschap tegen CSRF. De browser stuurt een opgeslagen wachtwoord ook mee
# bij een verzoek dat een andere site veroorzaakt. Twee signalen, want een oude browser stuurt het
# eerste niet:
# - Sec-Fetch-Site: same-site telt als vreemd, want de andere hostnamen onder het basisdomein zijn
#   dezelfde site. Een gewone link naar het paneel (navigatie met GET) mag wel: die wijzigt niets,
#   en anders werkt een gedeelde link niet;
# - Origin: een browser zet die bij elke POST, ook zonder fetch-metadata. Leeg (een link, curl) mag;
#   anders moet hij https zijn en gelijk aan de host van het verzoek.
map "$http_sec_fetch_site:$http_sec_fetch_mode:$request_method" $paneel_van_andere_site {
    default 0;
    "~^(cross-site|same-site):navigate:GET$" 0;
    "~^(cross-site|same-site):" 1;
}

map "$http_sec_fetch_site" $gereedschap_van_andere_site {
    default 0;
    cross-site 1;
    same-site 1;
}

map "$http_origin|$http_host" $andere_origin {
    default 1;
    "~^\|" 0;
    "~^https://([^|]+)\|\1$" 0;
}

server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    set $proeftuin http://{{ $proeftuin }}:8080;
    set $console http://{{ $console }}:8095;
    set $personas http://{{ $personas }}:8098;
    set $uitvraag http://{{ $uitvraag }}:{{ $s.servicePoort }};

    # Niets bewaren: de onderdelen worden tijdens het werken eraan vervangen.
    add_header Cache-Control "no-store" always;

    # Alleen over https; de Gateway luistert voor Let's Encrypt ook op 80. De uitvraag zet zelf HSTS
    # met includeSubDomains en preload. Dat hoort niet op een basisdomein van sslip.io, en zonder
    # proxy_hide_header kreeg dat antwoord de header twee keer. Eén eigen waarde voor elk pad.
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security;

    # Na het inloggen op het paneel stuurt de browser het wachtwoord bij elk verzoek naar deze
    # origin mee. Geen enkele bestemming heeft het nodig. Een location met een eigen
    # proxy_set_header erft dit niet, dus die herhalen het.
    proxy_set_header Authorization "";

    location = /_gezond {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $proeftuin;
    }

    # Het paneel kan de magazijnen legen; op een publieke Gateway hoort het achter een wachtwoord.
    location /bediening/ {
        if ($paneel_van_andere_site) {
            return 403;
        }
        if ($andere_origin) {
            return 403;
        }
        auth_basic "Bedieningspaneel FBS-demo";
        auth_basic_user_file /etc/nginx/bediening/htpasswd;
        rewrite ^/bediening/(.*)$ /$1 break;
        proxy_pass $console;
    }

    # De testaccounts voor de berichtenbox: het enige pad onder /api/demo dat die gebruikt, en
    # daarom zonder wachtwoord. Een exacte match; nginx normaliseert het pad vóór het matchen.
    location = /api/demo/personas {
        proxy_pass $personas;
    }

    # Het gereedschap van het paneel: storingen, vullen, legen.
    location /api/demo/ {
        if ($gereedschap_van_andere_site) {
            return 403;
        }
        if ($andere_origin) {
            return 403;
        }
        auth_basic "Bedieningspaneel FBS-demo";
        auth_basic_user_file /etc/nginx/bediening/htpasswd;
        proxy_pass $console;
    }

    # Een bijlage opent de berichtenbox met een gewone link, zonder eigen header: ontvanger en
    # sessie komen uit de cookies. HTTP/1.1, anders is een afgebroken download niet van een
    # volledige te onderscheiden.
    location ~ ^/api/v1/berichten/[^/]+/bijlagen/[^/]+$ {
        proxy_pass $uitvraag;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Origin "";
        proxy_set_header X-Ontvanger $cookie_ontvanger;
        proxy_set_header X-Sessie $cookie_sessie;
    }

    # De webhook waarmee een magazijn een nieuw bericht aanmeldt. Hij vraagt geen sessie, dus wie
    # hem bereikt, zet een bericht in de sessiecache. De browser gebruikt hem nooit; de magazijnen
    # komen via de route `aanmelding`. Een prefix met ^~: de uitvraag leest ook
    # aanmeldingen;x en aanmeldingen/ als dit pad.
    location ^~ /api/v1/aanmeldingen {
        return 404;
    }

    # De ophaalronde is een SSE-stream: zonder buffering, en met een lange read-timeout.
    location /api/v1/ {
        proxy_pass $uitvraag;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        # Geen Origin naar de uitvraag, zoals de proeftuin: de browser deed de same-origin-toets hier
        # al, en zo hoeft deze origin niet op een CORS-lijst als CORS op de uitvraag aanstaat.
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
{{- end -}}

{{- /*
Het gegenereerde register met de aangemelde magazijnen erachter. Een sleutel die twee keer
voorkomt, weigert validatie.yaml: welke dan telt, hangt af van de lezer.
*/}}
{{- define "fbs-demo.register" -}}
{{- $register := .Values.magazijnenregister -}}
{{- with .Values.aanmeldingen.register -}}
{{- $register = printf "%s\n# Aangemeld met charts/demo-op-fundament.sh aanmelden\n%s\n" (trimSuffix "\n" $register) (trim .) -}}
{{- end -}}
{{- $register -}}
{{- end -}}

{{- /*
Per ontvanger een mapping met voorrang 0: die wint van de stubs uit het image (1 voor de
gegenereerde ondernemers, 5 voor de persona's). Het antwoord is `basis` met de OIN's erbij in de
voorkeur OntvangViaBerichtenbox; een OIN die er al in staat, komt er niet twee keer in.
*/}}
{{- define "fbs-demo.optInMappings" -}}
{{- $mappings := list -}}
{{- range .Values.aanmeldingen.optIns -}}
{{- $soort := index (splitList ":" .ontvanger) 0 -}}
{{- $nummer := index (splitList ":" .ontvanger) 1 -}}
{{- $antwoord := deepCopy .basis -}}
{{- $oins := .oins -}}
{{- range $antwoord.voorkeuren -}}
{{- if eq .voorkeurType "OntvangViaBerichtenbox" -}}
{{- $scopes := .scopes | default list -}}
{{- $bekend := list -}}
{{- range $scopes }}{{ $bekend = append $bekend .partij.identificatieNummer }}{{ end -}}
{{- range $oin := $oins -}}
{{- if not (has $oin $bekend) -}}
{{- $scopes = append $scopes (dict "partij" (dict "identificatieType" "OIN" "identificatieNummer" $oin)) -}}
{{- end -}}
{{- end -}}
{{- $_ := set . "scopes" $scopes -}}
{{- end -}}
{{- end -}}
{{- $mappings = append $mappings (dict
  "priority" 0
  "request" (dict
    "method" "POST"
    "url" "/api/profielservice/v1/partij"
    "bodyPatterns" (list
      (dict "matchesJsonPath" (printf "$[?(@.identificatieType == '%s')]" $soort))
      (dict "matchesJsonPath" (printf "$[?(@.identificatieNummer == '%s')]" $nummer))))
  "response" (dict
    "status" 200
    "headers" (dict "Content-Type" "application/json")
    "jsonBody" $antwoord)) -}}
{{- end -}}
{{- toJson (dict "mappings" $mappings) -}}
{{- end -}}
