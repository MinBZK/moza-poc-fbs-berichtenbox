# Overlay om het portaal uit een lokale checkout te draaien in plaats van uit het gepubliceerde
# image. Bedoeld voor werk aan de koppeling: compose bouwt het image met het Dockerfile van die
# checkout, dus de demo draait precies wat daar staat, met dezelfde omgeving als de pin.
# `--build` bouwt opnieuw na een wijziging; zonder start compose het vorige lokale image.
#
#   PORTAAL_PAD=~/projects/moza-portaal \
#     demo/up.sh compose -f compose.portaal-lokaal.yaml up -d --build portaal
services:
  portaal:
    image: localhost/moza-portaal-lokaal
    build:
      context: ${PORTAAL_PAD:-../moza-portaal}
